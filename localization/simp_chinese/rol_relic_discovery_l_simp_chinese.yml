l_simp_chinese:
 rol_relic_discovery.1000.t:0 "战神的密道"
 rol_relic_discovery.1000.desc:0 "你在罗马的工事整修中发现了一段被封死的古代通道。石门上的军团纹饰与战神神印依稀可辨，仿佛在等待下一位敢于下令开启的人。"
 rol_relic_discovery.1000.a:0 "封锁现场，准备远征。"

 rol_relic_discovery.1100.t:0 "灰烬下的女神铭文"
 rol_relic_discovery.1100.desc:0 "阿提卡旧神庙的地下库室中，学者辨认出一段提及雅典娜圣物的古铭。传闻称，真正的礼器仍埋藏在塌陷祭坛深处。"
 rol_relic_discovery.1100.a:0 "记录传说，日后必取。"

 rol_relic_discovery.1200.t:0 "沙海中的冥府封印"
 rol_relic_discovery.1200.desc:0 "吉萨附近的墓道中，工匠挖出刻有豺狼首图腾的封石。祭司称这是通往阿努比斯圣饰的旧封印，轻启者或得神佑，或遭诅咒。"
 rol_relic_discovery.1200.a:0 "先封存，再筹备队伍。"

 rol_relic_discovery.1300.t:0 "慕尼黑的异象"
 rol_relic_discovery.1300.desc:0 "深秋地震撕开了慕尼黑城郊的谷地，矿工在地下挖出了发着幽蓝微光的“热冰”。幸存者神志混乱，只会重复一句话：群星在地下运转。你从古老羊皮卷中找到了对应的记载——尼伯龙根星界球或许真的存在。"
 rol_relic_discovery.1300.a:0 "召集心腹，准备下探。"

 rol_relic_discovery.1400.t:0 "泰拉地下宫殿的线索"
 rol_relic_discovery.1400.desc:0 "你在纳克索斯与泰拉（Thera）的地契档案中发现了异常记录：罗马晚期曾在火山岩层下修建一座“皇帝宫殿”，并以禁军誓令封锁核心区。传闻这座宫殿曾左右帝国兴衰。"
 rol_relic_discovery.1400.a:0 "准备远征泰拉地宫。"
