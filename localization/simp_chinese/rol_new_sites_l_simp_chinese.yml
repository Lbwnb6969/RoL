l_simp_chinese:
 rol_alexandria_archive_decision:0 "寻找亚历山大城的遗失档案"
 rol_alexandria_archive_decision_desc:0 "港口仓库下发现了一批残破账册。也许它们能重建一条被遗忘的商路。"
 rol_alexandria_archive_decision_tooltip:0 "调查遗失的港口档案，完成整理需要100金币。"
 rol_alexandria_archive_decision_confirm:0 "派人调查"
 rol_jerusalem_watch_decision:0 "寻访耶路撒冷的古道守卫"
 rol_jerusalem_watch_decision_desc:0 "朝圣者讲述着一支守护山路的旧卫队，他们的操练方法仍留在石堡中。"
 rol_jerusalem_watch_decision_tooltip:0 "寻找旧卫队的操练记录，重建传统需要100金币。"
 rol_jerusalem_watch_decision_confirm:0 "寻找石堡"
 rol_new_sites.0001.t:0 "埋在港口下的账册"
 rol_new_sites.0001.desc:0 "潮水浸透了仓库的地基，工人却从封死的地窖中找出一箱账册。货物的名称已经模糊，码头和商人的印记仍然可辨。港务官认为，整理这些记录可以帮助商人重新找到可靠的贸易伙伴；代价是雇用抄写员并修复仓库。"
 rol_new_sites.0001.a:0 "出资整理，让港口重新繁荣。"
 rol_new_sites.0010.t:0 "古道上的石堡"
 rol_new_sites.0010.desc:0 "山路旁的废堡没有藏着传说中的黄金。它的库房里却保留着训练木牌、盾墙图谱和守路人留下的名册。若聘请当地老兵教授这些方法，我便能重新建立这支卫队。"
 rol_new_sites.0010.a:0 "召集老兵，重建守路卫队。"
 rol_new_sites.leave:0 "暂时搁置此事。"
 rol_alexandria_archive_modifier:0 "重整的港口档案"
 rol_alexandria_archive_modifier_desc:0 "修复的账册帮助港口商人重新建立贸易联系。持续二十年。"
 rol_jerusalem_watch:0 "圣城古道卫队"
 rol_jerusalem_watch_flavor:0 "这些重步兵沿袭石堡守卫的盾墙操练，守护通往圣城的道路。"
