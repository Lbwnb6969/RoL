l_simp_chinese:
 rol_hangzhou_site_decision:0 "杭州：寻找湖底水图"
 rol_hangzhou_site_decision_desc:0 "湖岸工人发现刻有旧水道的石片。它们指向一套失传的治水图。"
 rol_hangzhou_site_decision_tooltip:0 "调查需25金币或10基础压力；修复另需100金币。可暂离后接续。"
 rol_hangzhou_site_decision_confirm:0 "寻找水图"
 rol_asian_sites.0100.t:0 "湖底的刻石"
 rol_asian_sites.0100.desc:0 "一块刻石从湖岸的淤泥中露出，石面上细细的线条汇向一个缺口。有人认定它是藏宝图；老渔民却说，那是早已淤塞的旧渠，祖辈曾靠闸门调节水位。若能找到另一半刻石，或许就能知道闸门的去向。"
 rol_asian_sites.0100.a:0 "沿旧渠追查。"
 rol_asian_sites.0101.t:0 "闸门与账册"
 rol_asian_sites.0101.desc:0 "沿着两块刻石拼出的线路，我们终于找到埋在泥沙里的闸门。石缝中藏着一册残损的工匠名录：每逢水涨，沿渠村落轮流清理淤泥；闸板断裂时，则由众村共同出资。这里没有金银，留下的却是一整套让田地与湖水共存的办法。\n\n修复闸门和水渠需要一笔钱，但能为杭州带来二十年的发展与税收收益。若只将图纸公之于众，我也能因这项发现获得声望。"
 rol_asian_sites.0102.t:0 "两村之间的旧渠"
 rol_asian_sites.0102.desc:0 "另一块刻石被用作桥基。桥两侧的村民都说旧渠属于自己：上游要水灌田，下游怕开闸淹没桑地。双方都保存着不完整的口述约定，谁也不肯先挪动桥石。\n\n我可以出钱请两村长者共同丈量并记下证词，也可以亲自在烈日下核对水位与地势，直到双方看到同一条旧水线。"
 rol_asian_sites.0102.a:0 "出钱请长者共同丈量。"
 rol_asian_sites.0102.b:0 "亲自核对水线。"
 rol_asian_sites.0101.a:0 "修复水道，惠及地方。"
 rol_asian_sites.0101.b:0 "保存图纸并公开发现。"
 rol_hangzhou_waterways:0 "修复的杭州水道"
 rol_hangzhou_waterways_desc:0 "重开的闸门和水渠帮助当地发展。持续二十年。"
 rol_yamashiro_site_decision:0 "山城：寻访山道弓手"
 rol_yamashiro_site_decision_desc:0 "山中旧道旁的练武场似乎留下了一支弓手的传承。"
 rol_yamashiro_site_decision_tooltip:0 "调查需25金币或10基础压力；重建另需100金币。可暂离后接续。"
 rol_yamashiro_site_decision_confirm:0 "前往山道"
 rol_asian_sites.0200.t:0 "林中的靶场"
 rol_asian_sites.0200.desc:0 "古道旁的靶场已被藤蔓覆盖，木靶上仍留着箭痕。当地人说，过去一支弓手队伍守护过这条连接山村的道路；队伍解散后，附近村落依旧轮流修桥。靶场的石基上刻着几个地点，或许能指向守路人的集会处。"
 rol_asian_sites.0200.a:0 "寻找守道人的记录。"
 rol_asian_sites.0201.t:0 "守道人的约定"
 rol_asian_sites.0201.desc:0 "集会处的木箱里，练习记录与修路约定包在一起。守路人不仅操练射术，还约定雨后先修桥，再护送旅人穿山。当地老兵愿意传授这些本领，但需要我出资重建练武场。\n\n若不重建，我可以公开这份约定，让守路人的名声流传下去。"
 rol_asian_sites.0202.t:0 "桥边的约定"
 rol_asian_sites.0202.desc:0 "通往集会处的木桥缺了几块踏板。山民愿意帮助我们，但不愿让外人误以为他们的祖辈只是为领主打仗：他们也保护往来的村民，并共同维护桥梁。\n\n我可以出钱修桥，让大家一起过河；也可以亲自沿溪寻找浅滩，带领随从涉水。"
 rol_asian_sites.0202.a:0 "雇人修复木桥。"
 rol_asian_sites.0202.b:0 "亲自寻找浅滩。"
 rol_asian_sites.0201.a:0 "重建练武场，招募山道弓手。"
 rol_asian_sites.0201.b:0 "公开记录，纪念守道人。"
 rol_angkor_site_decision:0 "吴哥：寻找蓄水池的守护者"
 rol_angkor_site_decision_desc:0 "古老蓄水池旁的铭文记载了维护水渠的职责。"
 rol_angkor_site_decision_tooltip:0 "调查需25金币或10基础压力；修复另需100金币。可暂离后接续。"
 rol_angkor_site_decision_confirm:0 "查访蓄水池"
 rol_asian_sites.0300.t:0 "水边的铭文"
 rol_asian_sites.0300.desc:0 "蓄水池边的石碑列着几个村落的名字，以及轮流维护堤岸的职责。碑文残缺处恰好记载着水渠的去向。雨季将至，村民带我去看一段被树根堵塞的引水渠，希望在大雨到来前找到出口。"
 rol_asian_sites.0300.a:0 "沿水渠调查。"
 rol_asian_sites.0301.t:0 "雨季之前"
 rol_asian_sites.0301.desc:0 "水渠尽头是一座废弃的分水闸。石槽与堤岸上还留着数代人维修的痕迹：先辈们并非一劳永逸地驯服了水，而是不断疏浚、协商和修补。\n\n出钱恢复分水闸能改善当地田地与税收；也可以抄录碑文，留下维护水渠的知识。"
 rol_asian_sites.0302.t:0 "雨季逼近"
 rol_asian_sites.0302.desc:0 "树根盘住渠口，浑水从破损堤岸溢出。附近村落各自忙着收拾田地，却都知道只修自家的一段不足以抵挡雨季。村中长者提出联合清理，只是工具和粮食需要有人先筹备。\n\n我可以出钱雇工准备，也可以亲自带人探查堤岸，寻找较容易疏通的位置。"
 rol_asian_sites.0302.a:0 "出资筹备工具和粮食。"
 rol_asian_sites.0302.b:0 "亲自勘察堤岸。"
 rol_asian_sites.0301.a:0 "修复分水闸。"
 rol_asian_sites.0301.b:0 "抄录铭文并公开发现。"
 rol_angkor_reservoir:0 "修复的吴哥水渠"
 rol_angkor_reservoir_desc:0 "疏通的水渠帮助农田和地方发展。持续二十年。"
 rol_baghdad_site_decision:0 "巴格达：追寻散佚的手稿"
 rol_baghdad_site_decision_desc:0 "书商发现一批残页，上面的批注暗示它们原属于同一部著作。"
 rol_baghdad_site_decision_tooltip:0 "调查需25金币或10基础压力；研究另需100金币。可暂离后接续。"
 rol_baghdad_site_decision_confirm:0 "拜访书商"
 rol_asian_sites.0400.t:0 "散页的线索"
 rol_asian_sites.0400.desc:0 "书商铺开几张残页：纸张大小不一，抄写者的笔迹也不同，页边却反复出现同一组星象观测数字。有人删改了结论，有人又将它补回。书商听说另一批残卷仍在一间旧藏书室中，愿意领我前去。"
 rol_asian_sites.0400.a:0 "追寻其余残卷。"
 rol_asian_sites.0401.t:0 "重聚的残卷"
 rol_asian_sites.0401.desc:0 "残卷重聚后，分歧反而更加清楚：几位抄写者根据不同观测修正了同一张表。一份看似完整的定稿，会掩盖他们之间的争论。\n\n我可以资助学者逐条比较异文，并参与研究；也可以公布残卷，让更多读者自行判断。"
 rol_asian_sites.0402.t:0 "藏书室的两份目录"
 rol_asian_sites.0402.desc:0 "旧藏书室的目录有两份，编号却对不上。保管人解释，一次搬迁后有人按作者排列，另一人按学科重新编目。残卷可能还在，只是藏在错误的卷帙之间。\n\n我可以聘请抄写员同时比对两份目录，也可以留下来亲自逐卷核验。"
 rol_asian_sites.0402.a:0 "聘请抄写员比对目录。"
 rol_asian_sites.0402.b:0 "亲自逐卷核验。"
 rol_asian_sites.0401.a:0 "资助整理与研究。"
 rol_asian_sites.0401.b:0 "公开残卷。"
 rol_asian_sites.leave:0 "暂时离开。"
 rol_asian_sites.epilogue_close:0 "将这段经历记入档案。"
 rol_asian_sites.0403.t:0 "残卷之间的空白"
 rol_asian_sites.0403.restored:0 "几份抄本被并排摆在桌上，没有哪一份被宣布为唯一的定稿。学者将不同的观测和批注逐条记下，我也在长久的讨论中学会辨别证据、追问错误的来源。\n\n我获得十年的学习+5与学习生活方式经验+25%。这些是亲自参与研究留下的收获，不会随爵位转交他人。"
 rol_asian_sites.0403.published:0 "残卷连同目录对照被交给抄写员，不同版本的结论都得到保留。未来的读者可以接着争论，而我因让这些文字重见天日获得声望。\n\n公开残卷让我获得100威望，未获得个人研究修正。本次调查已经结束。"
 rol_asian_sites.0303.t:0 "雨水有了去处"
 rol_asian_sites.0303.restored:0 "闸门清理完毕，第一场大雨顺着水渠流入蓄水池。沿岸村落重新划定维护的区段，将清淤的职责刻在碑文旁。旧水渠终于重新为田地所用。\n\n吴哥获得二十年的发展速度+35%与税收+20%。收益留在当地，不是附着于我个人的修正。"
 rol_asian_sites.0303.published:0 "铭文和水渠的走向被仔细抄录，村民留下关于雨季水位的见闻。修复工程没有开始，但维护水渠的知识得以保存。\n\n公开发现让我获得100威望，吴哥没有获得水渠修复收益。本次调查已经结束。"
 rol_asian_sites.0203.t:0 "山道重开"
 rol_asian_sites.0203.restored:0 "练武场重新竖起木靶，老兵开始传授守路人的射术。每次操练后，他们仍会检查桥梁与山道，正如木箱中的旧约所要求的那样。\n\n我已获得山道弓手的招募资格。它不会自动创建兵团：招募仍需支付金币，并占用兵士编制。这份资格属于我本人，不随爵位自动传给继承人。"
 rol_asian_sites.0203.published:0 "守路人的约定被抄写出来，连同修桥与护送旅人的职责一同传开。人们记住了他们的名字，练武场却仍旧荒芜。\n\n公开记录让我获得100威望，未解锁山道弓手。本次调查已经结束。"
 rol_asian_sites.0103.t:0 "水图的归处"
 rol_asian_sites.0103.restored:0 "闸板重新升起，清水沿旧渠流向田地。两村将丈量结果刻在渠边，今后轮流疏浚，不再只凭各自祖辈的记忆争论。\n\n杭州获得二十年的发展速度+35%与税收+20%。这段调查已经结束，我不必重新支付丈量或修复费用。"
 rol_asian_sites.0103.published:0 "抄写员将两块刻石上的线路拼成完整水图，也记下两村关于水位的证词。闸门暂未修复，但图纸不再埋在淤泥里。\n\n公开发现让我获得100威望；水道修复收益没有兑现。这次调查已经结束。"
 rol_baghdad_manuscripts:0 "整理巴格达残卷"
 rol_baghdad_manuscripts_desc:0 "比较抄本的异文促进了研究。持续十年。"
 rol_yamashiro_archers:0 "山道弓手"
 rol_yamashiro_recruitment_unlock_tt:0 "解锁山道弓手的个人招募资格；招募需另付费用并占用兵士编制。领主不能借用这项资格，继承人不自动获得。"
 rol_yamashiro_archers_flavor:0 "这些弓手沿袭守护山路的旧传统。"
