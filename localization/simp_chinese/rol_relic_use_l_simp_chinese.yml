l_simp_chinese:
 rol_relic_use.0001.t:0 "让传说参与今日"
 rol_relic_use.0001.desc:0 "取得圣物只是开始。我可以为一件实际持有的圣物安排明确用途，或整顿Naxos的训练传统。每次计划花费50金币，半年后可以记录经验或公开成果；立项后一年内不能再安排另一项。取消选择不收费。"
 rol_relic_use.cancel:0 "暂不作新的安排。"
 rol_relic_use_ready_tt:0 "需要成年、拥有50金币、没有待整理的计划，且距上次立项至少一年。"
 rol_relic_use.0004.t:0 "停止一项安排"
 rol_relic_use.0004.1:0 "停止Mars战神剑的部署。"
 rol_relic_use.0004.2:0 "停止星界球的部署。"
 rol_relic_use.0004.3:0 "停止星盘的部署。"
 rol_relic_use.0004.4:0 "停止金面的部署。"
 rol_relic_use.0004.5:0 "停止Naxos训练方案。"
 rol_relic_use.0004.desc:0 "选择要停止部署的圣物或训练方案。用途加成会消失；如果它正在进行半年计划，该计划一并取消，没有成果奖励、不退费用，立项冷却保留。原有圣物与碎片属性不受影响。"
 rol_retire_relic_use_decision:0 "停止圣物部署"
 rol_retire_relic_use_decision_desc:0 "提前结束一件圣物的用途或Naxos训练方案，并取消它尚未结算的计划。"
 rol_retire_relic_use_decision_tooltip:0 "移除所选用途，保留原属性。不退款、不奖励、不清除冷却。"
 rol_retire_relic_use_decision_confirm:0 "选择停止的安排"
 rol_relic_use.0003.t:0 "传说留下的新成果"
 rol_relic_use.0003.desc.invalid:0 "计划依靠的圣物已换主、用途已经改变，或守卫传统不再有效。我应关闭这份记录，而不是把旧投入算成另一件圣物的成果。没有经验或威望奖励，费用不退还。"
 rol_relic_use.0003.a:0 "记下真正学到的本领。"
 rol_relic_use.0003.b:0 "把成果呈现给众人。"
 rol_relic_use.0003.c:0 "暂缓整理，保留成果。"
 rol_relic_use.0003.d:0 "关闭无法完成的计划。"
 rol_relic_use_record_tt:0 "对应用途的探寻者轨道增加10经验；没有特质时获得遗物探寻者。匹配性格失去5压力。只结算一次，保留当前用途。"
 rol_relic_use_publish_tt:0 "获得100威望，不获得专长经验。只结算一次，保留当前用途。"
 rol_relic_use_defer_tt:0 "保留原项目，可用“整理圣物用途成果”决策重新打开；在结算前不能立项另一计划。没有即时奖励。"
 rol_arrange_relic_use_decision:0 "安排圣物用途"
 rol_arrange_relic_use_decision_desc:0 "为持有的圣物与守卫传统选择用途，或整理已经成熟的计划。原有圣物与碎片属性不会被替换。"
 rol_arrange_relic_use_decision_tooltip:0 "打开用途或成果选择。新计划花50金币，每年最多一项，半年后结算一次。"
 rol_arrange_relic_use_decision_confirm:0 "查看安排"
 rol_review_relic_use_decision:0 "整理圣物用途成果"
 rol_review_relic_use_decision_desc:0 "为持有的圣物与守卫传统选择用途，或整理已经成熟的计划。原有圣物与碎片属性不会被替换。"
 rol_review_relic_use_decision_tooltip:0 "打开用途或成果选择。新计划花50金币，每年最多一项，半年后结算一次。"
 rol_review_relic_use_decision_confirm:0 "查看安排"
 rol_relic_use.0001.1:0 "安排Mars的战神剑的用途。"
 rol_relic_use.1001.t:0 "Mars的战神剑的职责"
 rol_relic_use.1001.desc:0 "剑不该永远只是传说的证据。我可以让骑士围绕它演练，也可以让誓约在它面前获得见证。两种安排需要不同的人手，不能同时实行。"
 rol_relic_use.1001.1:0 "投入骑士演练。"
 rol_relic_use_1_field_modifier:0 "Mars的战神剑：投入骑士演练"
 rol_relic_use_1_field_modifier_desc:0 "装备时骑士战斗力+5%。替换该圣物另一用途；装备加成持续到换用途或物品换主，卸下装备时不生效。"
 rol_relic_use_mode_1_tt:0 "花50金币。装备时骑士战斗力+5%。替换该圣物另一用途；装备加成持续到换用途或物品换主，卸下装备时不生效。半年后可选择探险10经验（勇敢者另减5压力），或100威望。一年内不可再立项，原有属性保留。"
 rol_relic_use.0003.desc.1:0 "围绕Mars的战神剑开展的“投入骑士演练”已经留下了记录。半年里，参加者逐渐学会了安排工作，也积累了值得分享的见闻。现在我可以把这些经验记作探险本领，或公开讲述成果；当前用途会保留。"
 rol_relic_use.1001.2:0 "见证公开誓约。"
 rol_relic_use_1_oath_modifier:0 "Mars的战神剑：见证公开誓约"
 rol_relic_use_1_oath_modifier_desc:0 "装备时普遍好感+3。替换该圣物另一用途；装备加成持续到换用途或物品换主，卸下装备时不生效。"
 rol_relic_use_mode_2_tt:0 "花50金币。装备时普遍好感+3。替换该圣物另一用途；装备加成持续到换用途或物品换主，卸下装备时不生效。半年后可选择交涉10经验（公正者另减5压力），或100威望。一年内不可再立项，原有属性保留。"
 rol_relic_use.0003.desc.2:0 "围绕Mars的战神剑开展的“见证公开誓约”已经留下了记录。半年里，参加者逐渐学会了安排工作，也积累了值得分享的见闻。现在我可以把这些经验记作交涉本领，或公开讲述成果；当前用途会保留。"
 rol_relic_use.0001.2:0 "安排尼伯龙根星界球的用途。"
 rol_relic_use.1002.t:0 "尼伯龙根星界球的职责"
 rol_relic_use.1002.desc:0 "我把星界球交到灯光与记录之间。学者希望把奇异纹样与星象逐一比较，礼官则想让来客看见它。安静研究与公开展示，各自留下不同的成果。"
 rol_relic_use.1002.1:0 "安排持续观测。"
 rol_relic_use_2_study_modifier:0 "尼伯龙根星界球：安排持续观测"
 rol_relic_use_2_study_modifier_desc:0 "装备时学习生活方式经验+5%。替换该圣物另一用途；装备加成持续到换用途或物品换主，卸下装备时不生效。"
 rol_relic_use_mode_3_tt:0 "花50金币。装备时学习生活方式经验+5%。替换该圣物另一用途；装备加成持续到换用途或物品换主，卸下装备时不生效。半年后可选择考据10经验（勤勉者另减5压力），或100威望。一年内不可再立项，原有属性保留。"
 rol_relic_use.0003.desc.3:0 "围绕尼伯龙根星界球开展的“安排持续观测”已经留下了记录。半年里，参加者逐渐学会了安排工作，也积累了值得分享的见闻。现在我可以把这些经验记作考据本领，或公开讲述成果；当前用途会保留。"
 rol_relic_use.1002.2:0 "接待来访者参观。"
 rol_relic_use_2_display_modifier:0 "尼伯龙根星界球：接待来访者参观"
 rol_relic_use_2_display_modifier_desc:0 "装备时每月威望增益+5%。替换该圣物另一用途；装备加成持续到换用途或物品换主，卸下装备时不生效。"
 rol_relic_use_mode_4_tt:0 "花50金币。装备时每月威望增益+5%。替换该圣物另一用途；装备加成持续到换用途或物品换主，卸下装备时不生效。半年后可选择交涉10经验（合群者另减5压力），或100威望。一年内不可再立项，原有属性保留。"
 rol_relic_use.0003.desc.4:0 "围绕尼伯龙根星界球开展的“接待来访者参观”已经留下了记录。半年里，参加者逐渐学会了安排工作，也积累了值得分享的见闻。现在我可以把这些经验记作交涉本领，或公开讲述成果；当前用途会保留。"
 rol_relic_use.0001.3:0 "安排大洋统御星盘的用途。"
 rol_relic_use.1003.t:0 "大洋统御星盘的职责"
 rol_relic_use.1003.desc:0 "星盘既能留在航行者手边，也能成为年轻学者面前的一堂课。我需要决定：先把刻度变成稳妥航路，还是让更多人学会读取它。"
 rol_relic_use.1003.1:0 "校准航行与旅行路线。"
 rol_relic_use_3_navigation_modifier:0 "大洋统御星盘：校准航行与旅行路线"
 rol_relic_use_3_navigation_modifier_desc:0 "装备时旅行速度+5%、旅行安全+5。替换该圣物另一用途；装备加成持续到换用途或物品换主，卸下装备时不生效。"
 rol_relic_use_mode_5_tt:0 "花50金币。装备时旅行速度+5%、旅行安全+5。替换该圣物另一用途；装备加成持续到换用途或物品换主，卸下装备时不生效。半年后可选择探险10经验（勇敢者另减5压力），或100威望。一年内不可再立项，原有属性保留。"
 rol_relic_use.0003.desc.5:0 "围绕大洋统御星盘开展的“校准航行与旅行路线”已经留下了记录。半年里，参加者逐渐学会了安排工作，也积累了值得分享的见闻。现在我可以把这些经验记作探险本领，或公开讲述成果；当前用途会保留。"
 rol_relic_use.1003.2:0 "开设星盘研习。"
 rol_relic_use_3_teaching_modifier:0 "大洋统御星盘：开设星盘研习"
 rol_relic_use_3_teaching_modifier_desc:0 "装备时学习+1、学习生活方式经验+3%。替换该圣物另一用途；装备加成持续到换用途或物品换主，卸下装备时不生效。"
 rol_relic_use_mode_6_tt:0 "花50金币。装备时学习+1、学习生活方式经验+3%。替换该圣物另一用途；装备加成持续到换用途或物品换主，卸下装备时不生效。半年后可选择考据10经验（勤勉者另减5压力），或100威望。一年内不可再立项，原有属性保留。"
 rol_relic_use.0003.desc.6:0 "围绕大洋统御星盘开展的“开设星盘研习”已经留下了记录。半年里，参加者逐渐学会了安排工作，也积累了值得分享的见闻。现在我可以把这些经验记作考据本领，或公开讲述成果；当前用途会保留。"
 rol_relic_use.0001.4:0 "安排迦太基浴火金面的用途。"
 rol_relic_use.1004.t:0 "迦太基浴火金面的职责"
 rol_relic_use.1004.desc:0 "金面的伤痕让人敬畏，也提醒我它曾经历漫长破损。我可以让它成为公开威慑的象征，也可以召集工匠研究修复手法，让破损成为可以理解的历史。"
 rol_relic_use.1004.1:0 "作为威慑的象征。"
 rol_relic_use_4_dread_modifier:0 "迦太基浴火金面：作为威慑的象征"
 rol_relic_use_4_dread_modifier_desc:0 "装备时恐怖值增益+5%。替换该圣物另一用途；装备加成持续到换用途或物品换主，卸下装备时不生效。"
 rol_relic_use_mode_7_tt:0 "花50金币。装备时恐怖值增益+5%。替换该圣物另一用途；装备加成持续到换用途或物品换主，卸下装备时不生效。半年后可选择交涉10经验（野心勃勃者另减5压力），或100威望。一年内不可再立项，原有属性保留。"
 rol_relic_use.0003.desc.7:0 "围绕迦太基浴火金面开展的“作为威慑的象征”已经留下了记录。半年里，参加者逐渐学会了安排工作，也积累了值得分享的见闻。现在我可以把这些经验记作交涉本领，或公开讲述成果；当前用途会保留。"
 rol_relic_use.1004.2:0 "支持修复与保存研究。"
 rol_relic_use_4_restoration_modifier:0 "迦太基浴火金面：支持修复与保存研究"
 rol_relic_use_4_restoration_modifier_desc:0 "装备时压力损失增益+5%。替换该圣物另一用途；装备加成持续到换用途或物品换主，卸下装备时不生效。"
 rol_relic_use_mode_8_tt:0 "花50金币。装备时压力损失增益+5%。替换该圣物另一用途；装备加成持续到换用途或物品换主，卸下装备时不生效。半年后可选择考据10经验（耐心者另减5压力），或100威望。一年内不可再立项，原有属性保留。"
 rol_relic_use.0003.desc.8:0 "围绕迦太基浴火金面开展的“支持修复与保存研究”已经留下了记录。半年里，参加者逐渐学会了安排工作，也积累了值得分享的见闻。现在我可以把这些经验记作考据本领，或公开讲述成果；当前用途会保留。"
 rol_relic_use.0001.5:0 "安排Naxos守卫传统的用途。"
 rol_relic_use.1005.t:0 "Naxos守卫传统的职责"
 rol_relic_use.1005.desc:0 "取得守卫传统的认可后，我可以把训练的重点放在骑士协作，也可以让老兵有计划地传授经验。这是训练安排，不会凭空增加兵团。"
 rol_relic_use.1005.1:0 "训练骑士之间的配合。"
 rol_relic_use_5_field_modifier:0 "Naxos守卫传统：训练骑士之间的配合"
 rol_relic_use_5_field_modifier_desc:0 "三年内骑士战斗力+5%。替换另一训练方案，三年到期；不授予新兵团。"
 rol_relic_use_mode_9_tt:0 "花50金币。三年内骑士战斗力+5%。替换另一训练方案，三年到期；不授予新兵团。半年后可选择探险10经验（勇敢者另减5压力），或100威望。一年内不可再立项，原有属性保留。"
 rol_relic_use.0003.desc.9:0 "围绕Naxos守卫传统开展的“训练骑士之间的配合”已经留下了记录。半年里，参加者逐渐学会了安排工作，也积累了值得分享的见闻。现在我可以把这些经验记作探险本领，或公开讲述成果；当前用途会保留。"
 rol_relic_use.1005.2:0 "让老兵讲授实战经验。"
 rol_relic_use_5_training_modifier:0 "Naxos守卫传统：让老兵讲授实战经验"
 rol_relic_use_5_training_modifier_desc:0 "三年内军事生活方式经验+5%。替换另一训练方案，三年到期；不授予新兵团。"
 rol_relic_use_mode_10_tt:0 "花50金币。三年内军事生活方式经验+5%。替换另一训练方案，三年到期；不授予新兵团。半年后可选择探险10经验（勤勉者另减5压力），或100威望。一年内不可再立项，原有属性保留。"
 rol_relic_use.0003.desc.10:0 "围绕Naxos守卫传统开展的“让老兵讲授实战经验”已经留下了记录。半年里，参加者逐渐学会了安排工作，也积累了值得分享的见闻。现在我可以把这些经验记作探险本领，或公开讲述成果；当前用途会保留。"
