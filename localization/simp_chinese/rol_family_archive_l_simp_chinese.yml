 rol_print_family_knowledge_decision:0 "刊印家族资料"
 rol_print_family_knowledge_decision_desc:0 "从当前家族的底本刊印一份远征资料。每份花费40金币，有效五年；所有资料共用个人三年刊印间隔，已有同类资料不能刷新。\n\n$rol_family_archive_inventory$"
