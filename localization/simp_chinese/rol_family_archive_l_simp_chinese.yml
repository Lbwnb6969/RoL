 rol_family_archive.0001.t:0 "留给后人的底本"
 rol_family_archive.0001.desc:0 "将一份仍有效的资料收入家族书库，供后人刊印。编修每类底本花100金币，考据100经验时为50金币；原副本保留。\n\n$rol_family_archive_inventory$"
