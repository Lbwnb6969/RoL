l_simp_chinese:
 rol_catalogue_family_knowledge_decision:0 "编修家族底本"
 rol_catalogue_family_knowledge_decision_desc:0 "将仍可查阅的远征笔记或研究图表编成家族底本。底本归当前家族所有，后人可自费刊印副本；它不会提高属性，也不会授予圣物或个人经验。"
 rol_catalogue_family_knowledge_decision_confirm:0 "查看可编目的资料"
 rol_catalogue_family_knowledge_decision_tooltip:0 "选择一份仍然有效的知识，编入当前家族的书库。"
 rol_print_family_knowledge_decision:0 "刊印家族资料"
 rol_print_family_knowledge_decision_desc:0 "从当前家族的底本刊印一份远征资料。每份花费40金币，有效五年；所有资料共用个人三年刊印间隔，已有同类资料不能刷新。"
 rol_print_family_knowledge_decision_confirm:0 "查阅家族书库"
 rol_print_family_knowledge_decision_tooltip:0 "花费40金币，取得一份当前缺少的五年资料。"
 rol_family_archive_print_cooldown_tt:0 "过去三年内没有刊印过家族资料"
 rol_family_archive.0001.t:0 "留给后人的底本"
 rol_family_archive.0001.desc:0 "眼前的手稿尚能辨读，随身副本却终会散失。我可以付钱请人校订、抄存，将其中一份收入当前家族的书库。每类只需编修一次；考据专长达到100经验时，编修费用从100金币降为50金币。我的原资料继续按原期限保存。"
 rol_family_archive.0002.t:0 "重开书库"
 rol_family_archive.0002.desc:0 "家族留下的是可以重新抄印的底本，而非替后人走完的道路。我可花40金币选一份尚未持有的资料，供未来五年使用。刊印后，三年内不能再刊印其他资料；笔记与图表仍会在原有远征选项中消耗。"
 rol_family_archive.invalid.desc:0 "这份书目属于打开它时的家族。我已不属于该家族，或书库记录已经失效。关闭书目后，可以从当前家族的决策重新查阅。"
 rol_family_archive.0001.mars_notes:0 "编修罗马地宫笔记"
 rol_family_archive.0001.nibelung_notes:0 "编修慕尼黑冰窟笔记"
 rol_family_archive.0001.naxos_notes:0 "编修纳克索斯笔记"
 rol_family_archive.0001.astrolabe_notes:0 "编修塞维利亚笔记"
 rol_family_archive.0001.carthage_notes:0 "编修迦太基笔记"
 rol_family_archive.0001.star_observations:0 "编修星界观测图"
 rol_family_archive.0001.ocean_routes:0 "编修爱琴海航路图"
 rol_family_archive.0002.mars_notes:0 "刊印罗马地宫笔记"
 rol_family_archive.0002.nibelung_notes:0 "刊印慕尼黑冰窟笔记"
 rol_family_archive.0002.naxos_notes:0 "刊印纳克索斯笔记"
 rol_family_archive.0002.astrolabe_notes:0 "刊印塞维利亚笔记"
 rol_family_archive.0002.carthage_notes:0 "刊印迦太基笔记"
 rol_family_archive.0002.star_observations:0 "刊印星界观测图"
 rol_family_archive.0002.ocean_routes:0 "刊印爱琴海航路图"
 rol_family_archive.catalogue.flavor:0 "让散页成为后人找得到的书。"
 rol_family_archive.print.flavor:0 "取一份能带上旅途的副本。"
 rol_family_archive_catalogue_tt:0 "花费100金币，将这份仍有效的资料编入当前家族；考据专长达到100经验时只需50金币。同家同类只收录一次，保留个人原资料，不授予经验、属性或完成记录。"
 rol_family_archive_print_tt:0 "花费40金币，取得这份五年有效的资料并揭示对应远征入口。已有同类资料不能刷新；所有资料共用个人三年刊印间隔，底本留在当前家族。不会继承前人的专长、圣物或完成记录。"
 rol_family_archive.close:0 "合上书目。"
 rol_family_archive.close.flavor:0 "先决定下一次要走的路。"
