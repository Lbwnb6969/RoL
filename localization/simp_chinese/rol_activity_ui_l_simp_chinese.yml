l_simp_chinese:

 rol_quest_munich.0990.a.flavor:0 "迈出这场远征的第一步。"
 rol_quest_munich.1000.a.flavor:0 "先读懂冰门里的星图。"
 rol_quest_munich.1000.b.flavor:0 "以铁锤与意志砸开封门。"
 rol_quest_munich.1000.c.flavor:0 "在极寒撕裂队伍前后撤。"
 rol_quest_munich.1001.a.flavor:0 "夺取星界球愿意交出的答案。"
 rol_quest_munich.1002.a.flavor:0 "以统御压住队伍的崩溃。"
 rol_quest_munich.1002.b.flavor:0 "以虔敬安抚群星噪鸣。"
 rol_quest_munich.1002.c.flavor:0 "在深渊占据心智前撤出。"
 rol_quest_munich.1010.a.flavor:0 "趁着势头仍在，继续深入。"
 rol_quest_munich.1011.a.flavor:0 "承认受挫并撤出远征。"
 rol_quest_munich.1012.a.flavor:0 "保全残余力量，暂时收手。"
 rol_quest_munich.1020.a.flavor:0 "抓住打开的缺口继续推进。"
 rol_quest_munich.1021.a.flavor:0 "在损失扩大前结束尝试。"
 rol_quest_munich.1022.a.flavor:0 "趁道路未完全封死前有序撤离。"
 rol_quest_munich.1050.a.flavor:0 "停下来重整全队心神。"
 rol_quest_munich.1050.b.flavor:0 "拒绝停顿，继续下压。"
 rol_quest_munich.1090.a.flavor:0 "把这次远征的结果写入记录。"
 rol_quest_naxos.0990.a.flavor:0 "迈出这场远征的第一步。"
 rol_quest_naxos.1000.a.flavor:0 "在第一封印彻底锁死前击破它。"
 rol_quest_naxos.1000.b.flavor:0 "先看懂机关，再决定如何推进。"
 rol_quest_naxos.1000.c.flavor:0 "在宫殿更深层回应前先撤。"
 rol_quest_naxos.1001.a.flavor:0 "只有当宫殿愿意回应时才下达号令。"
 rol_quest_naxos.1002.a.flavor:0 "用统御把全线稳在一起。"
 rol_quest_naxos.1002.b.flavor:0 "逐层拆解验证序列。"
 rol_quest_naxos.1002.c.flavor:0 "在流程致命前主动中止。"
 rol_quest_naxos.1003.a.flavor:0 "正面打穿守门阵列。"
 rol_quest_naxos.1003.b.flavor:0 "绕到阵后切断中枢。"
 rol_quest_naxos.1003.c.flavor:0 "在终门回应前先行后撤。"
 rol_quest_naxos.1010.a.flavor:0 "趁着势头仍在，继续深入。"
 rol_quest_naxos.1011.a.flavor:0 "承认受挫并撤出远征。"
 rol_quest_naxos.1012.a.flavor:0 "保全残余力量，暂时收手。"
 rol_quest_naxos.1020.a.flavor:0 "抓住打开的缺口继续推进。"
 rol_quest_naxos.1021.a.flavor:0 "在损失扩大前结束尝试。"
 rol_quest_naxos.1022.a.flavor:0 "趁道路未完全封死前有序撤离。"
 rol_quest_naxos.1030.a.flavor:0 "向最终门槛继续推进。"
 rol_quest_naxos.1031.a.flavor:0 "脱离接触，接受这次挫败。"
 rol_quest_naxos.1032.a.flavor:0 "让整条队列离开最后门槛。"
 rol_quest_naxos.1050.a.flavor:0 "用稳健换取秩序。"
 rol_quest_naxos.1050.b.flavor:0 "保持强压，依靠势头。"
 rol_quest_naxos.1090.a.flavor:0 "把这次远征的结果写入记录。"
 rol_quest_rome.0990.a.flavor:0 "迈出这场远征的第一步。"
 rol_quest_rome.1000.a.flavor:0 "用正面武力撞开第一层阻碍。"
 rol_quest_rome.1000.b.flavor:0 "依靠古老铭文为队伍开路。"
 rol_quest_rome.1000.c.flavor:0 "趁地宫尚未合拢前主动后撤。"
 rol_quest_rome.1001.a.flavor:0 "伸手夺取远征终点的回应。"
 rol_quest_rome.1002.a.flavor:0 "在回廊彻底坍塌前硬闯过去。"
 rol_quest_rome.1002.b.flavor:0 "及时止损，撤回地表。"
 rol_quest_rome.1003.a.flavor:0 "用知识而非鲜血回应誓文。"
 rol_quest_rome.1003.b.flavor:0 "把一切押在冲势与胆气上。"
 rol_quest_rome.1004.a.flavor:0 "在阵列合围前正面冲垮它。"
 rol_quest_rome.1004.b.flavor:0 "放弃最后一推，留待来日。"
 rol_quest_rome.1010.a.flavor:0 "趁着势头仍在，继续深入。"
 rol_quest_rome.1011.a.flavor:0 "承认受挫并撤出远征。"
 rol_quest_rome.1012.a.flavor:0 "保全残余力量，暂时收手。"
 rol_quest_rome.1020.a.flavor:0 "抓住打开的缺口继续推进。"
 rol_quest_rome.1021.a.flavor:0 "在损失扩大前结束尝试。"
 rol_quest_rome.1022.a.flavor:0 "趁道路未完全封死前有序撤离。"
 rol_quest_rome.1030.a.flavor:0 "向最终门槛继续推进。"
 rol_quest_rome.1031.a.flavor:0 "脱离接触，接受这次挫败。"
 rol_quest_rome.1040.a.flavor:0 "趁通路仍在回应时迈向终局。"
 rol_quest_rome.1041.a.flavor:0 "保住残余人手，放弃推进。"
 rol_quest_rome.1042.a.flavor:0 "在最后一搏化为毁灭前收手。"
 rol_quest_rome.1050.a.flavor:0 "放缓节奏，稳住队列。"
 rol_quest_rome.1050.b.flavor:0 "维持高压，继续强推。"
 rol_quest_rome.1090.a.flavor:0 "把这次远征的结果写入记录。"
 rol_quest_sevilla.0990.a.flavor:0 "迈出这场远征的第一步。"
 rol_quest_sevilla.1000.a.flavor:0 "用许诺、金币与分寸拉拢水手。"
 rol_quest_sevilla.1000.b.flavor:0 "以意志与威压掌控港湾。"
 rol_quest_sevilla.1000.c.flavor:0 "在海湾反噬前先回港。"
 rol_quest_sevilla.1001.a.flavor:0 "把那道跨越地平线的回应握进手中。"
 rol_quest_sevilla.1002.a.flavor:0 "在风墙欺骗所有人时读懂天穹。"
 rol_quest_sevilla.1002.b.flavor:0 "用纪律把整支舰队拧成一体。"
 rol_quest_sevilla.1002.c.flavor:0 "在大海吞掉舰队前返航。"
 rol_quest_sevilla.1010.a.flavor:0 "趁着势头仍在，继续深入。"
 rol_quest_sevilla.1011.a.flavor:0 "承认受挫并撤出远征。"
 rol_quest_sevilla.1012.a.flavor:0 "保全残余力量，暂时收手。"
 rol_quest_sevilla.1020.a.flavor:0 "抓住打开的缺口继续推进。"
 rol_quest_sevilla.1021.a.flavor:0 "在损失扩大前结束尝试。"
 rol_quest_sevilla.1022.a.flavor:0 "趁道路未完全封死前有序撤离。"
 rol_quest_sevilla.1050.a.flavor:0 "先稳住船员，再继续航行。"
 rol_quest_sevilla.1050.b.flavor:0 "压住迟疑，强推航程。"
 rol_quest_sevilla.1090.a.flavor:0 "把这次远征的结果写入记录。"

