l_simp_chinese:
 rol_artifact_rarity_slot_legendary_mask:0 "@rol_legendary_icon! #color:{0.9,0.9,0} 传奇级面具#!"

 rol_relic_debug_carthage_stage_progress:0 "[ROL 调试] 迦太基阶段已推进"
 rol_relic_debug_carthage_success_finalize:0 "[ROL 调试] 迦太基成功结算完成"
 rol_relic_debug_carthage_failure_finalize:0 "[ROL 调试] 迦太基失败结算完成"
 rol_relic_debug_carthage_fail_now:0 "[ROL 调试] 已调用迦太基立即失败"
 rol_relic_debug_carthage_terminal_tier4_reward:0 "[ROL 调试] 迦太基终局进入 Tier4 发奖分支"
 rol_relic_debug_carthage_terminal_below_tier4_fail:0 "[ROL 调试] 迦太基终局进入低于 Tier4 的失败分支"

 rol_relic_discovery.1600.t:0 "盐地之下的灰烬神庙"
 rol_relic_discovery.1600.desc:0 "突尼斯外海吹来的罕见沙暴刮去了大片受诅盐碱土，令卡塔贾纳附近一座半埋神庙的上层穹顶重见天日。幸存者只提到几件事：星光般冰冷的灰烬、在黑暗里行进的战象幽影，以及一张藏在地下誓约尽头的黄金面具。"
 rol_relic_discovery.1600.a:0 "准备一场黑沙远征。"

 rol_ash_forged_mask:0 "迦太基的浴火金面"
 rol_ash_forged_mask_desc:0 "这张面具诞生于城破之夜的余烬、熔金与绝望之中，始终带着焦土气味与沙漠深夜的寒意。"
 artifact_rol_ash_forged_mask:0 "迦太基的浴火金面"
 artifact_rol_ash_forged_mask_desc:0 "它冰冷得像沙漠午夜，内部却仍留着一座誓死不屈之城的统帅意志。"

 rol_quest_carthage.0990.t:0 "黑沙边缘"
 rol_quest_carthage.0990.desc:0 "夜幕降临时，你的远征队终于抵达那片被风暴撕开的外层沙脊。盐尘与死灰仍在半空盘旋，掩埋神庙的裂口则像一张刻意沉默的嘴，静静等着你迈出下一步。"
 rol_quest_carthage.0990.a:0 "趁黄沙尚未回合，把入口吃下来。"
 rol_quest_carthage.0990.a.flavor:0 "迈出这场黑沙远征的第一步。"

 rol_quest_carthage.1000.t:0 "穿越夜砂"
 rol_quest_carthage.1000.desc:0 "黑暗沙海之中根本没有路，只有不断迁移的沙丘、被拉长的星光，以及会在你眨眼后彻底消失的地标。若今夜无法锁定真正方位，神庙将在黎明前再次被荒漠吞没。"
 rol_quest_carthage.1000.a:0 "重金雇佣贝都因星引者。"
 rol_quest_carthage.1000.b:0 "依靠古闪米特星象学者领路。"
 rol_quest_carthage.1000.c:0 "现在回头，还能保全队伍。"
 rol_quest_carthage.1000.a.base_tt:0 "[diplomacy|E]检定。"
 rol_quest_carthage.1000.b.base_tt:0 "[learning|E]检定。"
 rol_quest_carthage.1000.c.tt:0 "你终止本次远征：进入2年冷却。"
 rol_quest_carthage.1000.a.tt.success:0 "#P 成功：#!沙丘之间真的出现了一条隐蔽路线，你的队伍赶在地貌再次变动前抵达了掩埋圣所。"
 rol_quest_carthage.1000.a.tt.failure:0 "#N 失败：#!错误引导与黑沙夜路彻底撕裂了队形。\n#N 远征立刻终止并进入2年冷却。#!"
 rol_quest_carthage.1000.b.tt.success:0 "#P 成功：#!古老星图终于锁定了神庙真正方位，远征队及时抵达了入口。"
 rol_quest_carthage.1000.b.tt.failure:0 "#N 失败：#!天象被误判，荒漠夺走了时间，也夺走了秩序。\n#N 远征立刻终止并进入2年冷却。#!"
 rol_quest_carthage.1000.a.flavor:0 "把希望押在真正懂沙丘与星光的人身上。"
 rol_quest_carthage.1000.b.flavor:0 "用古老历法与星图替你在黑夜中定向。"
 rol_quest_carthage.1000.c.flavor:0 "趁荒漠尚未替你做决定前主动撤出。"

 rol_quest_carthage.1010.t:0 "路径显现"
 rol_quest_carthage.1010.desc:0 "今夜的荒漠没有彻底背叛你。黑沙短暂退开，露出那道通向地下誓所的真正入口。"
 rol_quest_carthage.1010.a:0 "继续推进。"
 rol_quest_carthage.1010.a.flavor:0 "趁入口尚未被风沙抹去前继续前进。"

 rol_quest_carthage.1011.t:0 "迷失于黑沙"
 rol_quest_carthage.1011.desc:0 "夜砂不断修正你的判断，每一次补救都慢了一步。继续走下去，只会让更多人被荒漠埋进无声的黑暗里。"
 rol_quest_carthage.1011.a:0 "结束这次尝试。"
 rol_quest_carthage.1011.a.flavor:0 "接受荒漠的拒绝，先把人带回去。"

 rol_quest_carthage.1012.t:0 "把荒漠留给以后"
 rol_quest_carthage.1012.desc:0 "你下令原路撤回。等到天亮时，连你们自己的足迹都已被盐尘与黑沙彻底抹平。"
 rol_quest_carthage.1012.a:0 "以后再来。"
 rol_quest_carthage.1012.a.flavor:0 "保住队伍，为下次远征留下余力。"

 rol_quest_carthage.1002.t:0 "灰烬与战象幽影"
 rol_quest_carthage.1002.desc:0 "神庙深处的空气里到处都是死灰与异常星光。吸入它们的人会看见布匿战争最后的回响：庞大而沉默的战象踏着星辉，向不可战胜的敌阵发起徒劳却伟大的冲锋。"
 rol_quest_carthage.1002.a:0 "以铁血统御压碎幻象。"
 rol_quest_carthage.1002.b:0 "以敬畏与星学安抚英灵。"
 rol_quest_carthage.1002.c:0 "趁幻象尚未吞掉所有人，撤。"
 rol_quest_carthage.1002.a.base_tt:0 "[martial|E] / [prowess|E]检定。"
 rol_quest_carthage.1002.b.base_tt:0 "[learning|E] / [piety_level|E]检定。"
 rol_quest_carthage.1002.c.tt:0 "你终止本次远征：进入2年冷却。"
 rol_quest_carthage.1002.a.tt.success:0 "#P 成功：#!你的意志压过了古战回响，神庙更深层的大门终于对你开启。"
 rol_quest_carthage.1002.a.tt.failure:0 "#N 失败：#!死去的战争记忆击穿了整支队伍的纪律。\n#N 远征立刻终止并进入2年冷却。#!"
 rol_quest_carthage.1002.b.tt.success:0 "#P 成功：#!你让这片古老悲愿暂时平静下来，圣所允许你再向前一步。"
 rol_quest_carthage.1002.b.tt.failure:0 "#N 失败：#!死灰记住的只有毁灭，神庙因此以恐慌与崩溃回应你。\n#N 远征立刻终止并进入2年冷却。#!"
 rol_quest_carthage.1002.a.flavor:0 "在恐惧蔓延前先掌控整支队伍。"
 rol_quest_carthage.1002.b.flavor:0 "用理解与敬畏回应这片死去的古城。"
 rol_quest_carthage.1002.c.flavor:0 "在亡城夺走活人心智之前离开。"

 rol_quest_carthage.1020.t:0 "灰烬退去"
 rol_quest_carthage.1020.desc:0 "战象的幻响逐渐远去，真正的寒光开始在内殿石台上凝聚。你终于逼近了神庙想守住的最终答案。"
 rol_quest_carthage.1020.a:0 "继续前压。"
 rol_quest_carthage.1020.a.flavor:0 "抓住重新稳定的局面，逼近圣所核心。"

 rol_quest_carthage.1021.t:0 "亡军压垮了活人"
 rol_quest_carthage.1021.desc:0 "这片灰烬不再只是记忆，而是一种几乎真实的冲击。你的队伍先于那座死城崩溃了。"
 rol_quest_carthage.1021.a:0 "全员撤出。"
 rol_quest_carthage.1021.a.flavor:0 "在遗迹替你完成毁灭前立刻脱离。"

 rol_quest_carthage.1022.t:0 "离开内殿"
 rol_quest_carthage.1022.desc:0 "你主动终止深入，带着仍愿服从命令的人离开这片灰烬圣所。它依旧沉默，但绝非无动于衷。"
 rol_quest_carthage.1022.a:0 "到此为止。"
 rol_quest_carthage.1022.a.flavor:0 "用主动撤离保住最后的控制。"

 rol_quest_carthage.1050.t:0 "石台旁的争论"
 rol_quest_carthage.1050.desc:0 "一位受邀宾客低声建议在最终内殿前稍作停整，另一些人却认为迟疑正是古老遗迹想从活人身上夺走的东西。"
 rol_quest_carthage.1050.a:0 "先稳住全队。"
 rol_quest_carthage.1050.b:0 "不拖延，现在就压过去。"
 rol_quest_carthage.1050.a.flavor:0 "短暂停整，重建秩序与呼吸。"
 rol_quest_carthage.1050.b.flavor:0 "拒绝停顿，继续对圣所施压。"

 rol_quest_carthage.1001.t:0 "浴火金面"
 rol_quest_carthage.1001.desc:0 "一道冰冷星光从破碎穹顶落下，照在被岁月风化的石台上。焦灰与残金之间，那张曾在迦太基毁灭之夜被带入沙海的面具，正静静等待着最后的触碰。"
 rol_quest_carthage.1001.desc.tier_4:0 "当你的手触及面具时，整座神庙没有反抗。那股冰冷而悲壮的千年意志被你彻底驯服，并像第二层皮肤般覆上你的灵魂。"
 rol_quest_carthage.1001.desc.below_tier4:0 "面具以极寒拒绝了你。神庙最后的誓约并未被打破，你的远征也被挡在终点之外。"
 rol_quest_carthage.1001.a:0 "让旧日地中海再次记住我。"
 rol_quest_carthage.1001.a.tt:0 "若最终门槛被你突破，你将夺得面具；否则本次远征失败并进入2年冷却。"
 rol_quest_carthage.1001.a.flavor:0 "伸手去夺那道埋在灰烬尽头的回应。"

 rol_quest_carthage.1090.t:0 "黑沙远征结算"
 rol_quest_carthage.1090.desc.success_4:0 "你压服了神庙最深层的拒绝，把一件诞生于迦太基末夜的传奇圣物带回了世间。"
 rol_quest_carthage.1090.desc.success_3:0 "你穿过了灰烬、异象与古老悲愿，几乎完整掌控了这片埋藏誓所。"
 rol_quest_carthage.1090.desc.success_2:0 "在巨大压力之下，你仍然稳住了远征队，并带回了超越传闻的证据。"
 rol_quest_carthage.1090.desc.success_1:0 "你勉强带回了传说真实存在的证明，但代价极其沉重。"
 rol_quest_carthage.1090.desc.failure:0 "黑沙远征失败了。远征团需要两年时间，才适合再次挑战这片埋藏神庙。"
 rol_quest_carthage.1090.desc.fallback:0 "这场突尼斯远征已经结束。"
 rol_quest_carthage.1090.a:0 "记下结果。"
 rol_quest_carthage.1090.a.flavor:0 "把这场远征的结局写进记录。"

 activity_rol_seek_ash_forged_mask:0 "浴火金面远征"
 activity_rol_seek_ash_forged_mask_desc:0 "你将穿越突尼斯外的黑沙荒漠，追索被风暴揭开的异象与埋藏誓所，逼近那道仍记得迦太基末夜的最终回应。"
 activity_rol_seek_ash_forged_mask_host_desc:0 "$BULLET_WITH_TAB$可通过$rol_option_expedition_preparation$活动选项调整整备档位\n$BULLET_WITH_TAB$失败会立刻终止远征并进入2年冷却"
 activity_rol_seek_ash_forged_mask_guest_desc:0 ""
 activity_rol_seek_ash_forged_mask_conclusion_desc:0 "外层沙痕很快会再次被风掩埋，但那座地下神庙已经对你作出了回答。"
 activity_rol_seek_ash_forged_mask_conclusion_desc_success_4:0 "你彻底征服了圣所最后的拒绝，并夺得了它守护的答案。"
 activity_rol_seek_ash_forged_mask_conclusion_desc_success_3:0 "你几乎完整压过了灰烬神庙的回应。"
 activity_rol_seek_ash_forged_mask_conclusion_desc_success_2:0 "你稳住了远征队，并从神庙处逼出了一部分回应。"
 activity_rol_seek_ash_forged_mask_conclusion_desc_success_1:0 "你勉强活着穿过了黑沙。"
 activity_rol_seek_ash_forged_mask_conclusion_desc_failure:0 "你被迫撤回。远征队需休整两年。"
 activity_rol_seek_ash_forged_mask_conclusion_desc_fallback:0 "这场远征已经结束。"
 activity_rol_seek_ash_forged_mask_selection_tooltip:0 "从突尼斯出发，穿过被风暴揭开的黑沙、异象与埋藏誓所，去逼迫那座拒绝遗忘的古老神庙作出最终回答。\n\n失败会立刻终止远征并进入2年冷却。"
 activity_rol_seek_ash_forged_mask_predicted_cost:0 "本次远征的总花费，将高度取决于你选择的人手与装备档位。"
 activity_rol_seek_ash_forged_mask_province_desc:0 "远征目标位于[ROOT.Province.GetName]"

 activity_rol_seek_ash_forged_mask_special_type_title:0 "圣所同步度"
 activity_rol_seek_ash_forged_mask_special_type_desc:0 "你的抉择将决定灰烬神庙会在多大程度上向你屈服。唯有最深层的掌控，才足以完成终局夺取。"
 ROL_CARTHAGE_WINDOW_SPECIAL_PROGRESS_TOOLTIP:0 "当前同步度：[ActivityWindow.GetSpecialProgressValue|0^V]"
 activity_rol_seek_ash_forged_mask_special_type_bar_segment_tt_0:0 "#T 彻底拒绝#!\n埋藏誓约强烈排斥着你。"
 activity_rol_seek_ash_forged_mask_special_type_bar_segment_tt_1:0 "#T 勉强维持#!\n远征尚未崩溃，但离真正掌控仍很远。"
 activity_rol_seek_ash_forged_mask_special_type_bar_segment_tt_2:0 "#T 逐步回应#!\n圣所开始承认你的逼近。"
 activity_rol_seek_ash_forged_mask_special_type_bar_segment_tt_3:0 "#T 灰烬屈从#!\n你的统御已接近压服这片神庙。"
 activity_rol_seek_ash_forged_mask_special_type_bar_segment_tt_4:0 "#T 最终征服#!\n最后一道阻力已接近崩裂。"
 activity_rol_seek_ash_forged_mask_special_type_bar_segment_0_tt:0 "$activity_rol_seek_ash_forged_mask_special_type_bar_segment_tt_0$"
 activity_rol_seek_ash_forged_mask_special_type_bar_segment_1_tt:0 "$activity_rol_seek_ash_forged_mask_special_type_bar_segment_tt_1$"
 activity_rol_seek_ash_forged_mask_special_type_bar_segment_2_tt:0 "$activity_rol_seek_ash_forged_mask_special_type_bar_segment_tt_2$"
 activity_rol_seek_ash_forged_mask_special_type_bar_segment_3_tt:0 "$activity_rol_seek_ash_forged_mask_special_type_bar_segment_tt_3$"
 activity_rol_seek_ash_forged_mask_special_type_bar_segment_4_tt:0 "$activity_rol_seek_ash_forged_mask_special_type_bar_segment_tt_4$"

 phase_rol_carthage_descent_phase:0 "黑沙下探"
 phase_rol_carthage_descent_phase_desc:0 "你正穿越突尼斯外的荒漠，向卡塔贾纳的埋藏圣所逼近。"
 rol_carthage_descent_phase:0 "$phase_rol_carthage_descent_phase$"
 rol_carthage_descent_phase_desc:0 "$phase_rol_carthage_descent_phase_desc$"

 rol_seek_ash_forged_mask_cost_desc:0 "荒漠远征与补给费用"
 rol_carthage_quest_on_cooldown_tt:0 "你上一次黑沙远征失败了，必须等待2年后再尝试。"
 rol_carthage_quest_cooldown_modifier:0 "黑沙远征冷却"
 rol_carthage_quest_cooldown_modifier_desc:0 "上一次深入迦太基埋藏圣所的尝试以失败告终。远征团需要时间恢复。"
 TRAVEL_NAME_FOR_activity_rol_seek_ash_forged_mask:0 "[Character.GetFirstNameNoTooltip]的黑沙远征"

 rol_carthage_activity_success_toast_title:0 "黑沙远征成功"
 rol_carthage_activity_failure_toast_title:0 "黑沙远征失败"
 rol_carthage_activity_success_toast_desc:0 "埋藏神庙终于向你屈服，一段被遗忘的地中海传说随你一同重返世间。"
 rol_carthage_activity_failure_toast_desc:0 "荒漠与灰烬神庙击碎了这次尝试。你的远征团必须重整之后才能再来。"