l_simp_chinese:
 trait_rol_relic_seeker:0 "遗物探寻者"
 trait_rol_relic_seeker_desc:0 "远征带回的不只有战利品。这位探寻者学会辨读古代证据、带领队伍穿越险境，并与守护往昔的人交涉。远征后的复盘会积累专长；仅仅继承圣物不会获得经验。"
 trait_track_rol_research:0 "考据"
 trait_track_rol_research_desc:0 "比对铭文，区分证据与猜想，将发现转化为知识。经验达到20、60、100时提升收益。"
 trait_track_rol_exploration:0 "探险"
 trait_track_rol_exploration_desc:0 "记住安全的道路，学会把队伍带回家。经验达到20、60、100时提升收益。"
 trait_track_rol_negotiation:0 "交涉"
 trait_track_rol_negotiation_desc:0 "赢得信任，调解归属争议，维系让下一次远行成为可能的关系。经验达到20、60、100时提升收益。"
 rol_expedition_growth.0001.t:0 "旅途留下的本领"
 rol_expedition_growth.0001.desc:0 "我把笔记铺在桌上：见闻、路线，还有我们许下的承诺。无论带回了什么，这段经历都不该白费。\n\n本次经历留下了#V [ROOT.Char.MakeScope.ScriptValue('rol_expedition_growth_pending_xp_value')|0]#!点经验，可以投入一项专长。所选方向还会带来三年的收益，并替换此前的远征研习方向。"
 rol_expedition_growth.0001.a:0 "比对证据，写下一份严谨的记录。"
 rol_expedition_growth.0001.a.flavor:0 "一份诚实的记录，可能比圣物本身流传得更久。勤勉者还会失去5点压力。"
 rol_expedition_growth.0001.b:0 "记下险境，教会众人更安全的路线。"
 rol_expedition_growth.0001.b.flavor:0 "下一次，我们会准备得更好。勇敢者还会失去5点压力。"
 rol_expedition_growth.0001.c:0 "记住谁帮助了我们，以及如何赢得信任。"
 rol_expedition_growth.0001.c.flavor:0 "熟悉的声音，也许能让紧闭的大门打开。合群者还会失去5点压力。"
 rol_expedition_research_focus_modifier:0 "整理远征证据"
 rol_expedition_research_focus_modifier_desc:0 "近期的远征发现让此人的研究更有方向。这项研习持续三年，会被下次选择的远征研习替换。"
 rol_expedition_exploration_focus_modifier:0 "旅途的教训"
 rol_expedition_exploration_focus_modifier_desc:0 "近期的远征经历帮助此人安排旅程。这项研习持续三年，会被下次选择的远征研习替换。"
 rol_expedition_negotiation_focus_modifier:0 "探寻者的声誉"
 rol_expedition_negotiation_focus_modifier_desc:0 "对近期交涉的认真复盘改善了此人的声誉。这项研习持续三年，会被下次选择的远征研习替换。"
 rol_expedition_mars_notes_modifier:0 "罗马远征笔记"
 rol_expedition_nibelung_notes_modifier:0 "慕尼黑远征笔记"
 rol_expedition_naxos_notes_modifier:0 "纳克索斯远征笔记"
 rol_expedition_astrolabe_notes_modifier:0 "塞维利亚远征笔记"
 rol_expedition_carthage_notes_modifier:0 "迦太基远征笔记"
 rol_expedition_notes_description:0 "部分成功带回的证据。下次前往同一地区的远征开始时消耗，使该次远征的二元检定成功率提高#V 5个百分点#!，仍以95%为上限。笔记保存十年，同一地区不会叠加；其他地区的远征不会消耗它。"
 rol_expedition_mars_notes_modifier_desc:0 "$rol_expedition_notes_description$"
 rol_expedition_nibelung_notes_modifier_desc:0 "$rol_expedition_notes_description$"
 rol_expedition_naxos_notes_modifier_desc:0 "$rol_expedition_notes_description$"
 rol_expedition_astrolabe_notes_modifier_desc:0 "$rol_expedition_notes_description$"
 rol_expedition_carthage_notes_modifier_desc:0 "$rol_expedition_notes_description$"
 rol_expedition_journal_used_title:0 "循着上次的发现"
 rol_expedition_journal_used_desc:0 "地区笔记已用于本次远征：二元检定成功率提高5个百分点，最高95%。选项显示的概率已经包含这项收益。"
 rol_review_expedition_journal_decision:0 "复盘远征经历"
 rol_review_expedition_journal_decision_desc:0 "一段尚未整理的远征经历，仍有本领值得学习。决定怎样运用已经积累的经验。"
 rol_review_expedition_journal_decision_tooltip:0 "打开待完成的远征复盘，不会凭空增加经验。"
 rol_review_expedition_journal_decision_confirm:0 "铺开笔记"
