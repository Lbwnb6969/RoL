l_simp_chinese:
 rol_rival.1000.t: "遗迹中的竞争者"
 rol_rival.1000.desc: "[scope:rol_expedition_rival.GetTitledFirstName]从远征队中走出，拿出一套与圣物埋藏地有关的不同说辞。无论此人是对手、伙伴还是骗子，现在都无法忽视。"
 rol_rival.1000.a: "付出代价，共享线索。"
 rol_rival.1000.a.flavor: "与人分享发现，总好过面对空墓。"
 rol_rival.1000.b: "用武力决定谁说了算。"
 rol_rival.1000.b.flavor: "下一阶段只能有一个领路人。"
 rol_rival.1000.b.success: "你迫使对手退让，并夺得了最有价值的线索。"
 rol_rival.1000.b.failure: "对手令你负伤，远征队也因此失去进展。"
 rol_rival.1000.c: "检验这些证据。"
 rol_rival.1000.c.flavor: "墨迹、包浆与来历比言辞更加诚实。"
 rol_rival.1000.c.success: "你揭穿了骗局，并留下了其中有用的残片。"
 rol_rival.1000.c.failure: "证据一度说服了你；直到后来，你才认出那是赝品。"
 artifact_rol_counterfeit_blade_of_mars: "仿制玛尔斯之剑"
 artifact_rol_counterfeit_blade_of_mars_desc: "一件精巧的军事赝品，金属与铭文都经不起细看。"
 artifact_rol_counterfeit_nibelung_sphere: "伪尼伯龙根星界球"
 artifact_rol_counterfeit_nibelung_sphere_desc: "外形华美的天文仪器，制成年代却远晚于它所攀附的传说。"
 artifact_rol_counterfeit_astrolabe: "伪大洋统御星盘"
 artifact_rol_counterfeit_astrolabe_desc: "其海域刻纹颇能唬人，但测量结果毫无用处。"
 artifact_rol_counterfeit_ash_mask: "镀金布匿面具"
 artifact_rol_counterfeit_ash_mask_desc: "一件用烟火做旧、冒充迦太基传奇圣物的葬仪面具。"
 artifact_rol_counterfeit_naxos_token: "残破纳克索斯军令牌"
 artifact_rol_counterfeit_naxos_token_desc: "一枚刻着杜撰军团标记的伪造指挥凭证。"
 rol_relic_legacy.0001.t: "圣物的要求"
 rol_relic_legacy.0001.desc: "[scope:rol_legacy_artifact.GetName]已不只是一件藏品。廷臣开始期待它的持有者按照其传说行事。"
 rol_relic_legacy.0001.a: "我会践行它的传说。"
 rol_relic_legacy.0001.a.flavor: "传奇的负担同样能带来权威。"
 rol_relic_legacy.0001.b: "传说应当服从持有者。"
 rol_relic_legacy.0001.b.flavor: "敬畏不等于屈服。"
 rol_relic_legacy.0002.t: "触碰传奇之手"
 rol_relic_legacy.0002.desc: "专家请求研究[scope:rol_legacy_artifact.GetName]。研究或许能扩大其声名，但每一双触碰它的手都令人不安。"
 rol_relic_legacy.0002.a: "资助一次谨慎的研究。"
 rol_relic_legacy.0002.a.flavor: "知识会让圣物的故事更难受到质疑。"
 rol_relic_legacy.0002.b: "把它封存，远离好奇之手。"
 rol_relic_legacy.0002.b.flavor: "有些奥秘一经丈量便会失去力量。"
 rol_relic_legacy.0003.t: "传奇再次择主"
 rol_relic_legacy.0003.desc: "[scope:rol_legacy_artifact.GetName]如今落入你的手中。旧主的故事仍萦绕其上，但宫廷已在等待你留下自己的印记。"
 rol_relic_legacy.0003.a: "它的新传奇由我开始。"
 rol_relic_legacy.0003.a.flavor: "占有只是驾驭传奇的第一道考验。"
 rol_relic_legacy.0101.t: "纳克索斯检阅"
 rol_relic_legacy.0101.desc: "誓卫列队受检。老兵要求他们的纪律必须配得上你所寻回的传统。"
 rol_relic_legacy.0101.a: "不惜代价维持战备。"
 rol_relic_legacy.0101.a.flavor: "传奇纪律由汗水与白银共同铸成。"
 rol_relic_legacy.0101.b: "完整保留古老操典。"
 rol_relic_legacy.0101.b.flavor: "延续本身便是一种权威。"
 rol_relic_legacy.0102.t: "老兵的请愿"
 rol_relic_legacy.0102.desc: "资深誓卫请求招募并装备一批新人。扩编意味着荣耀，却也可能稀释他们来之不易的标准。"
 rol_relic_legacy.0102.a: "组建新的队伍。"
 rol_relic_legacy.0102.a.flavor: "活着的传统必须成长。"
 rol_relic_legacy.0102.b: "保持稀少，也保持无双。"
 rol_relic_legacy.0102.b.flavor: "他们的稀缺正是力量的一部分。"
 rol_relic_legacy.0103.t: "誓言比主人长久"
 rol_relic_legacy.0103.desc: "纳克索斯老兵送别了[scope:rol_naxos_predecessor.GetTitledFirstName]。他们只愿向有能力和军事声望延续传统的继承人重新宣誓。"
 rol_relic_legacy.0103.a: "我接受誓言，也接受负担。"
 rol_relic_legacy.0103.a.flavor: "黄金与声望会把旧卫队维系于新统治之下。"
 rol_relic_legacy.0103.b: "让古老誓言体面终结。"
 rol_relic_legacy.0103.b.flavor: "并非每一份遗产都必须认领。"
