l_simp_chinese:
 rol_quest_naxos.0990.t:0 "抵达泰拉（Thera）"
 rol_quest_naxos.0990.desc:0 "在泰拉的火山崖壁下，罗马铭文与陌生符印共同标出一条隐秘下行通道。地下宫殿并非传说。"
 rol_quest_naxos.0990.a:0 "进入宫殿。"

 rol_quest_naxos.1000.t:0 "帝皇前厅"
 rol_quest_naxos.1000.desc:0 "石质穹顶与不可思议的合金构成了第一道闸门。残存记录暗示：帝皇曾在此守护人类火种，并留下禁军誓令封锁。"
 rol_quest_naxos.1000.a:0 "以武力击破第一道封印。"
 rol_quest_naxos.1000.b:0 "先解读机关逻辑。"
 rol_quest_naxos.1000.c:0 "立刻撤离。"
 rol_quest_naxos.1000.a.tt:0 "[martial|E]/[prowess|E]检定：以武力击破第一道封印。"
 rol_quest_naxos.1000.a.odds_elite_tt:0 "此举对当前试炼可谓 #P把握极高#!。"
 rol_quest_naxos.1000.a.odds_high_tt:0 "此举目前 #P胜算较高#!。"
 rol_quest_naxos.1000.a.odds_low_tt:0 "此举仍是 #N高风险豪赌#!。"
 rol_quest_naxos.1000.b.tt:0 "[learning|E]检定：成功可完整同步第一道封印。"
 rol_quest_naxos.1000.c.tt:0 "中止远征并进入2年冷却。"

 rol_quest_naxos.1010.t:0 "首封已破"
 rol_quest_naxos.1010.desc:0 "闸门开启，深处回荡起沉重而同步的脚步声。"
 rol_quest_naxos.1010.a:0 "继续推进。"
 rol_quest_naxos.1011.t:0 "阵线崩溃"
 rol_quest_naxos.1011.desc:0 "你的阵型在高压下瓦解。若继续前进，整支远征队都将覆灭。"
 rol_quest_naxos.1011.a:0 "先评估队伍和现有证据。"
 rol_quest_naxos.1012.t:0 "命令撤退"
 rol_quest_naxos.1012.desc:0 "你保住了核心战力并后撤。宫殿在你身后重新封闭。"
 rol_quest_naxos.1012.a:0 "两年后再来。"

 rol_quest_naxos.1002.t:0 "验证大厅"
 rol_quest_naxos.1002.desc:0 "指挥权、忠诚与意图将被分层验证。任何失误都会触发致命反制。"
 rol_quest_naxos.1002.a:0 "以统御力稳住全线。"
 rol_quest_naxos.1002.b:0 "逐项破解验证序列。"
 rol_quest_naxos.1002.c:0 "中止验证流程。"
 rol_quest_naxos.1002.a.tt:0 "[diplomacy|E]检定：以统御力稳住整条验证线。"
 rol_quest_naxos.1002.a.odds_elite_tt:0 "此举对当前试炼可谓 #P把握极高#!。"
 rol_quest_naxos.1002.a.odds_high_tt:0 "此举目前 #P胜算较高#!。"
 rol_quest_naxos.1002.a.odds_low_tt:0 "此举仍是 #N高风险豪赌#!。"
 rol_quest_naxos.1002.b.tt:0 "[learning|E]检定：逐层拆解验证序列。"
 rol_quest_naxos.1002.b.odds_elite_tt:0 "此举对当前试炼可谓 #P把握极高#!。"
 rol_quest_naxos.1002.b.odds_high_tt:0 "此举目前 #P胜算较高#!。"
 rol_quest_naxos.1002.b.odds_low_tt:0 "此举仍是 #N高风险豪赌#!。"
 rol_quest_naxos.1002.c.tt:0 "中止流程并进入冷却。"

 rol_quest_naxos.1020.t:0 "验证通过"
 rol_quest_naxos.1020.desc:0 "核心通道已开启。禁军誓令中枢就在前方。"
 rol_quest_naxos.1020.a:0 "继续。"
 rol_quest_naxos.1021.t:0 "验证失败"
 rol_quest_naxos.1021.desc:0 "整座大厅的反制机制全面激活，安全推进已不可能。"
 rol_quest_naxos.1021.a:0 "先评估队伍和现有证据。"
 rol_quest_naxos.1022.t:0 "序列中止"
 rol_quest_naxos.1022.desc:0 "你在彻底失控前主动脱离了流程。"
 rol_quest_naxos.1022.a:0 "完成回撤。"

 rol_quest_naxos.1003.t:0 "禁军守门阵列"
 rol_quest_naxos.1003.desc:0 "最终门扉前，金甲残影列成沉默战阵。"
 rol_quest_naxos.1003.a:0 "正面冲破阵列。"
 rol_quest_naxos.1003.b:0 "潜入其后切断中枢。"
 rol_quest_naxos.1003.c:0 "撤退。"
 rol_quest_naxos.1003.a.tt:0 "[martial|E]/[prowess|E]检定：正面打穿守门阵列。"
 rol_quest_naxos.1003.a.odds_elite_tt:0 "此举对当前试炼可谓 #P把握极高#!。"
 rol_quest_naxos.1003.a.odds_high_tt:0 "此举目前 #P胜算较高#!。"
 rol_quest_naxos.1003.a.odds_low_tt:0 "此举仍是 #N高风险豪赌#!。"
 rol_quest_naxos.1003.b.tt:0 "[intrigue|E]检定：潜入阵后切断守门中枢，完整同步终门。"
 rol_quest_naxos.1003.b.odds_elite_tt:0 "此举对当前试炼可谓 #P把握极高#!。"
 rol_quest_naxos.1003.b.odds_high_tt:0 "此举目前 #P胜算较高#!。"
 rol_quest_naxos.1003.b.odds_low_tt:0 "此举仍是 #N高风险豪赌#!。"
 rol_quest_naxos.1003.c.tt:0 "中止流程并进入冷却。"

 rol_quest_naxos.1030.t:0 "门扉让路"
 rol_quest_naxos.1030.desc:0 "阵列分开，誓令石柱依次点亮，仿佛认可了你的指挥权。"
 rol_quest_naxos.1030.a:0 "接受最终裁定。"
 rol_quest_naxos.1031.t:0 "门扉拒绝"
 rol_quest_naxos.1031.desc:0 "守门阵列击碎了你的节奏。若强行推进，只会全军覆没。"
 rol_quest_naxos.1031.a:0 "先评估队伍和现有证据。"
 rol_quest_naxos.1032.t:0 "止步终门"
 rol_quest_naxos.1032.desc:0 "你在最后门槛前下令撤离。"
 rol_quest_naxos.1032.a:0 "全队收拢。"
 rol_quest_naxos.1050.t:0 "地宫军议"
 rol_quest_naxos.1050.desc:0 "一位受邀同行者建议在下一道指令锁前放缓节奏，先稳住阵列与心态。"
 rol_quest_naxos.1050.a:0 "采纳稳健方案。"
 rol_quest_naxos.1050.b:0 "保持强压推进。"

 rol_quest_naxos.1001.t:0 "泰拉宫殿的最终裁决"
 rol_quest_naxos.1001.desc:0 "你站在最终誓令接口之前。"
 rol_quest_naxos.1001.desc.tier_1:0 "你抵达了终点，但未能完成同步。"
 rol_quest_naxos.1001.desc.tier_2:0 "你通过了多数试炼，但指挥锁仍未开启。"
 rol_quest_naxos.1001.desc.tier_3:0 "你已非常接近成功，却仍差最后一步。"
 rol_quest_naxos.1001.desc.tier_4:0 "全部试炼完成。宫殿向你授予禁军指挥权。"
 rol_quest_naxos.1001.desc.below_tier4:0 "最后一道界面收回了回应。宫殿归于寂静，而答案并不属于你。"
 rol_quest_naxos.1001.desc.partial:0 "指挥锁仍未开启，但宫殿留下了一组可用的刻痕。你带回了下一次尝试的证据，却还没有完整的权柄。"
 rol_quest_naxos.1001.a:0 "下达禁军征召令。"
 rol_quest_naxos.1001.a.tt:0 "唯有最终裁决真正承认你的号令，你才算完成此行；否则本次远征失败并进入2年冷却。"

 rol_quest_naxos.1090.t:0 "泰拉远征结算"
 rol_quest_naxos.1090.desc.success_4.standard:0 "这是一场近乎神话的胜利。地下宫殿如今响应你的命令。\n\n$EFFECT_LIST_BULLET$解锁招募：#P $rol_adeptus_custudes$#!\n$EFFECT_LIST_BULLET$获得 #P +220#! [prestige|E]\n$EFFECT_LIST_BULLET$获得 #P +80#! [gold|E]\n$EFFECT_LIST_BULLET$本次整备档位未提供额外凯旋奖励"
 rol_quest_naxos.1090.desc.success_4.high:0 "这是一场近乎神话的胜利。地下宫殿如今响应你的命令。\n\n$EFFECT_LIST_BULLET$解锁招募：#P $rol_adeptus_custudes$#!\n$EFFECT_LIST_BULLET$获得 #P +220#! [prestige|E]\n$EFFECT_LIST_BULLET$获得 #P +80#! [gold|E]\n$EFFECT_LIST_BULLET$因高等整备额外获得 #P +150#! [prestige|E] 与 #P +25#! [dynasty_prestige|E]"
 rol_quest_naxos.1090.desc.success_4.supreme:0 "这是一场近乎神话的胜利。地下宫殿如今响应你的命令。\n\n$EFFECT_LIST_BULLET$解锁招募：#P $rol_adeptus_custudes$#!\n$EFFECT_LIST_BULLET$获得 #P +220#! [prestige|E]\n$EFFECT_LIST_BULLET$获得 #P +80#! [gold|E]\n$EFFECT_LIST_BULLET$因极致整备额外获得 #P +350#! [prestige|E] 与 #P +50#! [dynasty_prestige|E]"
 rol_quest_naxos.1090.desc.success_3:0 "你的掌控相当出色，但仍未达到完美闭环。"
 rol_quest_naxos.1090.desc.success_2:0 "你以沉重代价推进到终点。"
 rol_quest_naxos.1090.desc.success_1:0 "你勉强保全了远征队。"
 rol_quest_naxos.1090.desc.failure:0 "本次远征失败，需要长期整备恢复。"
 rol_quest_naxos.1090.desc.fallback:0 "远征已结束。"
 rol_quest_naxos.1090.a:0 "将行动写入档案。"

 activity_rol_seek_naxos_guard:0 "泰拉地下宫殿远征"
 activity_rol_seek_naxos_guard_desc:0 "深入泰拉埋藏宫殿，调查不可能的指令回响、封缄厅室与凡人早已遗忘的裁决。"
 activity_rol_seek_naxos_guard_host_desc:0 "$BULLET_WITH_TAB$可通过$rol_option_expedition_preparation$活动选项调整整备档位\n$BULLET_WITH_TAB$符合条件时每场可补救一次；未获补救的失败终止远征并进入2年冷却"
 activity_rol_seek_naxos_guard_guest_desc:0 ""
 activity_rol_seek_naxos_guard_conclusion_desc:0 "火山岩层在你身后再度封闭。"
 activity_rol_seek_naxos_guard_conclusion_desc_success_4:0 "你完整重启了禁军指挥权。"
 activity_rol_seek_naxos_guard_conclusion_desc_success_3:0 "你距离成功仅一步之遥。"
 activity_rol_seek_naxos_guard_conclusion_desc_success_2:0 "你艰难推进到底，但仍未获得最终授权。"
 activity_rol_seek_naxos_guard_conclusion_desc_success_1:0 "你勉强完成了有序撤退。"
 activity_rol_seek_naxos_guard_conclusion_desc_failure:0 "行动被迫终止。进入两年冷却。"
 activity_rol_seek_naxos_guard_conclusion_desc_fallback:0 "远征结束。"
 activity_rol_seek_naxos_guard_selection_tooltip:0 "率队深入泰拉门槛之下，穿过埋藏的指令系统与沉默守卫，迎向一场没有凡俗法庭能够复述的裁决。\n\n符合条件时每场可补救一次；未获补救的失败终止远征并进入2年冷却。"
 activity_rol_seek_naxos_guard_predicted_cost:0 "本次远征的总花费，将高度取决于你选择的人手与装备档位。"
 activity_rol_seek_naxos_guard_province_desc:0 "目标地点：[ROOT.Province.GetName]"

 activity_rol_seek_naxos_guard_special_type_title:0 "宫殿同步度"
 activity_rol_seek_naxos_guard_special_type_desc:0 "你的抉择会决定埋藏指令网络与你同步到何种程度。唯有最深层的同步，才会换来最终裁决的回应。"
 ROL_NAXOS_WINDOW_SPECIAL_PROGRESS_TOOLTIP:0 "当前同步度：[ActivityWindow.GetSpecialProgressValue|0^V]"
 activity_rol_seek_naxos_guard_special_type_bar_segment_tt_0:0 "#T 崩溃边缘#!\n远征队接近全面失控。"
 activity_rol_seek_naxos_guard_special_type_bar_segment_tt_1:0 "#T 高危推进#!\n仍在前进，但风险极高。"
 activity_rol_seek_naxos_guard_special_type_bar_segment_tt_2:0 "#T 逐步恢复#!\n局势开始回到你的掌控。"
 activity_rol_seek_naxos_guard_special_type_bar_segment_tt_3:0 "#T 优势确立#!\n你已接近最终阈值。"
 activity_rol_seek_naxos_guard_special_type_bar_segment_tt_4:0 "#T 最终裁决#!\n宫殿即将给出决定性的答复。"
 activity_rol_seek_naxos_guard_special_type_bar_segment_0_tt:0 "$activity_rol_seek_naxos_guard_special_type_bar_segment_tt_0$"
 activity_rol_seek_naxos_guard_special_type_bar_segment_1_tt:0 "$activity_rol_seek_naxos_guard_special_type_bar_segment_tt_1$"
 activity_rol_seek_naxos_guard_special_type_bar_segment_2_tt:0 "$activity_rol_seek_naxos_guard_special_type_bar_segment_tt_2$"
 activity_rol_seek_naxos_guard_special_type_bar_segment_3_tt:0 "$activity_rol_seek_naxos_guard_special_type_bar_segment_tt_3$"
 activity_rol_seek_naxos_guard_special_type_bar_segment_4_tt:0 "$activity_rol_seek_naxos_guard_special_type_bar_segment_tt_4$"

 phase_rol_naxos_descent_phase:0 "泰拉地宫探索"
 phase_rol_naxos_descent_phase_desc:0 "你的队伍正在穿过泰拉地下宫殿，追寻帝皇遗留的最终誓令。"
 rol_naxos_descent_phase:0 "$phase_rol_naxos_descent_phase$"
 rol_naxos_descent_phase_desc:0 "$phase_rol_naxos_descent_phase_desc$"

 rol_seek_naxos_guard_cost_desc:0 "泰拉远征筹备费用"
 rol_naxos_quest_on_cooldown_tt:0 "你最近一次泰拉远征失败了，必须等待2年后再试。"
 rol_naxos_quest_cooldown_modifier:0 "泰拉远征冷却"
 rol_naxos_quest_cooldown_modifier_desc:0 "上次远征损失惨重，队伍暂时无法再次组织同级行动。"
 TRAVEL_NAME_FOR_activity_rol_seek_naxos_guard:0 "[Character.GetFirstNameNoTooltip]的泰拉远征"

 rol_naxos_activity_success_toast_title:0 "泰拉远征成功"
 rol_naxos_activity_failure_toast_title:0 "泰拉远征失败"
 rol_naxos_activity_success_toast_desc:0 "你已突破宫殿试炼，指挥权得到确认。"
 rol_naxos_activity_failure_toast_desc:0 "行动失败，后勤与士气都需要恢复后方可再试。"

 rol_adeptus_custudes:0 "禁军"
 rol_adeptus_custudes_flavor:0 "帝皇的金甲伴卫，为侍立于人类之主身侧而铸成的基因战士。唯有完成誓令指挥序列、通过泰拉地宫最终裁决之人，方可唤醒这支“万夫团”的古老编制。"
 rol_naxian_tideguard:0 "$rol_adeptus_custudes$"
 rol_naxian_tideguard_flavor:0 "$rol_adeptus_custudes_flavor$"
