 rol_relic_fragment.0001.t: "遗失的残片"
 rol_relic_fragment.0001.desc: "新的线索指向一块可能改变[ROOT.Char.GetFirstNamePossessive]圣物声名的残片。道路并不遥远，但每一步都可能损伤你已经拥有的东西。"
 rol_relic_fragment.0001.a: "研究古老的测量记录。"
 rol_relic_fragment.0001.a.flavor: "耐心的目光或许能找到急切之手会毁掉的东西。"
 rol_relic_fragment.0001.b: "强行打开封闭的密室。"
 rol_relic_fragment.0001.b.flavor: "这件圣物历经战争，也能承受下一次考验。"
 rol_relic_fragment.0001.c: "资助一次谨慎的发掘。"
 rol_relic_fragment.0001.c.flavor: "趁手的工具和稳定的双手，能让传闻变成发现。"
 rol_relic_fragment.0001.success: "残片严丝合缝地嵌入其中，圣物以更深沉的共鸣回应。"
 rol_relic_fragment.0001.failure: "密室在残片固定之前塌陷了。"
 rol_relic_fragment.0002.t: "更深的共鸣"
 rol_relic_fragment.0002.desc: "找回的残片已经嵌入[ROOT.Char.GetFirstNamePossessive]圣物。它的平衡、重量与古老刻痕，都暗示着一段远超残片本身的历史。"
 rol_relic_fragment.0002.a: "让新的传奇沉淀下来。"
 rol_relic_fragment.0001.desc.invalid:0 "动身时记录的圣物已经不再属于我，或它已完成全部碎片升级。无法把这次工作转到另一件圣物上。可以结束远征，不再检定或领奖；已经投入的费用不退还。"
 rol_relic_fragment.0001.d:0 "结束这次碎片远征。"
 rol_relic_fragment.0001.d.flavor:0 "先确定工作属于谁，再谈修复。"
 rol_fragment_cancel_tt:0 "关闭原物品的远征记录，无新压力或奖励，费用不退、决策冷却保留。"
