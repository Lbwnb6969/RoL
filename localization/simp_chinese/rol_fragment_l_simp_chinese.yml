 rol_relic_fragment.0001.t: "遗失的残片"
 rol_relic_fragment.0001.desc: "新的线索指向一块可能改变[ROOT.Char.GetFirstNamePossessive]圣物声名的残片。道路并不遥远，但每一步都可能损伤你已经拥有的东西。"
 rol_relic_fragment.0001.a: "研究古老的测量记录。"
 rol_relic_fragment.0001.a.flavor: "耐心的目光或许能找到急切之手会毁掉的东西。"
 rol_relic_fragment.0001.a.odds_tt:0 "当前考据成功率：#P [ROOT.Char.MakeScope.ScriptValue('rol_fragment_learning_success_chance_value')|0]%#!（失败率：#N [ROOT.Char.MakeScope.ScriptValue('rol_fragment_learning_failure_chance_value')|0]%#!）。受[learning|E]与探寻者考据专长加成。"
 rol_relic_fragment.0001.b: "强行打开封闭的密室。"
 rol_relic_fragment.0001.b.flavor: "这件圣物历经战争，也能承受下一次考验。"
 rol_relic_fragment.0001.b.odds_tt:0 "当前强夺成功率：#P [ROOT.Char.MakeScope.ScriptValue('rol_fragment_prowess_success_chance_value')|0]%#!（失败率：#N [ROOT.Char.MakeScope.ScriptValue('rol_fragment_prowess_failure_chance_value')|0]%#!）。受[prowess|E]与探寻者探险专长加成，成功额外减轻压力。"
 rol_relic_fragment.0001.c: "重金延请匠师与稳妥工程队。"
 rol_relic_fragment.0001.c.flavor: "趁手的工具、精良的支架和老练的工匠，能将风险降至最低并留下余料。"
 rol_relic_fragment.0001.c.odds_tt:0 "当前精铸发掘成功率：#P [ROOT.Char.MakeScope.ScriptValue('rol_fragment_stewardship_success_chance_value')|0]%#!（失败率：#N [ROOT.Char.MakeScope.ScriptValue('rol_fragment_stewardship_failure_chance_value')|0]%#!）。受[stewardship|E]与交涉专长加成。精铸工程成功额外花费50金币并获得五年匠师加成；失败额外花费25金币，并比其他碎片路线少增加10基础压力，仍保留两年失败修正。"
 rol_relic_fragment.0001.success: "残片严丝合缝地嵌入其中，圣物以更深沉的共鸣回应。"
 rol_relic_fragment.0001.failure: "密室在残片固定之前塌陷了。"
 rol_relic_fragment.0002.t: "更深的共鸣"
 rol_relic_fragment.0002.desc: "找回的残片已经嵌入[ROOT.Char.GetFirstNamePossessive]圣物。它的平衡、重量与古老刻痕，都暗示着一段远超残片本身的历史。如今我可以选择如何引导这股新唤醒的力量。"
 rol_relic_fragment.0002.a: "砥砺锋芒，张扬征伐之威。"
 rol_relic_fragment.0002.a.flavor:0 "让重铸后的圣物成为战阵与铁腕的象征（获得五年锋芒共鸣与5点探险经验）。"
 rol_relic_fragment.0002.b:0 "拓印新显露的秘文，潜心考据。"
 rol_relic_fragment.0002.b.flavor:0 "嵌合处浮现的刻度值得学者彻夜研读（获得五年秘典共鸣与5点考据经验）。"
 rol_relic_fragment.0002.c:0 "在宫廷盛典中展示重铸神迹。"
 rol_relic_fragment.0002.c.flavor:0 "让群臣亲眼见证完整度更胜往昔的传奇（减轻压力，获得五年礼法共鸣与5点交涉经验）。"
 rol_relic_fragment.0001.desc.invalid:0 "动身时记录的圣物已经不再属于我，或它已完成全部碎片升级。无法把这次工作转到另一件圣物上。可以结束远征，不再检定或领奖；已经投入的费用不退还。"
 rol_relic_fragment.0001.d:0 "结束这次碎片远征。"
 rol_relic_fragment.0001.d.flavor:0 "先确定工作属于谁，再谈修复。"
 rol_fragment_cancel_tt:0 "关闭原物品的远征记录，无新压力或奖励，费用不退、决策冷却保留。"
 rol_fragment_masterwork_surplus_modifier:0 "匠师余料精铸"
 rol_fragment_masterwork_surplus_modifier_desc:0 "稳妥的碎片发掘工程留下了珍贵的古代构件与工坊经验，提升了领地治理效率。"
 rol_fragment_resonance_might_modifier:0 "残片共鸣：百战锋芒"
 rol_fragment_resonance_might_modifier_desc:0 "新嵌合的圣物残片激发了持有者的尚武斗志与威慑力。持续五年，会被下次残片共鸣取向替换。"
 rol_fragment_resonance_wisdom_modifier:0 "残片共鸣：古铭启迪"
 rol_fragment_resonance_wisdom_modifier_desc:0 "新嵌合的圣物残片补全了失落的铭文脉络，助益学术思考。持续五年，会被下次残片共鸣取向替换。"
 rol_fragment_resonance_court_modifier:0 "残片共鸣：万众钦服"
 rol_fragment_resonance_court_modifier_desc:0 "重获完整的圣物在宫廷中激起敬畏与赞叹。持续五年，会被下次残片共鸣取向替换。"
