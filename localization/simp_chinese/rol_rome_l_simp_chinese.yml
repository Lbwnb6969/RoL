l_simp_chinese:
 rol_blade_of_mars:0 "战神玛尔斯之剑"
 rol_blade_of_mars_desc:0 "据说此剑曾由战神玛尔斯亲手执握。剑锋映着暗红血辉，仿佛仍在渴求战场上的怒吼与献祭。"
 artifact_rol_blade_of_mars:0 "战神玛尔斯之剑"
 artifact_rol_blade_of_mars_desc:0 "这柄古剑在黑暗中泛着嗜血红辉，仿佛仍在回应战神玛尔斯的召唤。"

 rol_quest_rome.0990.t:0 "抵达封印地宫"
 rol_quest_rome.0990.desc:0 "你率队来到罗马地层下那道崩裂的入口。冷风从黑暗深处缓缓吐息，火把的光都显得渺小。就连老兵也不自觉压低了声音，只因石壁上的军团刻纹仍在无声注视来者。"
 rol_quest_rome.0990.a:0 "整队列阵，以肃静与钢铁入内。"

 rol_quest_rome.1000.t:0 "深入帕拉蒂尼地宫"
 rol_quest_rome.1000.desc.mars:0 "火把的光在潮湿石壁上摇曳。前方既有古罗马禁卫军的残影徘徊，也有仍在运作的致命机关潜伏于暗处。再向前一步，便无回头之路。"
 rol_quest_rome.1000.desc.weapon:0 "你踏入地下甬道，空气中弥漫着铁锈与灰尘的味道。前方的陷阱与守卫残影，仿佛只为阻止后来者触碰那件战争遗物。"
 rol_quest_rome.1000.desc.regalia:0 "石壁上的王权铭文在火光中若隐若现。你意识到，这条甬道守护的不只是宝物，更是一段足以改写统治合法性的古老象征。"
 rol_quest_rome.1000.desc.accessory:0 "狭窄地道深处传来细微回音，像某种仪式在远处重演。你正在追寻的，可能是一件被神话化的秘饰，而非单纯的战利品。"
 rol_quest_rome.1000.desc.generic:0 "幽暗甬道深不见底，残存机关仍在运作。你知道，前方必有代价，但也可能有足以改写史册的收获。"
 rol_quest_rome.1000.a:0 "拔剑硬闯！"
 rol_quest_rome.1000.b:0 "解读铭文，破解机关。"
 rol_quest_rome.1000.c:0 "此行凶险，先行撤退。"
 rol_quest_rome.1000.a.base_tt:0 "[martial|E]/[prowess|E]检定：军事或勇武越高，硬闯成功率越高。"
 rol_quest_rome.1000.a.odds_elite_tt:0 "此举对当前试炼可谓 #P把握极高#!。"
 rol_quest_rome.1000.a.odds_high_tt:0 "此举目前 #P胜算较高#!。"
 rol_quest_rome.1000.a.odds_low_tt:0 "此举仍是 #N高风险豪赌#!。"
 rol_quest_rome.1000.b.tt:0 "[learning|E]检定通过，成功率 #P 100%#!，并提升远征进度。"
 rol_quest_rome.1000.c.tt:0 "你将立刻判定本次远征失败，并进入2年冷却。"

 rol_quest_rome.1010.t:0 "突入成功"
 rol_quest_rome.1010.desc:0 "你抓住了地宫节奏，队伍在混乱中重新稳住阵列。前路虽仍险恶，但你已经夺回主动。"
 rol_quest_rome.1010.a:0 "继续推进。"
 rol_quest_rome.1011.t:0 "突入受挫"
 rol_quest_rome.1011.desc:0 "鲜血沿石阶流下，地宫的第一道试炼已让队伍付出代价。继续硬撑只会招来更惨烈的崩盘。"
 rol_quest_rome.1011.a:0 "被迫终止远征。"
 rol_quest_rome.1012.t:0 "主动撤离"
 rol_quest_rome.1012.desc:0 "你下令后撤，火把光芒在黑暗中渐次熄灭。这次地宫远征就此作罢。"
 rol_quest_rome.1012.a:0 "等待下一次机会。"

 rol_quest_rome.1001.t:0 "玛尔斯的赐福"
 rol_quest_rome.1001.desc.generic:0 "伴随低沉轰鸣，封印祭坛缓缓开启。你握住遗物的瞬间，古老力量沿着器身奔涌而出。"
 rol_quest_rome.1001.desc.weapon:0 "你握住那柄沉睡已久的刃兵，金属在掌中发出低鸣，像在确认新的征服者。"
 rol_quest_rome.1001.desc.regalia:0 "当你触及那件礼器，符文逐层亮起。它不只是器物，而是可被世人见证的权威象征。"
 rol_quest_rome.1001.desc.accessory:0 "那件配饰在你掌中泛起微光，细小却不容忽视，像将一段失落神话系在了你的命运之上。"
 rol_quest_rome.1001.desc.mars.tier_4:0 "你毫无退缩，以铁血意志横扫全部试炼。军号在地宫回响，玛尔斯之剑在最炽热的血光中降临。"
 rol_quest_rome.1001.desc.mars.below_tier4:0 "你抵达了核心，却在宣告前听见了沉默。此地真正的回应仍从你手中退去。"
 rol_quest_rome.1001.desc.mars.partial:0 "你抵达核心并带回了仪式结构的一部分。完整的圣物仍被封印，但这条线索足以指引下一次远征。"
 rol_quest_rome.1001.a:0 "让诸神见证我的征服。"
 rol_quest_rome.1001.a.tt:0 "若最终回响真正回应你的远征，你才能完成宣告；否则本次远征失败并进入2年冷却。"

 rol_quest_rome.1002.t:0 "落石回廊"
 rol_quest_rome.1002.desc.mars:0 "地宫深处的石梁突然开裂，轰鸣声自头顶压下。巨石如雨坠落，通道即将被彻底吞没。"
 rol_quest_rome.1002.desc.weapon:0 "崩塌的石道逼得你顶着碎石前进。每一步都像在与时间赛跑，稍有迟疑就会被埋葬。"
 rol_quest_rome.1002.desc.regalia:0 "刻满王权纹饰的石柱接连倾覆。你必须在遗迹彻底坍塌前，抢出通往核心墓室的路径。"
 rol_quest_rome.1002.desc.accessory:0 "狭窄甬道骤然震颤，碎石封堵了来路。你只能向前，在崩塌中寻找唯一生机。"
 rol_quest_rome.1002.desc.generic:0 "通道开始坍塌，巨石接连落下。再迟疑片刻，你和队伍就会被困死在地下。"
 rol_quest_rome.1002.a:0 "顶着碎石强行突进。"
 rol_quest_rome.1002.b:0 "撤回地表，保存实力。"
 rol_quest_rome.1002.a.tt:0 "[prowess|E]检定：在回廊彻底坍塌前强行突进。"
 rol_quest_rome.1002.b.tt:0 "你选择撤退：本次远征失败，进入2年冷却。"

 rol_quest_rome.1020.t:0 "回廊突破"
 rol_quest_rome.1020.desc:0 "你在落石间找到生路，队伍虽狼狈却未溃散。地宫深处的大门再次向你开启。"
 rol_quest_rome.1020.a:0 "继续前进。"
 rol_quest_rome.1021.t:0 "回廊崩溃"
 rol_quest_rome.1021.desc:0 "坍塌吞噬了队伍的士气与阵形，继续深入只会让更多人埋骨地底。"
 rol_quest_rome.1021.a:0 "终止行动。"
 rol_quest_rome.1022.t:0 "撤离回廊"
 rol_quest_rome.1022.desc:0 "你命令全员撤回。巨石在身后封死通道，这次尝试到此结束。"
 rol_quest_rome.1022.a:0 "先保住人命。"

 rol_quest_rome.1003.t:0 "血誓祭坛"
 rol_quest_rome.1003.desc.mars:0 "你来到一座刻满军团誓言的祭坛。暗红符文像活物般游动，仿佛在审视每一个闯入者的心志。"
 rol_quest_rome.1003.desc.weapon:0 "祭坛上的战誓铭文仍在低鸣，像在质问你是否配得上那件杀伐遗物。"
 rol_quest_rome.1003.desc.regalia:0 "古老礼文盘绕祭坛，似乎只认可真正懂得权威与秩序的人。"
 rol_quest_rome.1003.desc.accessory:0 "细密符文在祭坛边缘闪烁，像一道仪式性的筛选，排斥所有心志不坚者。"
 rol_quest_rome.1003.desc.generic:0 "祭坛符文开始活化，像在对闯入者进行某种古老试炼。"
 rol_quest_rome.1003.a:0 "诵读古文，破除誓锁。"
 rol_quest_rome.1003.b:0 "强行跨过祭坛。"
 rol_quest_rome.1003.a.tt:0 "[learning|E]检定：解读血誓祭坛的古老誓文。"
 rol_quest_rome.1003.b.tt:0 "孤注一掷地硬闯祭坛回响。"

 rol_quest_rome.1030.t:0 "祭坛压制成功"
 rol_quest_rome.1030.desc:0 "躁动符文逐渐归于沉寂。你成功压住了祭坛反噬，远征得以继续。"
 rol_quest_rome.1030.a:0 "向核心推进。"
 rol_quest_rome.1031.t:0 "祭坛反噬"
 rol_quest_rome.1031.desc:0 "誓文化作无形重压，队伍精神瞬间崩裂。你不得不承认，这次试炼已经失败。"
 rol_quest_rome.1031.a:0 "撤离地宫。"

 rol_quest_rome.1004.t:0 "禁卫残影"
 rol_quest_rome.1004.desc.mars:0 "长廊尽头，披甲残影列阵而立。它们无声举盾，战戟齐鸣，像一支永不溃散的古罗马禁卫军。"
 rol_quest_rome.1004.desc.weapon:0 "守卫残影以战阵封死去路，唯有击溃它们，你才有资格触碰最后的兵刃。"
 rol_quest_rome.1004.desc.regalia:0 "古代护卫的残影以仪式队列拦截前路，像在守护一件不容僭越的王者象征。"
 rol_quest_rome.1004.desc.accessory:0 "幽影在回廊尽头现形，沉默却致命。你意识到，最后一道门槛远比陷阱更危险。"
 rol_quest_rome.1004.desc.generic:0 "披甲残影挡住了最后通道。若不能突破它们，这次远征将止步于此。"
 rol_quest_rome.1004.a:0 "正面冲垮他们！"
 rol_quest_rome.1004.b:0 "此处不宜久留，后撤。"
 rol_quest_rome.1004.a.tt:0 "[martial|E]/[prowess|E]检定：正面冲垮最后的守卫阵列。"
 rol_quest_rome.1004.b.tt:0 "你选择撤退：本次远征失败，进入2年冷却。"

 rol_quest_rome.1040.t:0 "残影溃散"
 rol_quest_rome.1040.desc:0 "最后一列残影在你面前消散。核心祭坛近在咫尺，胜利的门槛已被你踏碎。"
 rol_quest_rome.1040.a:0 "迎接终局。"
 rol_quest_rome.1041.t:0 "阵线崩裂"
 rol_quest_rome.1041.desc:0 "残影战阵反冲而来，队伍彻底失序。你只能下令终止远征，保住残余人手。"
 rol_quest_rome.1041.a:0 "撤离。"
 rol_quest_rome.1042.t:0 "最后关头撤退"
 rol_quest_rome.1042.desc:0 "你在核心门前止步。传说仍在门后，但这次远征已无力再战。"
 rol_quest_rome.1042.a:0 "保存实力。"
 rol_quest_rome.1050.t:0 "火炬下的军议"
 rol_quest_rome.1050.desc:0 "与你同行的一位受邀宾客建议在下一道关隘前调整阵列。此策更稳妥，但会拖慢推进节奏。"
 rol_quest_rome.1050.a:0 "采纳建议。"
 rol_quest_rome.1050.b:0 "按原计划强推。"

 rol_quest_rome.1090.t:0 "远征结算"
 rol_quest_rome.1090.desc.success_4.standard:0 "你的远征几乎以完美姿态落幕。队伍纪律、战术执行与临场抉择无可挑剔，这将成为后世传唱的范本。\n\n$EFFECT_LIST_BULLET$获得圣物：#P $artifact_rol_blade_of_mars$#!\n$EFFECT_LIST_BULLET$获得 #P +250#! [prestige|E]\n$EFFECT_LIST_BULLET$获得 #P +150#! [piety|E]\n$EFFECT_LIST_BULLET$本次整备档位未提供额外凯旋奖励"
 rol_quest_rome.1090.desc.success_4.high:0 "你的远征几乎以完美姿态落幕。队伍纪律、战术执行与临场抉择无可挑剔，这将成为后世传唱的范本。\n\n$EFFECT_LIST_BULLET$获得圣物：#P $artifact_rol_blade_of_mars$#!\n$EFFECT_LIST_BULLET$获得 #P +250#! [prestige|E]\n$EFFECT_LIST_BULLET$获得 #P +150#! [piety|E]\n$EFFECT_LIST_BULLET$因高等整备额外获得 #P +150#! [prestige|E] 与 #P +25#! [dynasty_prestige|E]"
 rol_quest_rome.1090.desc.success_4.supreme:0 "你的远征几乎以完美姿态落幕。队伍纪律、战术执行与临场抉择无可挑剔，这将成为后世传唱的范本。\n\n$EFFECT_LIST_BULLET$获得圣物：#P $artifact_rol_blade_of_mars$#!\n$EFFECT_LIST_BULLET$获得 #P +250#! [prestige|E]\n$EFFECT_LIST_BULLET$获得 #P +150#! [piety|E]\n$EFFECT_LIST_BULLET$因极致整备额外获得 #P +350#! [prestige|E] 与 #P +50#! [dynasty_prestige|E]"
 rol_quest_rome.1090.desc.success_3:0 "你以稳健而强势的节奏完成了远征。虽有险阻，但整体掌控良好，足以令追随者心悦诚服。"
 rol_quest_rome.1090.desc.success_2:0 "你在多次风险中维持住了局面。纵有损耗，这趟远征仍可被称作一次成功。"
 rol_quest_rome.1090.desc.success_1:0 "你以沉重代价完成了目标。伤亡与疲惫并存，但最终结果证明了坚持的价值。"
 rol_quest_rome.1090.desc.failure:0 "这次远征以失败告终。队伍需要休整、补员与重建士气；两年内，不宜再次强闯地宫。"
 rol_quest_rome.1090.desc.fallback:0 "远征暂告一段落。无论成败，你都已在传说边缘留下自己的足迹。"
 rol_quest_rome.1090.a:0 "记录此次远征。"

 activity_rol_seek_mars_blade:0 "玛尔斯地宫远征"
 activity_rol_seek_mars_blade_desc:0 "你将组织一次深入罗马地底禁区的远征，追索封缄战仪、坍塌甬道与黑暗中仍未沉寂的回响。"
 activity_rol_seek_mars_blade_host_desc:0 "$BULLET_WITH_TAB$可通过$rol_option_expedition_preparation$活动选项调整整备档位\n$BULLET_WITH_TAB$失败会立刻终止远征并进入2年冷却"
 activity_rol_seek_mars_blade_guest_desc:0 ""
 activity_rol_seek_mars_blade_conclusion_desc:0 "石门在你身后再度闭合，而地底深处留下的回响，将继续在后世传闻中发酵。"
 activity_rol_seek_mars_blade_conclusion_desc_success_4:0 "你几乎以完美姿态完成远征，整支队伍如同一台精密战械。"
 activity_rol_seek_mars_blade_conclusion_desc_success_3:0 "你稳健掌控全局，成功将地宫威胁化解于可控范围。"
 activity_rol_seek_mars_blade_conclusion_desc_success_2:0 "远征过程跌宕起伏，但你最终顶住压力，达成目标。"
 activity_rol_seek_mars_blade_conclusion_desc_success_1:0 "你付出不小代价才走到终点，但结果仍属于你。"
 activity_rol_seek_mars_blade_conclusion_desc_failure:0 "远征失败，并进入2年冷却。"
 activity_rol_seek_mars_blade_conclusion_desc_fallback:0 "远征结束。你已从地宫全身而退，下一次挑战仍在前方。"
 activity_rol_seek_mars_blade_selection_tooltip:0 "组织一支纪律严明的队伍，深入罗马埋没的战神圣所，穿过古誓、断廊与沉默守望者仍未离去的黑暗。\n\n失败会立刻终止远征并进入2年冷却。"
 activity_rol_seek_mars_blade_predicted_cost:0 "本次远征的总花费，将高度取决于你选择的人手与装备档位。"
 activity_rol_seek_mars_blade_province_desc:0 "远征目标位于[ROOT.Province.GetName]"

 activity_rol_seek_mars_blade_special_type_title:0 "远征成功度"
 activity_rol_seek_mars_blade_special_type_desc:0 "你在地宫中的抉择，将决定埋藏战仪愿意回应你到何种程度。唯有最深层的共鸣，才会换来终局的真正答复。"
 ROL_MARS_WINDOW_SPECIAL_PROGRESS_TOOLTIP:0 "当前远征成功度：[ActivityWindow.GetSpecialProgressValue|0^V]"

 activity_rol_seek_mars_blade_special_type_bar_segment_tt_0:0 "#T 危机四伏#!\n队伍状态糟糕，任何失误都可能导致远征崩溃。"
 activity_rol_seek_mars_blade_special_type_bar_segment_tt_1:0 "#T 勉力维持#!\n虽然损失不小，但探索仍在推进。"
 activity_rol_seek_mars_blade_special_type_bar_segment_tt_2:0 "#T 局势稳住#!\n你逐步夺回节奏，胜算正在提高。"
 activity_rol_seek_mars_blade_special_type_bar_segment_tt_3:0 "#T 优势成形#!\n关键抉择基本正确，远征正走向主动。"
 activity_rol_seek_mars_blade_special_type_bar_segment_tt_4:0 "#T 临界回响#!\n地宫即将作出决定性的回应。"

 activity_rol_seek_mars_blade_special_type_bar_segment_0_tt:0 "$activity_rol_seek_mars_blade_special_type_bar_segment_tt_0$"
