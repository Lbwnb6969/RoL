 activity_rol_seek_mars_blade_special_type_bar_segment_2_tt:0 "$activity_rol_seek_mars_blade_special_type_bar_segment_tt_2$"
 activity_rol_seek_mars_blade_special_type_bar_segment_3_tt:0 "$activity_rol_seek_mars_blade_special_type_bar_segment_tt_3$"
 activity_rol_seek_mars_blade_special_type_bar_segment_4_tt:0 "$activity_rol_seek_mars_blade_special_type_bar_segment_tt_4$"

 phase_rol_mars_descent_phase:0 "地宫探查"
 phase_rol_mars_descent_phase_desc:0 "你的队伍已进入帕拉蒂尼山地宫，危险与荣耀并存。"
 rol_mars_descent_phase:0 "$phase_rol_mars_descent_phase$"
 rol_mars_descent_phase_desc:0 "$phase_rol_mars_descent_phase_desc$"
 rol_seek_mars_blade_cost_desc:0 "远征人手、装备与仪式整备"
 rol_mars_quest_on_cooldown_tt:0 "你最近的远征失败了，必须等待2年后才能再次发起。"
 rol_mars_quest_cooldown_modifier:0 "玛尔斯远征冷却"
 rol_mars_quest_cooldown_modifier_desc:0 "上一次地宫远征以失败告终。部队需要休整，短期内无法再次组织同等规模的探索。"
