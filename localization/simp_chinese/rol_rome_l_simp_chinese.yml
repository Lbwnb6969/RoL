 phase_rol_mars_descent_phase:0 "地宫探查"
 phase_rol_mars_descent_phase_desc:0 "你的队伍已进入帕拉蒂尼山地宫，危险与荣耀并存。"
 rol_mars_descent_phase:0 "$phase_rol_mars_descent_phase$"
 rol_mars_descent_phase_desc:0 "$phase_rol_mars_descent_phase_desc$"

 rol_seek_mars_blade_cost_desc:0 "远征筹备费用"
 rol_mars_quest_on_cooldown_tt:0 "你最近的远征失败了，必须等待2年后才能再次发起。"
 rol_mars_quest_cooldown_modifier:0 "玛尔斯远征冷却"
 rol_mars_quest_cooldown_modifier_desc:0 "上一次地宫远征以失败告终。部队需要休整，短期内无法再次组织同等规模的探索。"
 TRAVEL_NAME_FOR_activity_rol_seek_mars_blade:0 "[Character.GetFirstNameNoTooltip]的玛尔斯远征"

 rol_relic_hunt_intent:0 "夺取神兵"
 rol_relic_hunt_intent_desc:0 "你的唯一目标是追索并夺得传说神兵，哪怕要以鲜血开路。"
 rol_mars_intent:0 "$rol_relic_hunt_intent$"
 rol_mars_intent_desc:0 "$rol_relic_hunt_intent_desc$"

 rol_relic_activity_start_log:0 "[CHARACTER.GetShortUIName|U]率队进入地宫，远征正式开始。"
 rol_relic_activity_stage_log:0 "[CHARACTER.GetShortUIName|U]在地宫中推进了一段关键路程。"
 rol_relic_activity_success_log:0 "[CHARACTER.GetShortUIName|U]完成远征并取得传说遗物。"
 rol_relic_activity_failure_log:0 "[CHARACTER.GetShortUIName|U]的远征失败，被迫撤离地宫。"
