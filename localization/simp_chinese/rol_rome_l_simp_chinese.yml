l_simp_chinese:
 rol_blade_of_mars:0 "战神玛尔斯之剑"
 rol_blade_of_mars_desc:0 "据说此剑曾由战神玛尔斯亲手执握。剑锋映着暗红血辉，仿佛仍在渴求战场上的怒吼与献祭。"
 artifact_rol_blade_of_mars:0 "战神玛尔斯之剑"
 artifact_rol_blade_of_mars_desc:0 "这柄古剑在黑暗中泛着嗜血红辉，仿佛仍在回应战神玛尔斯的召唤。"

 rol_trigger.1000.t:0 "尘封的战神印记"
 rol_trigger.1000.desc:0 "在罗马城的翻修工程中，工匠们凿开了一处坍塌地层，发现一条刻满古拉丁战纹的地下甬道。石门中央，赫然是一枚象征玛尔斯的神印。"
 rol_trigger.1000.a:0 "命人封锁入口，我亲自查验。"

 rol_seek_mars_blade_decision:0 "探寻玛尔斯之剑"
 rol_seek_mars_blade_decision_desc:0 "召集最悍勇的死士，深入帕拉蒂尼山下的古老陵道，追索那柄沉睡于血誓中的神兵。"
 rol_seek_mars_blade_decision_tooltip:0 "你将花费 @gold_icon!300 发起探险。"

 rol_quest_rome.1000.t:0 "深入帕拉蒂尼地宫"
 rol_quest_rome.1000.desc:0 "火把的光在潮湿石壁上摇曳。前方既有古罗马禁卫军的残影徘徊，也有仍在运作的致命机关潜伏于暗处。再向前一步，便无回头之路。"
 rol_quest_rome.1000.a:0 "拔剑硬闯！"
 rol_quest_rome.1000.b:0 "解读铭文，破解机关。"
 rol_quest_rome.1000.c:0 "此行凶险，先行撤退。"
 rol_quest_rome.1000.a.tt:0 "你将尝试以武力突围：有概率负伤并损失威望。"
 rol_quest_rome.1000.b.tt:0 "你以学识破解机关并继续前进。"
 rol_quest_rome.1000.c.tt:0 "本次远征失败，进入2年冷却。"

 rol_quest_rome.1001.t:0 "玛尔斯的赐福"
 rol_quest_rome.1001.desc:0 "伴随低沉轰鸣，封印祭坛缓缓开启。你握住那柄古剑的瞬间，猩红光辉沿剑脊奔涌，宛如远古战鼓再度震响——玛尔斯之剑，已认你为主。"
 rol_quest_rome.1001.a:0 "让诸神见证我的征服。"

 rol_quest_rome.1002.t:0 "落石回廊"
 rol_quest_rome.1002.desc:0 "地宫深处的石梁突然开裂，轰鸣声自头顶压下。巨石如雨坠落，通道即将被彻底吞没。"
 rol_quest_rome.1002.a:0 "顶着碎石强行突进。"
 rol_quest_rome.1002.b:0 "撤回地表，保存实力。"
 rol_quest_rome.1002.a.tt:0 "你将穿越落石区并继续推进。"
 rol_quest_rome.1002.b.tt:0 "你选择撤退：本次远征失败，进入2年冷却。"

 rol_quest_rome.1003.t:0 "血誓祭坛"
 rol_quest_rome.1003.desc:0 "你来到一座刻满军团誓言的祭坛。暗红符文像活物般游动，仿佛在审视每一个闯入者的心志。"
 rol_quest_rome.1003.a:0 "诵读古文，破除誓锁。"
 rol_quest_rome.1003.b:0 "强忍不适，硬闯过去。"
 rol_quest_rome.1003.a.tt:0 "若解读成功，你将稳定队伍并继续推进。"
 rol_quest_rome.1003.b.tt:0 "你强行通过，承受压力但继续前进。"

 rol_quest_rome.1004.t:0 "禁卫残影"
 rol_quest_rome.1004.desc:0 "长廊尽头，披甲残影列阵而立。它们无声举盾，战戟齐鸣，像一支永不溃散的古罗马禁卫军。"
 rol_quest_rome.1004.a:0 "正面冲垮他们！"
 rol_quest_rome.1004.b:0 "此处不宜久留，后撤。"
 rol_quest_rome.1004.a.tt:0 "若强攻失败，本次远征将失败并进入2年冷却。"
 rol_quest_rome.1004.b.tt:0 "你选择撤退：本次远征失败，进入2年冷却。"

 activity_rol_seek_mars_blade:0 "玛尔斯地宫远征"
 activity_rol_seek_mars_blade_desc:0 "你将组织一次高风险探险，前往罗马帕拉蒂尼山下的禁忌地宫，追索战神遗留的神兵。"
 activity_rol_seek_mars_blade_host_desc:0 "$BULLET_WITH_TAB$可能获得传说神器：$rol_blade_of_mars$\n$BULLET_WITH_TAB$失败时可能受伤并损失[prestige_i][prestige|E]"
 activity_rol_seek_mars_blade_guest_desc:0 ""
 activity_rol_seek_mars_blade_conclusion_desc:0 "尘封的石门在你身后合拢。无论胜败，这场深入古罗马阴影的远征都将被后世铭记。"
 activity_rol_seek_mars_blade_selection_tooltip:0 "组织远征队，深入罗马地宫，挑战守护者与古代机关。\n\n预期奖励：\n$activity_rol_seek_mars_blade_host_desc$"
 activity_rol_seek_mars_blade_predicted_cost:0 "此次远征需要准备人手、补给与仪式费用。"
 activity_rol_seek_mars_blade_province_desc:0 "远征目标位于[ROOT.Province.GetName]"

 phase_rol_mars_descent_phase:0 "地宫探查"
 phase_rol_mars_descent_phase_desc:0 "你的队伍已进入帕拉蒂尼山地宫，危险与荣耀并存。"

 rol_seek_mars_blade_cost_desc:0 "远征筹备费用"
 rol_mars_quest_on_cooldown_tt:0 "你最近的远征失败了，必须等待2年后才能再次发起。"
 rol_mars_quest_cooldown_modifier:0 "玛尔斯远征冷却"
 rol_mars_quest_cooldown_modifier_desc:0 "上一次地宫远征以失败告终。部队需要休整，短期内无法再次组织同等规模的探索。"
 TRAVEL_NAME_FOR_activity_rol_seek_mars_blade:0 "[Character.GetFirstNameNoTooltip]的玛尔斯远征"

 rol_relic_hunt_intent:0 "夺取神兵"
 rol_relic_hunt_intent_desc:0 "你的唯一目标是追索并夺得传说神兵，哪怕要以鲜血开路。"

 rol_mars_intent:0 "$rol_relic_hunt_intent$"
 rol_mars_intent_desc:0 "$rol_relic_hunt_intent_desc$"