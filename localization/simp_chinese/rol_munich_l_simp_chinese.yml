 activity_rol_seek_nibelung_sphere_special_type_bar_segment_3_tt:0 "$activity_rol_seek_nibelung_sphere_special_type_bar_segment_tt_3$"
 activity_rol_seek_nibelung_sphere_special_type_bar_segment_4_tt:0 "$activity_rol_seek_nibelung_sphere_special_type_bar_segment_tt_4$"

 phase_rol_nibelung_descent_phase:0 "地心下探"
 phase_rol_nibelung_descent_phase_desc:0 "你正深入巴伐利亚地底，向传说中的冰封圣所前进。"
 rol_nibelung_descent_phase:0 "$phase_rol_nibelung_descent_phase$"
 rol_nibelung_descent_phase_desc:0 "$phase_rol_nibelung_descent_phase_desc$"

 rol_seek_nibelung_sphere_cost_desc:0 "破冰与远征筹备费用"
 rol_nibelung_quest_on_cooldown_tt:0 "上一次星界远征失败了，你必须等待2年后再尝试。"
 rol_nibelung_quest_cooldown_modifier:0 "星界远征冷却"
 rol_nibelung_quest_cooldown_modifier_desc:0 "地底圣所的失败探索重创了队伍。短期内无法再次发起同等规模远征。"
