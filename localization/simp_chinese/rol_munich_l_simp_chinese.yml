l_simp_chinese:
 rol_nibelung_star_sphere:0 "尼伯龙根星界球"
 rol_nibelung_star_sphere_desc:0 "传说这件礼器由陨星之心雕琢而成，内部封着缓慢旋转的微型星河。寒意与真知同驻其中，凡人仅能窥见它意志的一角。"
 artifact_rol_nibelung_star_sphere:0 "尼伯龙根星界球"
 artifact_rol_nibelung_star_sphere_desc:0 "它在掌心上方静静自转，仿佛一颗被驯服的夜空。每一次闪烁，都像远古星海在低语。"

 rol_quest_munich.1000.t:0 "踏入极寒"
 rol_quest_munich.1000.desc:0 "矿坑深处的寒风几乎割裂肺腑。火把照见通道尽头一扇巨大的绝对冰川之门，冰层之内星辰符文缓缓流动，像活着的天穹。"
 rol_quest_munich.1000.a:0 "按星图推演，解开冰门。"
 rol_quest_munich.1000.b:0 "架锤灌铁，强行破门。"
 rol_quest_munich.1000.c:0 "撤回地表，保全队伍。"
 rol_quest_munich.1000.a.base_tt:0 "[learning|E]检定：以学识解读星辰符文，成功率受学识影响。"
 rol_quest_munich.1000.a.odds_high_tt:0 "当前判定：成功率 #P 70%#!，失败率 #N 30%#!。"
 rol_quest_munich.1000.a.odds_low_tt:0 "当前判定：成功率 #P 45%#!，失败率 #N 55%#!。"
 rol_quest_munich.1000.b.base_tt:0 "[martial|E]/[prowess|E]检定：以蛮力凿开冰门，成功率受军事或勇武影响。"
 rol_quest_munich.1000.b.odds_high_tt:0 "当前判定：成功率 #P 55%#!，失败率 #N 45%#!。"
 rol_quest_munich.1000.b.odds_low_tt:0 "当前判定：成功率 #P 35%#!，失败率 #N 65%#!。"
 rol_quest_munich.1000.c.tt:0 "你终止本次远征：进入2年冷却。"

 rol_quest_munich.1002.t:0 "心灵深渊"
 rol_quest_munich.1002.desc:0 "穿过冰门后，一座地底大空洞在你面前展开。穹顶水晶映照着不可名状的光。队伍开始出现幻觉：逝者怒吼、深渊凝视、群星倒转。"
 rol_quest_munich.1002.a:0 "以威严稳住军心。"
 rol_quest_munich.1002.b:0 "以祈祷平息波动。"
 rol_quest_munich.1002.c:0 "精神侵蚀太重，立即撤退。"
 rol_quest_munich.1002.a.base_tt:0 "[diplomacy|E]检定：以领袖意志压住恐慌。"
 rol_quest_munich.1002.a.odds_high_tt:0 "当前判定：成功率 #P 65%#!，失败率 #N 35%#!。"
 rol_quest_munich.1002.a.odds_low_tt:0 "当前判定：成功率 #P 40%#!，失败率 #N 60%#!。"
 rol_quest_munich.1002.b.base_tt:0 "[piety_level|E]检定：虔诚越高，越能抚平星辰噪鸣。"
 rol_quest_munich.1002.b.odds_high_tt:0 "当前判定：成功率 #P 75%#!，失败率 #N 25%#!。"
 rol_quest_munich.1002.b.odds_low_tt:0 "当前判定：成功率 #P 45%#!，失败率 #N 55%#!。"
 rol_quest_munich.1002.c.tt:0 "你终止本次远征：进入2年冷却。"

 rol_quest_munich.1001.t:0 "星辰陨心"
 rol_quest_munich.1001.desc:0 "陨铁祭坛悬浮于绝对宁静的地下冰湖上方。星界球在其中自转，内部银河缓缓流动。你伸手触碰它时，整座地宫像在屏息等待回应。"
 rol_quest_munich.1001.desc.tier_1:0 "球体在你手中光芒黯淡，星河几乎停滞。你带走了它，却也感受到它对你粗粝手段的沉默叹息。"
 rol_quest_munich.1001.desc.tier_2:0 "星光在球体深处若隐若现。它接纳了你，向你展示了零散却珍贵的失落真知。"
 rol_quest_munich.1001.desc.tier_3:0 "球体悬浮于掌心之上，极光般的色彩淹没地底。你听见的不是声音，而是一整片星海的脉搏。"
 rol_quest_munich.1001.desc.tier_4:0 "宇宙与灵魂在此刻共鸣。一束纯净星光刺穿地层直上慕尼黑夜空，万民仰望异象，而你如半神般走出地宫。"
 rol_quest_munich.1001.a:0 "让群星见证我的统治。"
 rol_quest_munich.1001.a.tt:0 "你获得礼器[artifact|E]：$rol_nibelung_star_sphere$。成功度越高，结算奖励越丰厚。"

 rol_quest_munich.1090.t:0 "星界远征结算"
 rol_quest_munich.1090.desc.success_4:0 "这是一场近乎神话的完美远征。你不仅夺得圣物，还让整个巴伐利亚见证了违反常理的天象。"
 rol_quest_munich.1090.desc.success_3:0 "你以卓越判断穿越了冰封与幻象，星界球承认了你的资格。"
 rol_quest_munich.1090.desc.success_2:0 "尽管过程凶险，你仍稳住了局势，成功带回古老礼器。"
 rol_quest_munich.1090.desc.success_1:0 "你勉强完成了远征。代价沉重，但圣物终究归于你手。"
 rol_quest_munich.1090.desc.failure:0 "远征失败。心智与人手都需重整，两年内不宜再次踏入那片地底极寒。"
 rol_quest_munich.1090.desc.fallback:0 "远征告一段落。星辰之门仍在地底沉默，等待下一次召唤。"
 rol_quest_munich.1090.a:0 "将此役记入编年史。"

 activity_rol_seek_nibelung_sphere:0 "尼伯龙根星界远征"
 activity_rol_seek_nibelung_sphere_desc:0 "你将深入慕尼黑地底冰封圣所，追寻尼伯龙根遗留的星界礼器。"
 activity_rol_seek_nibelung_sphere_host_desc:0 "$BULLET_WITH_TAB$可能获得传说礼器：$rol_nibelung_star_sphere$\n$BULLET_WITH_TAB$失败时可能受伤、增压并损失威望"
 activity_rol_seek_nibelung_sphere_guest_desc:0 ""
 activity_rol_seek_nibelung_sphere_conclusion_desc:0 "暴雪掩埋了入口，但你已触碰过地心深处的星海。"
 activity_rol_seek_nibelung_sphere_conclusion_desc_success_4:0 "你与圣物达成宇宙共鸣，传说在你身上成真。"
 activity_rol_seek_nibelung_sphere_conclusion_desc_success_3:0 "星界球以璀璨银河回应你的意志。"
 activity_rol_seek_nibelung_sphere_conclusion_desc_success_2:0 "你稳定推进并收获星光隐现的回应。"
 activity_rol_seek_nibelung_sphere_conclusion_desc_success_1:0 "你艰难通关，带回了一件沉默而强大的古物。"
 activity_rol_seek_nibelung_sphere_conclusion_desc_failure:0 "你被迫撤回。远征队需休整两年，方可再探。"
 activity_rol_seek_nibelung_sphere_conclusion_desc_fallback:0 "这场深入地心的远征已经结束。"
 activity_rol_seek_nibelung_sphere_selection_tooltip:0 "沿矿坑下探，穿过冰封之门与心灵幻象，挑战尼伯龙根圣所。\n\n预期奖励：\n$activity_rol_seek_nibelung_sphere_host_desc$"
 activity_rol_seek_nibelung_sphere_predicted_cost:0 "本次远征需要高额补给、破冰器械与护卫薪酬。"
 activity_rol_seek_nibelung_sphere_province_desc:0 "远征目标位于[ROOT.Province.GetName]"

 activity_rol_seek_nibelung_sphere_special_type_title:0 "星界共鸣度"
 activity_rol_seek_nibelung_sphere_special_type_desc:0 "你在冰门、幻象与终局祭坛中的抉择，会决定星界球最终如何回应你。"
 ROL_NIBELUNG_WINDOW_SPECIAL_PROGRESS_TOOLTIP:0 "当前星界共鸣度：[ActivityWindow.GetSpecialProgressValue|0^V]"

 activity_rol_seek_nibelung_sphere_special_type_bar_segment_tt_0:0 "#T 寒寂拒绝#!\n圣所对你极度排斥，终局回响将十分微弱。"
 activity_rol_seek_nibelung_sphere_special_type_bar_segment_tt_1:0 "#T 勉强维持#!\n队伍尚未崩溃，但离真正共鸣仍很遥远。"
 activity_rol_seek_nibelung_sphere_special_type_bar_segment_tt_2:0 "#T 星光隐现#!\n你逐步读懂圣所节奏，星界球开始回应。"
 activity_rol_seek_nibelung_sphere_special_type_bar_segment_tt_3:0 "#T 银河苏醒#!\n你的抉择接近完美，终局可能迎来神迹。"
 activity_rol_seek_nibelung_sphere_special_type_bar_segment_tt_4:0 "#T 宇宙共鸣#!\n只差最后一步，群星将与你同频。"
 activity_rol_seek_nibelung_sphere_special_type_bar_segment_0_tt:0 "$activity_rol_seek_nibelung_sphere_special_type_bar_segment_tt_0$"
