l_simp_chinese:
 rol_expedition_companion.0001.t:0 "启程前的约定"
 rol_expedition_companion.0001.desc:0 "队伍里各有所长。在面对第一道难关前，我可以请一位实际到场的专家承担明确职责。即使没能带回圣物，这份约定也会跟着我们归来。\n\n曾充分履约的老搭档，在到场且胜任时会优先成为候选。我们也可以不作新的承诺，按原有路线推进。"
 rol_expedition_companion.0001.a:0 "请[rol_expedition_candidate_scholar.GetTitledFirstName]考察证据。"
 rol_expedition_companion.0001.a.flavor:0 "知识旁边，也该留下研究者的名字。"
 rol_expedition_companion.0001.b:0 "请[rol_expedition_candidate_guard.GetTitledFirstName]保障通行。"
 rol_expedition_companion.0001.b.flavor:0 "无论找到什么，总得有人把大家带回去。"
 rol_expedition_companion.0001.c:0 "请[rol_expedition_candidate_envoy.GetTitledFirstName]代表队伍交涉。"
 rol_expedition_companion.0001.c.flavor:0 "一个能说服人的声音，或许能省下一场争斗。"
 rol_expedition_companion.0001.d:0 "不必订约，我们自己应付。"
 rol_expedition_companion.0001.d.flavor:0 "原有远征路线依然可用。"
 rol_expedition_companion_scholar_terms_tt:0 "[rol_expedition_candidate_scholar.GetTitledFirstName]活着且实际同行时，远征二元检定成功率提高#V [rol_expedition_candidate_scholar.MakeScope.ScriptValue('rol_expedition_scholar_personal_bonus_value')|0]个百分点#!。普通学者提供3个百分点；其本人有探寻者特质且考据达到60经验时提供5个百分点。读取学者本人的经验，仍封顶95%，显示概率同步计算。承诺归来时共享研究声誉，花费50威望。"
 rol_expedition_companion_guard_terms_tt:0 "这位护卫活着且实际同行时，解锁一次花费75金币的确定成功开局路线。另承诺归来时支付50金币。仅跳过第一道检定，其余阶段和Tier4门槛仍需完成。"
 rol_expedition_companion_envoy_terms_tt:0 "这位交涉者活着且实际同行时，解锁一次和平解决竞争者争执的选项，改善远征进度并减少10压力。承诺归来时公开认可其贡献，花费75威望。竞争者不保证出现。"
 rol_expedition_guard_route_option:0 "让护卫准备一条稳妥的通路。"
 rol_expedition_guard_route_flavor:0 "合用的装备与耐心的准备，能代替一次冒险。"
 rol_expedition_guard_route_tt:0 "花费75金币，使第一道难关取得确定的高档成功。签约护卫必须仍实际同行，只能使用一次；归来后的约定报酬另算。"
 rol_expedition_expert_route_option:0 "照着以往远征积累的方法，稳步解决难关。"
 rol_expedition_expert_route_flavor:0 "看清障碍，安排工序，尽量少把结果交给运气。"
 rol_expedition_expert_route_tt:0 "遗物探寻者任一轨道达到60经验后，花费100金币，使第一道难关取得确定的高档成功。不需要同行专家，与护卫路线共享一次使用限额。"
 rol_rival.1000.d:0 "让我们的交涉者安排一次和平交换。"
 rol_rival.1000.d.flavor:0 "我们需要达成协议，不需要多一个仇敌。"
 rol_expedition_companion_mediation_tt:0 "签约交涉者化解这次争执，无需决斗或赝品检定，改善远征进度并减少10压力。每次远征一次，交涉者必须仍活着且实际同行。"
 rol_expedition_companion.0002.t:0 "旅途未了的承诺"
 rol_expedition_companion.0002.desc.scholar:0 "笔记重新铺上桌面。[rol_expedition_companion.GetTitledFirstName]提醒我，研究应按约定共同署名。无论远征是凯旋还是失望收场，辛劳都并非我一人承担。\n\n充分履约将花费50威望。"
 rol_expedition_companion.0002.desc.guard:0 "[rol_expedition_companion.GetTitledFirstName]曾替队伍承担保障通行的职责。我们约好了远征结束后支付50金币。这份报酬买的是服务，并非每段传说都必然成真的保证。"
 rol_expedition_companion.0002.desc.envoy:0 "[rol_expedition_companion.GetTitledFirstName]请求我按约定公开认可其贡献。在讲述旅途时，也应提到曾代表队伍交涉的人。\n\n充分履约将花费75威望。"
 rol_expedition_companion.0002.desc.absent:0 "约定中的同行者已经离世，或无法再作为有效人物参与结算。我不能悄悄换个人领取这份承诺。可以关闭记录，不支付报酬，也不获得经验奖励。"
 rol_expedition_companion.0002.a:0 "充分兑现约定。"
 rol_expedition_companion.0002.a.flavor:0 "守信，才能让下一次同行成为可能。"
 rol_expedition_companion.0002.b:0 "商量一份较小的补偿。"
 rol_expedition_companion.0002.b.flavor:0 "可以体面告别，但不能把新安排当作原约已履行。"
 rol_expedition_companion.0002.c:0 "我不会履行这份约定。"
 rol_expedition_companion.0002.c.flavor:0 "昔日的伙伴会记住这一选择。"
 rol_expedition_companion.0002.d:0 "先把记录留着。"
 rol_expedition_companion.0002.d.flavor:0 "之后可以通过决策重新处理。"
 rol_expedition_companion.0002.e:0 "关闭这份已无法结清的记录。"
 rol_expedition_companion.0002.e.flavor:0 "不会换人领取，也不会凭空获得奖励。"
 rol_expedition_companion_honour_tt:0 "按约定支付50金币给护卫，或共享50威望给学者／75威望给交涉者。双方获得五年+25好感，并获得三年守信声誉。若远征至少完成过一个阶段，对应专长获得10经验。同一人物成为老搭档，下次到场且胜任时优先进入候选。"
 rol_expedition_companion_compromise_tt:0 "支付25金币给原同行者，获得其尊重。若至少完成过一个阶段，对应专长获得5经验。不新增老搭档关系，也不获得守信声誉。"
 rol_expedition_companion_refuse_tt:0 "对方对你的好感降低20，获得三年失信声誉。如果此人是原有老搭档，该关系移除。诚实或公正者增加15压力。不获得专长经验。"
 rol_expedition_companion_defer_tt:0 "原约定继续待处理，没有奖励，也不追加自动催促。可通过决策重新结算；仍能进行远征，但在结清之前不会签约另一位专家。"
 rol_expedition_kept_word_modifier:0 "守信的探寻者"
 rol_expedition_kept_word_modifier_desc:0 "此人兑现了一份远征约定。声誉持续三年，重复获得只刷新，不叠加，并替换失信声誉。"
 rol_expedition_broken_word_modifier:0 "违背远征约定"
 rol_expedition_broken_word_modifier_desc:0 "此人拒绝履行一份远征约定。声誉持续三年，重复获得只刷新，不叠加，并替换守信声誉。"
 rol_expedition_fulfilled_pact_opinion:0 "兑现远征约定"
 rol_settle_expedition_pact_decision:0 "结清远征约定"
 rol_settle_expedition_pact_decision_desc:0 "重新处理对一位特定同行者作出的承诺。可以充分履约、协商补偿，或了结争议。"
 rol_settle_expedition_pact_decision_tooltip:0 "重开原约定，不重新选人，也不产生额外奖励。"
 rol_settle_expedition_pact_decision_confirm:0 "打开约定"

 rol_expedition_companion.0002.desc.closed:0 "这份约定已经有了答复，可以将旧记录收起。"
