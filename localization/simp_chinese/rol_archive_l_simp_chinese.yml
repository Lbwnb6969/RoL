l_simp_chinese:
 rol_star_observations_modifier:0 "星界球观测图"
 rol_star_observations_modifier_desc:0 "观测整理出的刻度与航海者的星盘传闻相互印证。十年内可在Sevilla远征开局花40金币使用，获得一次确定高档推进后消耗；与护卫/专长路线共用一次限额，没有被动属性加成。继承整理后的副本有效五年。"
 rol_ocean_routes_modifier:0 "爱琴海校准航路"
 rol_ocean_routes_modifier_desc:0 "星盘校准的海路指向Naxos。十年内可在Naxos远征开局花40金币使用，获得一次确定高档推进后消耗；与护卫/专长路线共用一次限额，没有被动属性加成。继承整理后的副本有效五年。"
 rol_archive_knowledge_title:0 "旧圣物，新线索"
 rol_archive_star_knowledge_desc:0 "星界球观测图已经整理完成。它可以帮助Sevilla的星盘远征，原有独立路线仍然可用。"
 rol_archive_ocean_knowledge_desc:0 "星盘的校准结果记入了爱琴海航路。它可以帮助Naxos远征，原有独立路线仍然可用。"
 rol_archive_sevilla_route_option:0 "用星界球的观测结果取得可靠的引路信息。"
 rol_archive_sevilla_route_flavor:0 "天上的刻度，也能让岸边的传闻找到方向。"
 rol_archive_sevilla_route_tt:0 "花40金币并消耗观测图，第一道难关取得确定高档成功。只适用于实际Sevilla活动，与护卫/专长开局共享一次限额；后续阶段和Tier4门槛仍须完成。"
 rol_archive_naxos_route_option:0 "循着校准航路，稳妥进入前厅。"
 rol_archive_naxos_route_flavor:0 "前人的笔记，终于在这一段海路上派上用场。"
 rol_archive_naxos_route_tt:0 "花40金币并消耗校准航路，第一道难关取得确定高档成功。只适用于实际Naxos活动，与护卫/专长开局共享一次限额；后续阶段和Tier4门槛仍须完成。"
 rol_archive.0001.t:0 "接续未写完的旅途"
 rol_archive.0001.desc:0 "前任留下了一批笔记与研究图表。几份档案可以一同整理，但纸上的线索不等于亲历者的本领。\n\n我可以花50威望召集人手，将现有档案整理为五年有效的副本。已有同类资料不会被较短的副本替换；前任的专长经验、完成纪录、圣物所有权和在途计划不会因此归我所有。"
 rol_archive.0001.a:0 "整理档案，让下一段旅途有据可循。"
 rol_archive.0001.b:0 "先保存，之后再读。"
 rol_archive.0001.c:0 "封存这些档案，我会另走一条路。"
 rol_archive_accept_tt:0 "花50威望，一次性接收尚未拥有的地区笔记、星界球观测图与校准航路，每份五年有效。已有同类资料保留，不刷新或缩短；不获得前任经验、圣物或完成flag。再次打开不重复收费或发资料。"
 rol_archive_defer_records_tt:0 "档案保持未读；之后可通过“整理继承的旅途档案”决策打开。不会获得加成，也不妨碍自己的远征。"
 rol_archive_discard_records_tt:0 "关闭待处理档案，不发资料或经验；自己的现有成果不受影响。继承约定通过另一个入口单独处理。"
 rol_archive.0002.t:0 "前任留下的约定"
 rol_archive.0002.desc:0 "[rol_archive_partner.GetTitledFirstName]曾为前任的远征承担职责。如今这份原约定来到了我面前。它不要求我凭空继承一个人的经历，却允许我选择是否接续那份承诺。\n\n承担后可以按原条款充分履约、重新协商、暂缓或拒绝；任何结算都不给前任的专长经验。"
 rol_archive.0002.desc.busy:0 "[rol_archive_partner.GetTitledFirstName]带来了前任留下的约定，但我已经有一份正在履行或尚未结清的个人约定。不能用新记录覆盖旧对象。我可以先保留它，也可以明确不予承担。"
 rol_archive.0002.desc.absent:0 "这份约定所指的原人物已离世或无法继续参与。应关闭对应记录，不替换收款人，也不凭空获得经验或声誉。其他档案与约定会保留。"
 rol_archive.0002.a:0 "我愿意接续这份约定。"
 rol_archive.0002.b:0 "这是前任的承诺，我不予承担。"
 rol_archive.0002.c:0 "先保存这份原约定。"
 rol_archive.0002.d:0 "关闭已经失效的约定。"
 rol_archive_adopt_tt:0 "将同一人物与原职责接入已有结算流程：学者50威望、护卫50金币、交涉者75威望，亦可按原流程协商或暂缓。不会覆盖现有个人约定，不继承经验。主动接续后履约可建立你自己的声誉和老搭档关系。"
 rol_archive_decline_pact_tt:0 "只移除这份待继承约定，不收费、不奖励，也不将前任的失信名声强加给你。已经主动承担的个人约定不受影响，其他待继承记录保留。"
 rol_archive_defer_pact_tt:0 "原人物与条款继续保存，不覆盖你自己的约定；以后用“查阅继承的远征约定”决策处理。自己的远征仍然可进行，没有即时奖励。"
 rol_review_inherited_records_decision:0 "整理继承的旅途档案"
 rol_review_inherited_records_decision_desc:0 "决定是否整理前任的笔记和研究图表。个人经验不随档案继承。"
 rol_review_inherited_records_decision_tooltip:0 "重开尚未阅读的档案。整理花50威望，资料有效五年。"
 rol_review_inherited_records_decision_confirm:0 "打开档案"
 rol_review_inherited_pacts_decision:0 "查阅继承的远征约定"
 rol_review_inherited_pacts_decision_desc:0 "逐份处理前任留下的约定，可以接续、保留或不予承担。"
 rol_review_inherited_pacts_decision_tooltip:0 "打开一份原人物记录，不覆盖个人约定，也不直接发奖励。"
 rol_review_inherited_pacts_decision_confirm:0 "查看原约定"
