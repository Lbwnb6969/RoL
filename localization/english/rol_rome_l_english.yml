l_english:

 rol_quest_rome.1000.a:0 "Force a path with steel!"
 rol_quest_rome.1000.b:0 "Read the inscriptions and break the mechanism."
 rol_quest_rome.1000.c:0 "This is too dangerous. Withdraw."
 rol_quest_rome.1001.a:0 "Let the gods witness my conquest."
 rol_quest_rome.1002.a:0 "Push through the falling stone."
 rol_quest_rome.1002.b:0 "Return to the surface and preserve the force."
 rol_quest_rome.1003.a:0 "Recite the old vows and unbind the seal."
 rol_quest_rome.1003.b:0 "Cross the altar by force."
 rol_quest_rome.1004.a:0 "Break them head-on!"
 rol_quest_rome.1004.b:0 "Fall back while we still can."
 rol_quest_rome.1010.t:0 "Breakthrough Achieved"
 rol_quest_rome.1010.desc:0 "You seize the rhythm of the catacomb and drag the formation back into order. The road ahead is still murderous, but the initiative is yours again."
 rol_quest_rome.1010.a:0 "Advance."
 rol_quest_rome.1011.t:0 "The Breach Falters"
 rol_quest_rome.1011.desc:0 "Blood runs over the stone steps. The first trial has already exacted its price, and to keep forcing the issue would invite an even worse collapse."
 rol_quest_rome.1011.a:0 "Assess the party and the evidence first."
 rol_quest_rome.1012.t:0 "Ordered Withdrawal"
 rol_quest_rome.1012.desc:0 "You call the retreat, and torchlight dwindles one by one in the dark. This descent ends here."
 rol_quest_rome.1012.a:0 "We wait for another chance."
 rol_quest_rome.1020.t:0 "Corridor Broken"
 rol_quest_rome.1020.desc:0 "You find a path through falling stone. Bruised and breathless, the party still holds formation, and the deeper gate opens once more."
 rol_quest_rome.1020.a:0 "Advance."
 rol_quest_rome.1021.t:0 "Corridor Collapse"
 rol_quest_rome.1021.desc:0 "The crash of stone shatters formation and nerve alike. To go on would only bury more of your people in the dark."
 rol_quest_rome.1021.a:0 "Assess the party and the evidence first."
 rol_quest_rome.1022.t:0 "Withdraw from the Corridor"
 rol_quest_rome.1022.desc:0 "You order a fighting withdrawal. Behind you, the passage seals in thunder, and this attempt ends beneath the rubble."
 rol_quest_rome.1022.a:0 "Save who we can."
 rol_quest_rome.1030.t:0 "Altar Suppressed"
 rol_quest_rome.1030.desc:0 "The furious runes sink back into silence. You smother the altar's backlash and keep the expedition moving toward the core."
 rol_quest_rome.1030.a:0 "To the core."
 rol_quest_rome.1031.t:0 "Oath Backlash"
 rol_quest_rome.1031.desc:0 "The vow-script turns into a crushing pressure on the mind and tears the formation open from within. You are forced to admit that this trial is lost."
 rol_quest_rome.1031.a:0 "Assess the party and the evidence first."
 rol_quest_rome.1040.t:0 "The Shades Scatter"
 rol_quest_rome.1040.desc:0 "The last spectral line breaks before you. The core altar is only a few steps away, and the threshold to victory lies open."
 rol_quest_rome.1040.a:0 "Face the end."
 rol_quest_rome.1041.t:0 "The Line Breaks"
 rol_quest_rome.1041.desc:0 "The ghostly formation surges back and the expedition falls into disorder. All you can do now is save those still able to retreat."
 rol_quest_rome.1041.a:0 "Assess the party and the evidence first."
 rol_quest_rome.1042.t:0 "Retreat at the Final Gate"
 rol_quest_rome.1042.desc:0 "You stop at the very mouth of the core chamber. The legend still waits beyond, but this expedition has no strength left to claim it."
 rol_quest_rome.1042.a:0 "Preserve our strength."
