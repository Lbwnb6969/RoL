l_english:
 rol_relic_use_commission_option:0 "Ask [rol_relic_use_commission_candidate.GetTitledFirstName] to lead the observations."
 rol_relic_use_commission_flavor:0 "We have trusted each other's judgement on the road. This time, I can leave the nightly records in familiar hands."
 rol_relic_use_commission_terms_tt:0 "Pay the usual 50 gold to begin a six-month observation project with this original companion: an adult, able court member with at least 12 learning and a non-negative opinion of you. Retain the sphere's observation purpose and the one-year project interval. At the end, pay this person 50 gold and give them 10 research experience to keep ten-year observations and mutual +10 opinion for five years; or grant them 100 prestige and mutual +25 opinion for five years instead. You gain no personal expertise or publication prestige. Death or departure closes the project without payment, results or a refund."
 rol_relic_use_commission_result_desc:0 "The familiar hand in these records belongs to [ROOT.Char.MakeScope.Var('rol_relic_use_commission_partner').Char.GetFirstName]. My companion has spent six months comparing the sphere's markings with the night sky. I can pay for the observations and keep them for future expeditions, or publish the work under its author's name. This is their work; it does not become my personal expertise."
 rol_relic_use_commission_invalid_desc:0 "The commission can no longer be completed: the original observer is unavailable or has left my court, or the sphere no longer supports the recorded work. I cannot replace the observer or relic in this record. Closing it grants no results or payment and does not refund the initial cost."
 rol_relic_use_commission_pay_option:0 "Pay my companion 50 gold for the observations."
 rol_relic_use_commission_pay_flavor:0 "Their careful work will guide our next journey."
 rol_relic_use_commission_pay_tt:0 "Pay 50 gold to the original observer, who gains 10 research experience and the seeker trait if needed. Gain ten-year star observations and reveal the Sevilla expedition. Both of you gain +10 opinion for five years. You gain no expertise experience or prestige. Settle this project once; retain the sphere's purpose."
 rol_relic_use_commission_credit_option:0 "Publish the observations under my companion's name."
 rol_relic_use_commission_credit_flavor:0 "The court should know who kept watch through those long nights."
 rol_relic_use_commission_credit_tt:0 "The original observer gains 100 prestige. Both of you gain +25 opinion for five years. You gain no observations, expertise experience or prestige. Settle this project once; retain the sphere's purpose."
