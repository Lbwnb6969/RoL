l_english:
 rol_expedition_companion.0001.t:0 "A Promise Before the Descent"
 rol_expedition_companion.0001.desc:0 "Our company has more than one kind of expertise. Before the first obstacle, I can ask an attending specialist to take a defined responsibility. The agreement will follow us home, even if the relic does not.\n\nA trusted former partner is preferred when present and qualified. I may also proceed without making another promise."
 rol_expedition_companion.0001.a:0 "Ask [rol_expedition_candidate_scholar.GetTitledFirstName] to examine the evidence."
 rol_expedition_companion.0001.a.flavor:0 "Knowledge deserves a name beside it."
 rol_expedition_companion.0001.b:0 "Ask [rol_expedition_candidate_guard.GetTitledFirstName] to secure our passage."
 rol_expedition_companion.0001.b.flavor:0 "Someone must bring us back, whatever we find."
 rol_expedition_companion.0001.c:0 "Ask [rol_expedition_candidate_envoy.GetTitledFirstName] to speak for the company."
 rol_expedition_companion.0001.c.flavor:0 "A capable voice can spare us a drawn blade."
 rol_expedition_companion.0001.d:0 "We can manage without a formal agreement."
 rol_expedition_companion.0001.d.flavor:0 "The original expedition routes remain open."
 rol_expedition_companion_scholar_terms_tt:0 "While this scholar is alive and attending, binary expedition checks gain #V +3 percentage points#! success chance, capped at 95% and included in the displayed odds. Promise shared credit on return, costing 50 prestige."
 rol_expedition_companion_guard_terms_tt:0 "While this guard is alive and attending, unlock one guaranteed opening route costing 75 gold. Promise an additional 50 gold on return. This bypasses only the first trial; the remaining expedition and Tier4 requirement still apply."
 rol_expedition_companion_envoy_terms_tt:0 "While this envoy is alive and attending, unlock one peaceful settlement of a rival encounter, improving expedition progress and losing 10 stress. Promise public recognition on return, costing 75 prestige. A rival encounter is not guaranteed."
 rol_expedition_guard_route_option:0 "Let our guard prepare a secure passage."
 rol_expedition_guard_route_flavor:0 "Good equipment and patient work can replace a reckless gamble."
 rol_expedition_guard_route_tt:0 "Spend 75 gold for a guaranteed strong success at the first trial. Only available with the contracted guard present; usable once. The promised return payment is separate."
 rol_expedition_expert_route_option:0 "Apply the method I developed on earlier expeditions."
 rol_expedition_expert_route_flavor:0 "Read the obstacle, organize the work, and leave little to chance."
 rol_expedition_expert_route_tt:0 "With 60 experience in any Relic Seeker track, spend 100 gold for a guaranteed strong success at the first trial. No companion is required. Shares its one-use limit with the guard route."
 rol_rival.1000.d:0 "Have our envoy arrange a peaceful exchange."
 rol_rival.1000.d.flavor:0 "We need an agreement, not another enemy."
 rol_expedition_companion_mediation_tt:0 "Your contracted envoy settles this encounter without a duel or counterfeit roll, improves expedition progress and loses 10 stress. One mediation per expedition; the envoy must still be alive and attending."
 rol_expedition_companion.0002.t:0 "The Journey's Unfinished Promise"
 rol_expedition_companion.0002.desc.scholar:0 "The notes are back on my table. [rol_expedition_companion.GetTitledFirstName] asks me to give our research its promised shared credit. Whether the expedition ended in triumph or disappointment, the work was not mine alone.\n\nFulfilling this agreement costs 50 prestige."
 rol_expedition_companion.0002.desc.guard:0 "[rol_expedition_companion.GetTitledFirstName] has kept the company together through the journey. We agreed that 50 gold would be paid when the expedition ended. The price was for the service, not a guarantee that every legend would prove true."
 rol_expedition_companion.0002.desc.envoy:0 "[rol_expedition_companion.GetTitledFirstName] asks for the recognition we agreed upon. The name of the person who spoke for us should be heard alongside the account of our journey.\n\nFulfilling this agreement costs 75 prestige."
 rol_expedition_companion.0002.desc.absent:0 "The person named in my expedition agreement has died or is no longer a valid participant. There is no one else to whom I can quietly transfer the promise. I can close this record without payment or an experience reward."
 rol_expedition_companion.0002.a:0 "Fulfil the agreement in full."
 rol_expedition_companion.0002.a.flavor:0 "A kept promise makes the next journey possible."
 rol_expedition_companion.0002.b:0 "Agree on a smaller gift instead."
 rol_expedition_companion.0002.b.flavor:0 "We can part fairly without claiming the original terms were met."
 rol_expedition_companion.0002.c:0 "I will not honour this agreement."
 rol_expedition_companion.0002.c.flavor:0 "My former partner will remember this choice."
 rol_expedition_companion.0002.d:0 "Leave the record open for now."
 rol_expedition_companion.0002.d.flavor:0 "I can return to it through the settlement decision."
 rol_expedition_companion.0002.e:0 "Close the record; the promise cannot be settled."
 rol_expedition_companion.0002.e.flavor:0 "There will be no substitute recipient or unearned reward."
 rol_expedition_companion_honour_tt:0 "Pay the agreed 50 gold (guard), or share 50 prestige (scholar) / 75 prestige (envoy). Gain mutual +25 opinion for five years and three years of a kept-word reputation. With at least one completed stage, gain 10 experience in the partner's corresponding track. This same partner becomes preferred on a future expedition if attending and qualified."
 rol_expedition_companion_compromise_tt:0 "Give the same partner 25 gold and gain their respect. With at least one completed stage, gain 5 corresponding track experience. Does not establish a new trusted partner or grant the kept-word reputation."
 rol_expedition_companion_refuse_tt:0 "The partner gains -20 opinion and you acquire three years of a broken-word reputation. An existing trusted relationship with this same person is removed. Honest or just characters gain 15 stress. No experience reward."
 rol_expedition_companion_defer_tt:0 "Keep this same agreement pending. No reward or extra automatic reminders; you may settle it through the decision. You can continue expeditions, but cannot contract another specialist until this agreement is closed."
 rol_expedition_kept_word_modifier:0 "A Seeker Who Keeps Their Word"
 rol_expedition_kept_word_modifier_desc:0 "This character fulfilled an expedition agreement. The reputation lasts three years, refreshes rather than stacking, and replaces a broken-word reputation."
 rol_expedition_broken_word_modifier:0 "An Expedition Promise Broken"
 rol_expedition_broken_word_modifier_desc:0 "This character refused an expedition agreement. The reputation lasts three years, refreshes rather than stacking, and replaces a kept-word reputation."
 rol_expedition_fulfilled_pact_opinion:0 "Expedition Promise Fulfilled"
 rol_settle_expedition_pact_decision:0 "Settle an Expedition Agreement"
 rol_settle_expedition_pact_decision_desc:0 "Return to the promise made to a particular expedition partner. Choose to fulfil it, negotiate compensation, or close the dispute."
 rol_settle_expedition_pact_decision_tooltip:0 "Reopen the existing agreement. Does not select another person or generate new rewards."
 rol_settle_expedition_pact_decision_confirm:0 "Open the agreement"
