l_english:
 rol_expedition_feedback_guard_route_title:0 "A Guard Secures the Route"
 rol_expedition_feedback_guard_route:0 "[TARGET_CHARACTER.GetShortUIName|U] secured passage for [CHARACTER.GetShortUINamePossessive] party through the first trial. This completed work counted toward the guard's Exploration practice."
 rol_expedition_feedback_expert_route_title:0 "An Experienced Opening"
 rol_expedition_feedback_expert_route:0 "[CHARACTER.GetShortUIName|U] used expedition expertise to arrange a reliable opening; the remaining trials still lay ahead."
 rol_expedition_feedback_star_chart_title:0 "Following the Observations"
 rol_expedition_feedback_star_chart:0 "[CHARACTER.GetShortUIName|U] consumed the star observations to pass Sevilla's first trial with certainty."
 rol_expedition_feedback_ocean_chart_title:0 "Following the Sailing Chart"
 rol_expedition_feedback_ocean_chart:0 "[CHARACTER.GetShortUIName|U] consumed the Aegean sailing chart to pass the first Naxos trial with certainty."
 rol_expedition_feedback_reunion_title:0 "Travelling with an Old Companion"
 rol_expedition_feedback_reunion:0 "[CHARACTER.GetShortUIName|U] worked with [TARGET_CHARACTER.GetShortUIName] again; familiar teamwork eased stress and gave the party an early advantage."
 rol_expedition_feedback_mediation_title:0 "An Envoy Settles the Dispute"
 rol_expedition_feedback_mediation:0 "[TARGET_CHARACTER.GetShortUIName|U] settled a rival dispute for [CHARACTER.GetShortUINamePossessive] party, allowing the expedition to advance. This completed mediation counted toward the envoy's Negotiation practice."
 rol_expedition_feedback_envoy_accord_title:0 "Mediation Becomes a Lasting Accord"
 rol_expedition_feedback_envoy_accord:0 "Through an envoy's accord, [CHARACTER.GetShortUIName] spent prestige to remember the original rival [TARGET_CHARACTER.GetShortUIName] as an associate for ten years. This replaces the last remembered person and allows joint research when the associate attends a later expedition."
 rol_expedition_feedback_joint_research_title:0 "Comparing Evidence with an Old Associate"
 rol_expedition_feedback_joint_research:0 "[CHARACTER.GetShortUIName|U] compared evidence with the original associate [TARGET_CHARACTER.GetShortUIName], gaining 5 expedition progress with certainty."
 rol_expedition_feedback_reconciliation_title:0 "Compensating the Original Rival"
 rol_expedition_feedback_reconciliation:0 "[CHARACTER.GetShortUIName|U] paid [TARGET_CHARACTER.GetShortUIName] 50 gold to turn their grievance into cooperation; reconciliation granted no extra progress or experience."
 rol_expedition_feedback_paid_recovery_title:0 "Hiring Help to Continue"
 rol_expedition_feedback_paid_recovery:0 "[CHARACTER.GetShortUIName|U] paid 50 gold and took 10 base Stress to recover this trial's lost progress and continue. The expedition's single crisis recovery was spent."
 rol_expedition_feedback_master_recovery_title:0 "A Master Leads the Detour"
 rol_expedition_feedback_master_recovery:0 "[CHARACTER.GetShortUIName|U] led the detour personally, spending no gold but taking 25 base Stress to recover this trial's lost progress and continue. The expedition's single crisis recovery was spent."
 rol_expedition_feedback_salvage_title:0 "Preserving Partial Results"
 rol_expedition_feedback_salvage:0 "[CHARACTER.GetShortUIName|U] abandoned the complete relic claim for this attempt and preserved partial results and records for a future expedition."
 rol_expedition_feedback_retreat_title:0 "Withdrawing from the Crisis"
 rol_expedition_feedback_retreat:0 "[CHARACTER.GetShortUIName|U] ended this expedition and relieved stress; the retreat did not secure the complete relic."
