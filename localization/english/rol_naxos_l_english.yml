l_english:

 # Internal: Tier 4 final gate remains required for RoL expedition success.
 rol_quest_naxos.0990.t:0 "Arrival at Thera"
 rol_quest_naxos.0990.desc:0 "At the volcanic cliffs of Thera, Roman inscriptions and alien sigils mark a hidden descent. The underground palace is real."
 rol_quest_naxos.0990.a:0 "Enter the palace."

 rol_quest_naxos.1000.t:0 "Antechamber of the Emperor"
 rol_quest_naxos.1000.desc:0 "Stone vaults and impossible alloys frame the first gate. Records imply the Emperor once safeguarded humanity here and left a Custodes oath-lock."
 rol_quest_naxos.1000.a:0 "Break the first seal by force."
 rol_quest_naxos.1000.b:0 "Decode the mechanism first."
 rol_quest_naxos.1000.c:0 "Withdraw immediately."
 rol_quest_naxos.1000.a.tt:0 "[martial|E]/[prowess|E] check: shatter the first seal by force."
 rol_quest_naxos.1000.a.odds_elite_tt:0 "This approach has a #P commanding grip#! on the trial."
 rol_quest_naxos.1000.a.odds_high_tt:0 "This approach gives you #P favorable odds#!."
 rol_quest_naxos.1000.a.odds_low_tt:0 "This approach is a #N dangerous gamble#!."
 rol_quest_naxos.1000.b.tt:0 "[learning|E] check: success fully synchronizes the first seal."
 rol_quest_naxos.1000.c.tt:0 "Abort the expedition and trigger a 2-year cooldown."

 rol_quest_naxos.1010.t:0 "First Seal Breached"
 rol_quest_naxos.1010.desc:0 "The gate opens. Heavy synchronized footfalls echo from deeper halls."
 rol_quest_naxos.1010.a:0 "Advance."
 rol_quest_naxos.1011.t:0 "Line Collapse"
 rol_quest_naxos.1011.desc:0 "Your formation breaks under pressure. Continuing would destroy the expedition."
 rol_quest_naxos.1011.a:0 "Assess the party and the evidence first."
 rol_quest_naxos.1012.t:0 "Ordered Retreat"
 rol_quest_naxos.1012.desc:0 "You save the core force and fall back. The palace seals behind you."
 rol_quest_naxos.1012.a:0 "Return in two years."

 rol_quest_naxos.1002.t:0 "Verification Hall"
 rol_quest_naxos.1002.desc:0 "Command authority, loyalty, and intent are tested by layered controls. Any mistake triggers lethal countermeasures."
 rol_quest_naxos.1002.a:0 "Hold the line through command presence."
 rol_quest_naxos.1002.b:0 "Solve each verification sequence."
 rol_quest_naxos.1002.c:0 "Abort the sequence."
 rol_quest_naxos.1002.a.tt:0 "[diplomacy|E] check: hold the verification line together."
 rol_quest_naxos.1002.a.odds_elite_tt:0 "This approach has a #P commanding grip#! on the trial."
 rol_quest_naxos.1002.a.odds_high_tt:0 "This approach gives you #P favorable odds#!."
 rol_quest_naxos.1002.a.odds_low_tt:0 "This approach is a #N dangerous gamble#!."
 rol_quest_naxos.1002.b.tt:0 "[learning|E] check: unravel the verification sequence."
 rol_quest_naxos.1002.b.odds_elite_tt:0 "This approach has a #P commanding grip#! on the trial."
 rol_quest_naxos.1002.b.odds_high_tt:0 "This approach gives you #P favorable odds#!."
 rol_quest_naxos.1002.b.odds_low_tt:0 "This approach is a #N dangerous gamble#!."
 rol_quest_naxos.1002.c.tt:0 "Abort and trigger cooldown."

 rol_quest_naxos.1020.t:0 "Verification Passed"
 rol_quest_naxos.1020.desc:0 "The core corridor opens. The Custodes oath-command lies ahead."
 rol_quest_naxos.1020.a:0 "Continue."
 rol_quest_naxos.1021.t:0 "Verification Failed"
 rol_quest_naxos.1021.desc:0 "Countermeasures activate across the hall. Safe advance is no longer possible."
 rol_quest_naxos.1021.a:0 "Assess the party and the evidence first."
 rol_quest_naxos.1022.t:0 "Sequence Aborted"
 rol_quest_naxos.1022.desc:0 "You disengage before total collapse."
 rol_quest_naxos.1022.a:0 "Fallback complete."

 rol_quest_naxos.1003.t:0 "Custodes Gate Formation"
 rol_quest_naxos.1003.desc:0 "Golden-armored echoes form a silent battle line before the final door."
 rol_quest_naxos.1003.a:0 "Break them head-on."
 rol_quest_naxos.1003.b:0 "Slip behind the formation."
 rol_quest_naxos.1003.c:0 "Withdraw."
 rol_quest_naxos.1003.a.tt:0 "[martial|E]/[prowess|E] check: break the gate array head-on."
 rol_quest_naxos.1003.a.odds_elite_tt:0 "This approach has a #P commanding grip#! on the trial."
 rol_quest_naxos.1003.a.odds_high_tt:0 "This approach gives you #P favorable odds#!."
 rol_quest_naxos.1003.a.odds_low_tt:0 "This approach is a #N dangerous gamble#!."
 rol_quest_naxos.1003.b.tt:0 "[intrigue|E] check: slip behind the array, sever its core, and fully synchronize the gate."
 rol_quest_naxos.1003.b.odds_elite_tt:0 "This approach has a #P commanding grip#! on the trial."
 rol_quest_naxos.1003.b.odds_high_tt:0 "This approach gives you #P favorable odds#!."
 rol_quest_naxos.1003.b.odds_low_tt:0 "This approach is a #N dangerous gamble#!."
 rol_quest_naxos.1003.c.tt:0 "Abort and trigger cooldown."

 rol_quest_naxos.1030.t:0 "The Gate Yields"
 rol_quest_naxos.1030.desc:0 "The line parts. Oath-pillars come alive as if acknowledging your command."
 rol_quest_naxos.1030.a:0 "Accept the final verdict."
 rol_quest_naxos.1031.t:0 "The Gate Denies You"
 rol_quest_naxos.1031.desc:0 "The formation shatters your rhythm. Continuing would be annihilation."
 rol_quest_naxos.1031.a:0 "Assess the party and the evidence first."
 rol_quest_naxos.1032.t:0 "Retreat at the Final Door"
 rol_quest_naxos.1032.desc:0 "You call withdrawal at the threshold."
 rol_quest_naxos.1032.a:0 "Stand down."
 rol_quest_naxos.1050.t:0 "Companion Debate in the Vault"
 rol_quest_naxos.1050.desc:0 "A guest in your expedition urges caution before the next command-lock. Their caution may preserve order—or cost momentum."
 rol_quest_naxos.1050.a:0 "Accept the careful approach."
 rol_quest_naxos.1050.b:0 "Push hard and keep tempo."

 rol_quest_naxos.1001.t:0 "Final Verdict of the Thera Palace"
 rol_quest_naxos.1001.desc:0 "You stand before the final oath-interface."
 rol_quest_naxos.1001.desc.tier_1:0 "You reached the end, but failed to complete synchronization."
 rol_quest_naxos.1001.desc.tier_2:0 "You passed most trials, but the command lock stayed sealed."
 rol_quest_naxos.1001.desc.tier_3:0 "You came close, but not enough."
 rol_quest_naxos.1001.desc.tier_4:0 "All trials complete. The palace grants Custodes command authority."
 rol_quest_naxos.1001.desc.below_tier4:0 "The last interface withdraws its answer. The palace falls silent, and the verdict is not yours."
 rol_quest_naxos.1001.desc.partial:0 "The command lock stays sealed, but the palace leaves you a usable sequence of marks. You have evidence for a future attempt, not the full authority."
 rol_quest_naxos.1001.a:0 "Issue the Custodes order."
 rol_quest_naxos.1001.a.tt:0 "Only a full final authorization answers your command. Otherwise the expedition fails and enters a 2-year cooldown."

 rol_quest_naxos.1090.t:0 "Thera Expedition Summary"
 rol_quest_naxos.1090.desc.success_4.standard:0 "A near-mythic success. The underground palace now answers your command.\n\n$EFFECT_LIST_BULLET$Unlocked recruitment: #P $rol_adeptus_custudes$#!\n$EFFECT_LIST_BULLET$Gained #P +220#! [prestige|E]\n$EFFECT_LIST_BULLET$Gained #P +80#! [gold|E]\n$EFFECT_LIST_BULLET$No extra triumph bonus came from expedition preparation"
 rol_quest_naxos.1090.desc.success_4.high:0 "A near-mythic success. The underground palace now answers your command.\n\n$EFFECT_LIST_BULLET$Unlocked recruitment: #P $rol_adeptus_custudes$#!\n$EFFECT_LIST_BULLET$Gained #P +220#! [prestige|E]\n$EFFECT_LIST_BULLET$Gained #P +80#! [gold|E]\n$EFFECT_LIST_BULLET$Gained #P +150#! [prestige|E] and #P +25#! [dynasty_prestige|E] from high preparation"
 rol_quest_naxos.1090.desc.success_4.supreme:0 "A near-mythic success. The underground palace now answers your command.\n\n$EFFECT_LIST_BULLET$Unlocked recruitment: #P $rol_adeptus_custudes$#!\n$EFFECT_LIST_BULLET$Gained #P +220#! [prestige|E]\n$EFFECT_LIST_BULLET$Gained #P +80#! [gold|E]\n$EFFECT_LIST_BULLET$Gained #P +350#! [prestige|E] and #P +50#! [dynasty_prestige|E] from supreme preparation"
 rol_quest_naxos.1090.desc.success_3:0 "Strong control, but short of perfect closure."
 rol_quest_naxos.1090.desc.success_2:0 "You reached the end at severe cost."
 rol_quest_naxos.1090.desc.success_1:0 "You barely extracted the force intact."
 rol_quest_naxos.1090.desc.failure:0 "The expedition failed and needs long recovery."
 rol_quest_naxos.1090.desc.fallback:0 "The expedition has ended."
 rol_quest_naxos.1090.a:0 "Record the operation."

 activity_rol_seek_naxos_guard:0 "Thera Palace Expedition"
 activity_rol_seek_naxos_guard_desc:0 "Descend into the buried palace beneath Thera to investigate impossible command echoes, sealed halls, and a verdict no mortal court remembers."
 activity_rol_seek_naxos_guard_host_desc:0 "$BULLET_WITH_TAB$Adjust your outlay through the $rol_option_expedition_preparation$ activity option\n$BULLET_WITH_TAB$A qualified party can remedy one crisis; otherwise failure ends the expedition with a 2-year cooldown"
 activity_rol_seek_naxos_guard_guest_desc:0 ""
 activity_rol_seek_naxos_guard_conclusion_desc:0 "The volcanic stone seals behind your column."
 activity_rol_seek_naxos_guard_conclusion_desc_success_4:0 "You fully restored Custodes command authority."
 activity_rol_seek_naxos_guard_conclusion_desc_success_3:0 "Close, but not complete."
 activity_rol_seek_naxos_guard_conclusion_desc_success_2:0 "A hard push, still short of total authorization."
 activity_rol_seek_naxos_guard_conclusion_desc_success_1:0 "Barely controlled withdrawal."
 activity_rol_seek_naxos_guard_conclusion_desc_failure:0 "Forced termination. Two-year cooldown."
 activity_rol_seek_naxos_guard_conclusion_desc_fallback:0 "The expedition is over."
 activity_rol_seek_naxos_guard_selection_tooltip:0 "Lead a deep-threshold descent beneath Thera, where buried command systems and silent guardians test every step.\n\nA qualified party can remedy one crisis; otherwise failure ends the expedition with a 2-year cooldown."
 activity_rol_seek_naxos_guard_predicted_cost:0 "The expedition's cost depends heavily on the personnel and equipment grade you select."
 activity_rol_seek_naxos_guard_province_desc:0 "Target location: [ROOT.Province.GetName]"

 activity_rol_seek_naxos_guard_special_type_title:0 "Palace Synchronization"
 activity_rol_seek_naxos_guard_special_type_desc:0 "Your choices determine how deeply the buried command lattice synchronizes with you. Only the strongest alignment wins a final answer."
 ROL_NAXOS_WINDOW_SPECIAL_PROGRESS_TOOLTIP:0 "Current synchronization: [ActivityWindow.GetSpecialProgressValue|0^V]"
 activity_rol_seek_naxos_guard_special_type_bar_segment_tt_0:0 "#T Critical#!\nThe expedition is near collapse."
 activity_rol_seek_naxos_guard_special_type_bar_segment_tt_1:0 "#T Unstable#!\nStill advancing at high risk."
 activity_rol_seek_naxos_guard_special_type_bar_segment_tt_2:0 "#T Recovering#!\nControl is returning."
 activity_rol_seek_naxos_guard_special_type_bar_segment_tt_3:0 "#T Advantage#!\nNear final threshold."
 activity_rol_seek_naxos_guard_special_type_bar_segment_tt_4:0 "#T Final Verdict#!\nThe palace is close to a decisive response."
 activity_rol_seek_naxos_guard_special_type_bar_segment_0_tt:0 "$activity_rol_seek_naxos_guard_special_type_bar_segment_tt_0$"
 activity_rol_seek_naxos_guard_special_type_bar_segment_1_tt:0 "$activity_rol_seek_naxos_guard_special_type_bar_segment_tt_1$"
 activity_rol_seek_naxos_guard_special_type_bar_segment_2_tt:0 "$activity_rol_seek_naxos_guard_special_type_bar_segment_tt_2$"
 activity_rol_seek_naxos_guard_special_type_bar_segment_3_tt:0 "$activity_rol_seek_naxos_guard_special_type_bar_segment_tt_3$"
 activity_rol_seek_naxos_guard_special_type_bar_segment_4_tt:0 "$activity_rol_seek_naxos_guard_special_type_bar_segment_tt_4$"

 phase_rol_naxos_descent_phase:0 "Thera Palace Descent"
 phase_rol_naxos_descent_phase_desc:0 "Your force is moving through the buried palace under Thera."
 rol_naxos_descent_phase:0 "$phase_rol_naxos_descent_phase$"
 rol_naxos_descent_phase_desc:0 "$phase_rol_naxos_descent_phase_desc$"

 rol_seek_naxos_guard_cost_desc:0 "Thera expedition preparations"
 rol_naxos_quest_on_cooldown_tt:0 "Your previous Thera expedition failed. Wait 2 years."
 rol_naxos_quest_cooldown_modifier:0 "Thera Expedition Cooldown"
 rol_naxos_quest_cooldown_modifier_desc:0 "The prior expedition ended in severe losses."
 TRAVEL_NAME_FOR_activity_rol_seek_naxos_guard:0 "[Character.GetFirstNameNoTooltip]'s Thera Expedition"

 rol_naxos_activity_success_toast_title:0 "Thera Expedition Success"
 rol_naxos_activity_failure_toast_title:0 "Thera Expedition Failed"
 rol_naxos_activity_success_toast_desc:0 "The palace trials are overcome and your command authority stands affirmed."
 rol_naxos_activity_failure_toast_desc:0 "The operation has failed. Logistics and morale must recover before a new run."

 rol_adeptus_custudes:0 "Adeptus Custodes"
 rol_adeptus_custudes_flavor:0 "The Emperor's golden companions—gene-forged sentinels wrought to stand at the Master of Mankind's side. These sealed formations awaken only for one who completes the oath-command and proves worthy of directing the Ten Thousand."
 rol_naxian_tideguard:0 "$rol_adeptus_custudes$"
 rol_naxian_tideguard_flavor:0 "$rol_adeptus_custudes_flavor$"
