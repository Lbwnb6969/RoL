l_english:

 # Internal: Tier 4 final gate remains required for RoL expedition success.
 rol_nibelung_star_sphere:0 "Nibelung Star Sphere"
 rol_nibelung_star_sphere_desc:0 "Forged from a fallen star-heart, this ceremonial sphere holds a slow-turning galaxy within frozen crystal."
 artifact_rol_nibelung_star_sphere:0 "Nibelung Star Sphere"
 artifact_rol_nibelung_star_sphere_desc:0 "It turns above the palm like a captive night sky, whispering in ancient starlight."

 rol_quest_munich.0990.t:0 "At the Mouth of the Star-Crypt"
 rol_quest_munich.0990.desc:0 "Your expedition reaches the wind-cut ravine outside Munich where the earth split open. Frost hangs in the air like incense, and no one speaks above a whisper. Beneath the broken stone, the old shaft descends into a silence that feels older than kings."
 rol_quest_munich.0990.a:0 "Light the sacred torches. We descend with reverence."

 rol_quest_munich.1000.t:0 "Into the Absolute Frost"
 rol_quest_munich.1000.desc:0 "In the deepest shaft, your torches reveal a mirror-smooth glacial gate. Star-runes move beneath the ice like living constellations."
 rol_quest_munich.1000.a:0 "Decode the star-map lock."
 rol_quest_munich.1000.b:0 "Breach it by force."
 rol_quest_munich.1000.c:0 "Withdraw while we still can."
 rol_quest_munich.1000.a.base_tt:0 "[learning|E] check."
 rol_quest_munich.1000.a.odds_elite_tt:0 "This approach has a #P commanding grip#! on the trial."
 rol_quest_munich.1000.a.odds_high_tt:0 "This approach gives you #P favorable odds#!."
 rol_quest_munich.1000.a.odds_low_tt:0 "This approach is a #N dangerous gamble#!."
 rol_quest_munich.1000.b.base_tt:0 "[martial|E]/[prowess|E] check."
 rol_quest_munich.1000.b.odds_elite_tt:0 "This approach has a #P commanding grip#! on the trial."
 rol_quest_munich.1000.b.odds_high_tt:0 "This approach gives you #P favorable odds#!."
 rol_quest_munich.1000.b.odds_low_tt:0 "This approach is a #N dangerous gamble#!."
 rol_quest_munich.1000.c.tt:0 "You abort the expedition. 2-year cooldown."

 rol_quest_munich.1002.t:0 "Abyss of the Mind"
 rol_quest_munich.1002.desc:0 "Beyond the ice gate lies a vast cavern lit by impossible crystal light. Visions spread through the ranks: dead kin, cosmic voids, and screaming stars."
 rol_quest_munich.1002.a:0 "Steady them with command."
 rol_quest_munich.1002.b:0 "Calm the surge through prayer."
 rol_quest_munich.1002.c:0 "Retreat before sanity breaks."
 rol_quest_munich.1002.a.base_tt:0 "[diplomacy|E] check."
 rol_quest_munich.1002.a.odds_elite_tt:0 "This approach has a #P commanding grip#! on the trial."
 rol_quest_munich.1002.a.odds_high_tt:0 "This approach gives you #P favorable odds#!."
 rol_quest_munich.1002.a.odds_low_tt:0 "This approach is a #N dangerous gamble#!."
 rol_quest_munich.1002.b.base_tt:0 "[piety_level|E] check."
 rol_quest_munich.1002.b.odds_elite_tt:0 "This approach has a #P commanding grip#! on the trial."
 rol_quest_munich.1002.b.odds_high_tt:0 "This approach gives you #P favorable odds#!."
 rol_quest_munich.1002.b.odds_low_tt:0 "This approach is a #N dangerous gamble#!."
 rol_quest_munich.1002.c.tt:0 "You abort the expedition. 2-year cooldown."
 rol_quest_munich.1050.t:0 "Murmurs in the Deep"
 rol_quest_munich.1050.desc:0 "An invited companion proposes a careful halt to recalibrate the party's nerves before the sanctum threshold."
 rol_quest_munich.1050.a:0 "Take the measured pause."
 rol_quest_munich.1050.b:0 "No. We keep moving."

 rol_quest_munich.1001.t:0 "Heart of Fallen Stars"
 rol_quest_munich.1001.desc:0 "Above a silent underground ice lake, an iron altar suspends the ancient sphere. Inside it, a miniature galaxy turns in patient orbit."
 rol_quest_munich.1001.desc.tier_1:0 "The light dims at your touch. You claim the relic, but its deepest power remains sealed."
 rol_quest_munich.1001.desc.tier_2:0 "The sphere accepts you with a soft glow, granting fragments of forgotten knowledge."
 rol_quest_munich.1001.desc.tier_3:0 "Aurora-like colors flood the chamber as the sphere rises to your palm in near-perfect resonance."
 rol_quest_munich.1001.desc.tier_4:0 "A pillar of starlight pierces the earth above Munich. The relic circles you like a loyal moon."
 rol_quest_munich.1001.desc.below_tier4:0 "The final resonance shatters before it completes. The starlight gutters out, and the sanctum denies you."
 rol_quest_munich.1001.a:0 "Let the heavens witness me."
 rol_quest_munich.1001.a.tt:0 "Only a full final resonance secures the claim. Otherwise the expedition fails and enters a 2-year cooldown."

 rol_quest_munich.1090.t:0 "Star-Crypt Expedition Summary"
 rol_quest_munich.1090.desc.success_4.standard:0 "A legendary success: command, faith, and destiny aligned.\n\n$EFFECT_LIST_BULLET$Gained relic: #P $artifact_rol_nibelung_star_sphere$#!\n$EFFECT_LIST_BULLET$Gained #P +300#! [piety|E]\n$EFFECT_LIST_BULLET$Gained #P +200#! [prestige|E]\n$EFFECT_LIST_BULLET$No extra triumph bonus came from expedition preparation"
 rol_quest_munich.1090.desc.success_4.high:0 "A legendary success: command, faith, and destiny aligned.\n\n$EFFECT_LIST_BULLET$Gained relic: #P $artifact_rol_nibelung_star_sphere$#!\n$EFFECT_LIST_BULLET$Gained #P +300#! [piety|E]\n$EFFECT_LIST_BULLET$Gained #P +200#! [prestige|E]\n$EFFECT_LIST_BULLET$Gained #P +150#! [prestige|E] and #P +25#! [dynasty_prestige|E] from high preparation"
 rol_quest_munich.1090.desc.success_4.supreme:0 "A legendary success: command, faith, and destiny aligned.\n\n$EFFECT_LIST_BULLET$Gained relic: #P $artifact_rol_nibelung_star_sphere$#!\n$EFFECT_LIST_BULLET$Gained #P +300#! [piety|E]\n$EFFECT_LIST_BULLET$Gained #P +200#! [prestige|E]\n$EFFECT_LIST_BULLET$Gained #P +350#! [prestige|E] and #P +50#! [dynasty_prestige|E] from supreme preparation"
 rol_quest_munich.1090.desc.success_3:0 "A brilliant result achieved through exceptional leadership."
 rol_quest_munich.1090.desc.success_2:0 "A costly but stable success."
 rol_quest_munich.1090.desc.success_1:0 "A narrow success won at heavy strain."
 rol_quest_munich.1090.desc.failure:0 "Expedition failed. A two-year recovery is required."
 rol_quest_munich.1090.desc.fallback:0 "The descent has ended."
 rol_quest_munich.1090.a:0 "Record the outcome."

 activity_rol_seek_nibelung_sphere:0 "Nibelung Star Expedition"
 activity_rol_seek_nibelung_sphere_desc:0 "Descend beneath Munich to pursue frost-sealed star omens and the buried sanctum that birthed them."
 activity_rol_seek_nibelung_sphere_host_desc:0 "$BULLET_WITH_TAB$Adjust your outlay through the $rol_option_expedition_preparation$ activity option\n$BULLET_WITH_TAB$Failure ends the expedition and applies a 2-year cooldown"
 activity_rol_seek_nibelung_sphere_guest_desc:0 ""
 activity_rol_seek_nibelung_sphere_conclusion_desc:0 "The entrance freezes over behind you, but the memory of stars beneath the earth remains."
 activity_rol_seek_nibelung_sphere_conclusion_desc_success_4:0 "You achieved full cosmic resonance."
 activity_rol_seek_nibelung_sphere_conclusion_desc_success_3:0 "The sphere answered with a brilliant inner galaxy."
 activity_rol_seek_nibelung_sphere_conclusion_desc_success_2:0 "You secured a stable star-lit response."
 activity_rol_seek_nibelung_sphere_conclusion_desc_success_1:0 "You succeeded, but only barely."
 activity_rol_seek_nibelung_sphere_conclusion_desc_failure:0 "You were forced to withdraw. Two-year cooldown."
 activity_rol_seek_nibelung_sphere_conclusion_desc_fallback:0 "The expedition has concluded."
 activity_rol_seek_nibelung_sphere_selection_tooltip:0 "Lead a deep descent through frost seals, star-lit chasms, and a buried sanctum that answers only to the worthy.\n\nFailure ends the expedition and applies a 2-year cooldown."
 activity_rol_seek_nibelung_sphere_predicted_cost:0 "The expedition's cost depends heavily on the personnel and equipment grade you select."
 activity_rol_seek_nibelung_sphere_province_desc:0 "Target location: [ROOT.Province.GetName]"

 activity_rol_seek_nibelung_sphere_special_type_title:0 "Cosmic Resonance"
 activity_rol_seek_nibelung_sphere_special_type_desc:0 "Your choices determine how fully the star-sanctum resonates with you. Only the deepest alignment draws out a true response."
 ROL_NIBELUNG_WINDOW_SPECIAL_PROGRESS_TOOLTIP:0 "Current resonance: [ActivityWindow.GetSpecialProgressValue|0^V]"
 activity_rol_seek_nibelung_sphere_special_type_bar_segment_tt_0:0 "#T Rejected#!\nThe sanctum resists you."
 activity_rol_seek_nibelung_sphere_special_type_bar_segment_tt_1:0 "#T Unsteady#!\nThe party endures, barely."
 activity_rol_seek_nibelung_sphere_special_type_bar_segment_tt_2:0 "#T Starlit#!\nThe relic begins to answer."
 activity_rol_seek_nibelung_sphere_special_type_bar_segment_tt_3:0 "#T Ascendant#!\nNear-perfect alignment."
 activity_rol_seek_nibelung_sphere_special_type_bar_segment_tt_4:0 "#T Final Constellation#!\nThe sanctum is close to a complete reply."
