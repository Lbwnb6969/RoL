 phase_rol_nibelung_descent_phase:0 "Subterranean Descent"
 phase_rol_nibelung_descent_phase_desc:0 "You are descending toward the frozen sanctum beneath Bavaria."
 rol_nibelung_descent_phase:0 "$phase_rol_nibelung_descent_phase$"
 rol_nibelung_descent_phase_desc:0 "$phase_rol_nibelung_descent_phase_desc$"

 rol_seek_nibelung_sphere_cost_desc:0 "Expedition and frost-breach preparations"
 rol_nibelung_quest_on_cooldown_tt:0 "Your last star expedition failed. Wait 2 years."
 rol_nibelung_quest_cooldown_modifier:0 "Star Expedition Cooldown"
 rol_nibelung_quest_cooldown_modifier_desc:0 "The previous descent ended in failure. The expedition corps needs recovery time."
 TRAVEL_NAME_FOR_activity_rol_seek_nibelung_sphere:0 "[Character.GetFirstNameNoTooltip]'s Star Expedition"

 rol_nibelung_activity_success_toast_title:0 "Star Expedition Success"
 rol_nibelung_activity_failure_toast_title:0 "Star Expedition Failed"
 rol_nibelung_activity_success_toast_desc:0 "The frost-sanctum yields, and your expedition returns beneath star-lit acclaim."
 rol_nibelung_activity_failure_toast_desc:0 "The descent is broken. Your corps must regroup before another attempt."

 rol_quest_munich.1010.t:0 "The Ice Gate Yields"
 rol_quest_munich.1010.desc:0 "Runes and torchlight clash until the frost-bound gate finally gives way. The party steadies itself, and the descent can continue."
 rol_quest_munich.1010.a:0 "Deeper now."
 rol_quest_munich.1011.t:0 "Backlash of the Ice Gate"
 rol_quest_munich.1011.desc:0 "Absolute cold and star-noise strike at once, and the company falters. To descend farther would only multiply the dead."
 rol_quest_munich.1011.a:0 "End the expedition."
 rol_quest_munich.1012.t:0 "Held at the Threshold"
 rol_quest_munich.1012.desc:0 "You order the retreat, and the frozen gate seals itself behind you once more. The sanctum sinks back into silence."
 rol_quest_munich.1012.a:0 "We return in time."
 rol_quest_munich.1020.t:0 "The Mindscape Stabilizes"
 rol_quest_munich.1020.desc:0 "The visions thin and your people recover their grip on themselves. The pulse of the sanctum's core waits just ahead."
 rol_quest_munich.1020.a:0 "Go deeper."
 rol_quest_munich.1021.t:0 "Mindscape Collapse"
 rol_quest_munich.1021.desc:0 "The company is torn apart by the visions and its last barrier of will fails. You must end the descent at once."
 rol_quest_munich.1021.a:0 "Pull everyone out."
 rol_quest_munich.1022.t:0 "Withdraw from the Sanctum"
 rol_quest_munich.1022.desc:0 "You choose to preserve what remains, leading the expedition out of the hollow before the depths claim the rest of their reason."
 rol_quest_munich.1022.a:0 "Necessary."
