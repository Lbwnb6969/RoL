l_english:
 rol_nibelung_star_sphere:0 "Nibelung Star Sphere"
 rol_nibelung_star_sphere_desc:0 "Forged from a fallen star-heart, this ceremonial sphere holds a slow-turning galaxy within frozen crystal."
 artifact_rol_nibelung_star_sphere:0 "Nibelung Star Sphere"
 artifact_rol_nibelung_star_sphere_desc:0 "It turns above the palm like a captive night sky, whispering in ancient starlight."

 rol_quest_munich.1000.t:0 "Into the Absolute Frost"
 rol_quest_munich.1000.desc:0 "In the deepest shaft, your torches reveal a mirror-smooth glacial gate. Star-runes move beneath the ice like living constellations."
 rol_quest_munich.1000.a:0 "Decode the star-map lock."
 rol_quest_munich.1000.b:0 "Breach it by force."
 rol_quest_munich.1000.c:0 "Withdraw while we still can."
 rol_quest_munich.1000.a.base_tt:0 "[learning|E] check."
 rol_quest_munich.1000.a.odds_high_tt:0 "Current odds: #P 70% success#!, #N 30% failure#!."
 rol_quest_munich.1000.a.odds_low_tt:0 "Current odds: #P 45% success#!, #N 55% failure#!."
 rol_quest_munich.1000.b.base_tt:0 "[martial|E]/[prowess|E] check."
 rol_quest_munich.1000.b.odds_high_tt:0 "Current odds: #P 55% success#!, #N 45% failure#!."
 rol_quest_munich.1000.b.odds_low_tt:0 "Current odds: #P 35% success#!, #N 65% failure#!."
 rol_quest_munich.1000.c.tt:0 "You abort the expedition. 2-year cooldown."

 rol_quest_munich.1002.t:0 "Abyss of the Mind"
 rol_quest_munich.1002.desc:0 "Beyond the ice gate lies a vast cavern lit by impossible crystal light. Visions spread through the ranks: dead kin, cosmic voids, and screaming stars."
 rol_quest_munich.1002.a:0 "Steady them with command."
 rol_quest_munich.1002.b:0 "Calm the surge through prayer."
 rol_quest_munich.1002.c:0 "Retreat before sanity breaks."
 rol_quest_munich.1002.a.base_tt:0 "[diplomacy|E] check."
 rol_quest_munich.1002.a.odds_high_tt:0 "Current odds: #P 65% success#!, #N 35% failure#!."
 rol_quest_munich.1002.a.odds_low_tt:0 "Current odds: #P 40% success#!, #N 60% failure#!."
 rol_quest_munich.1002.b.base_tt:0 "[piety_level|E] check."
 rol_quest_munich.1002.b.odds_high_tt:0 "Current odds: #P 75% success#!, #N 25% failure#!."
 rol_quest_munich.1002.b.odds_low_tt:0 "Current odds: #P 45% success#!, #N 55% failure#!."
 rol_quest_munich.1002.c.tt:0 "You abort the expedition. 2-year cooldown."

 rol_quest_munich.1001.t:0 "Heart of Fallen Stars"
 rol_quest_munich.1001.desc:0 "Above a silent underground ice lake, an iron altar suspends the ancient sphere. Inside it, a miniature galaxy turns in patient orbit."
 rol_quest_munich.1001.desc.tier_1:0 "The light dims at your touch. You claim the relic, but its deepest power remains sealed."
 rol_quest_munich.1001.desc.tier_2:0 "The sphere accepts you with a soft glow, granting fragments of forgotten knowledge."
 rol_quest_munich.1001.desc.tier_3:0 "Aurora-like colors flood the chamber as the sphere rises to your palm in near-perfect resonance."
 rol_quest_munich.1001.desc.tier_4:0 "A pillar of starlight pierces the earth above Munich. The relic circles you like a loyal moon."
 rol_quest_munich.1001.a:0 "Let the heavens witness me."
 rol_quest_munich.1001.a.tt:0 "You gain the relic: $rol_nibelung_star_sphere$."

 rol_quest_munich.1090.t:0 "Star-Crypt Expedition Summary"
 rol_quest_munich.1090.desc.success_4:0 "A legendary success: command, faith, and destiny aligned."
 rol_quest_munich.1090.desc.success_3:0 "A brilliant result achieved through exceptional leadership."
 rol_quest_munich.1090.desc.success_2:0 "A costly but stable success."
 rol_quest_munich.1090.desc.success_1:0 "A narrow success won at heavy strain."
 rol_quest_munich.1090.desc.failure:0 "Expedition failed. A two-year recovery is required."
 rol_quest_munich.1090.desc.fallback:0 "The descent has ended."
 rol_quest_munich.1090.a:0 "Record the outcome."

 activity_rol_seek_nibelung_sphere:0 "Nibelung Star Expedition"
 activity_rol_seek_nibelung_sphere_desc:0 "Descend beneath Munich to seek the lost ceremonial sphere of the Nibelungs."
 activity_rol_seek_nibelung_sphere_host_desc:0 "$BULLET_WITH_TAB$May obtain legendary regalia: $rol_nibelung_star_sphere$\n$BULLET_WITH_TAB$Failure may cause injury, stress, and prestige loss"
