 rol_review_fragment_expedition_decision_tooltip:0 "Return to the unresolved fragment expedition."
 rol_review_fragment_expedition_decision_confirm:0 "Review the expedition record"
 rol_relic_fragment.0001.desc.closed:0 "This expedition record has already been closed. Any later fragment expedition has its own record and remains unchanged."
 rol_relic_fragment.0001.e:0 "Put this closed record away."
 rol_relic_fragment.0001.e.flavor:0 "The current expedition belongs to a different entry in the ledger."
