 rol_relic_fragment.0001.t: "The Missing Fragment"
 rol_relic_fragment.0001.desc: "A new clue points toward a fragment that could change how [ROOT.Char.GetFirstNamePossessive] relic is remembered. The trail is short, but every step carries the risk of breaking what you already possess."
 rol_relic_fragment.0001.a: "Study the old measurements."
 rol_relic_fragment.0001.a.flavor: "A patient eye may find what an eager hand would destroy."
 rol_relic_fragment.0001.a.odds_tt:0 "Current research odds: #P [ROOT.Char.MakeScope.ScriptValue('rol_fragment_learning_success_chance_value')|0]%#! (#N [ROOT.Char.MakeScope.ScriptValue('rol_fragment_learning_failure_chance_value')|0]%#! failure). Improved by [learning|E] and Relic Seeker Research expertise."
 rol_relic_fragment.0001.b: "Force the sealed chamber."
 rol_relic_fragment.0001.b.flavor: "The relic has survived war. So can its next trial."
 rol_relic_fragment.0001.b.odds_tt:0 "Current breaching odds: #P [ROOT.Char.MakeScope.ScriptValue('rol_fragment_prowess_success_chance_value')|0]%#! (#N [ROOT.Char.MakeScope.ScriptValue('rol_fragment_prowess_failure_chance_value')|0]%#! failure). Improved by [prowess|E] and Relic Seeker Exploration expertise; success also relieves stress."
 rol_relic_fragment.0001.c: "Commission master artisans and reinforced shoring."
 rol_relic_fragment.0001.c.flavor: "Fine tools, timber bracing, and steady hands minimize risk and leave valuable surplus materials."
 rol_relic_fragment.0001.c.odds_tt:0 "Current master-excavation odds: #P [ROOT.Char.MakeScope.ScriptValue('rol_fragment_stewardship_success_chance_value')|0]%#! (#N [ROOT.Char.MakeScope.ScriptValue('rol_fragment_stewardship_failure_chance_value')|0]%#! failure). Improved by [stewardship|E] and Negotiation expertise. Masterwork success costs an additional 50 gold and grants the five-year surplus bonus; failure costs an additional 25 gold and adds 10 less base stress than other fragment routes, retaining the two-year failure modifier."
 rol_relic_fragment.0001.success: "The fragment locks into place, and the relic answers with a deeper resonance."
 rol_relic_fragment.0001.failure: "The chamber gives way before the fragment can be secured."
 rol_relic_fragment.0002.t: "A Deeper Resonance"
 rol_relic_fragment.0002.desc: "The recovered fragment has been fitted into [ROOT.Char.GetFirstNamePossessive] relic. Its balance, weight, and old marks now suggest a history larger than the fragment alone. I can now choose how to channel this newly awakened resonance."
 rol_relic_fragment.0002.a: "Hone its martial edge and sovereign might."
 rol_relic_fragment.0002.a.flavor:0 "Let the reforged relic stand as an emblem of iron resolve (5-year Might Resonance and 5 Exploration XP)."
 rol_relic_fragment.0002.b:0 "Transcribe the newly aligned inscriptions."
 rol_relic_fragment.0002.b.flavor:0 "The joined seam reveals markings worthy of deep study (5-year Wisdom Resonance and 5 Research XP)."
 rol_relic_fragment.0002.c:0 "Unveil the restored relic before the court."
 rol_relic_fragment.0002.c.flavor:0 "Let the realm witness a legend made whole (lose stress, 5-year Courtly Resonance and 5 Negotiation XP)."
 rol_relic_fragment.0001.desc.invalid:0 "The relic recorded at departure is no longer mine, or it already has all fragment upgrades. This work cannot be transferred to another relic. End the expedition without another trial or reward; invested costs are not refunded."
 rol_relic_fragment.0001.d:0 "End this fragment expedition."
 rol_relic_fragment.0001.d.flavor:0 "Establish whose work this is before repairing anything."
 rol_fragment_cancel_tt:0 "Close the original item's expedition without new stress or rewards. No refund; keep the decision cooldown."
 rol_fragment_masterwork_surplus_modifier:0 "Masterwork Excavation Surplus"
 rol_fragment_masterwork_surplus_modifier_desc:0 "Careful engineering during a fragment recovery yielded fine materials and workshop organization."
 rol_fragment_resonance_might_modifier:0 "Fragment Resonance: Martial Edge"
 rol_fragment_resonance_might_modifier_desc:0 "A newly fitted relic fragment sharpens its bearer's martial presence. Lasts five years and replaces previous fragment resonance."
 rol_fragment_resonance_wisdom_modifier:0 "Fragment Resonance: Ancient Inscriptions"
 rol_fragment_resonance_wisdom_modifier_desc:0 "Newly joined relic markings illuminate long-forgotten scholarship. Lasts five years and replaces previous fragment resonance."
 rol_fragment_resonance_court_modifier:0 "Fragment Resonance: Courtly Awe"
 rol_fragment_resonance_court_modifier_desc:0 "A restored legendary relic commands admiration across the court. Lasts five years and replaces previous fragment resonance."
