l_english:
 rol_relic_use.0001.t:0 "Put the Legend to Work"
 rol_relic_use.0001.desc:0 "Acquiring a relic is a beginning. I can arrange a purpose for a relic I own, or direct the Naxos training tradition. Each project costs 50 gold and takes six months before its results can be recorded or presented. Only one new project may begin per year. Leaving the choice makes no payment."
 rol_relic_use.cancel:0 "Make no new arrangement."
 rol_relic_use_ready_tt:0 "Requires adulthood, 50 gold, no pending project, and at least one year since the last project began."
 rol_relic_use.0004.t:0 "End an Arrangement"
 rol_relic_use.0004.1:0 "End the deployment of the Blade of Mars."
 rol_relic_use.0004.2:0 "End the deployment of the Star Sphere."
 rol_relic_use.0004.3:0 "End the deployment of the Astrolabe."
 rol_relic_use.0004.4:0 "End the deployment of the Mask."
 rol_relic_use.0004.5:0 "End the Naxos training plan."
 rol_relic_use.0004.desc:0 "Choose a relic deployment or training plan to end. Its purpose benefit is removed. Any pending six-month project for it is cancelled without results or a refund, and the project cooldown remains. Original relic and fragment benefits remain."
 rol_retire_relic_use_decision:0 "End a Relic Deployment"
 rol_retire_relic_use_decision_desc:0 "End a relic purpose or Naxos training arrangement early, cancelling its pending project."
 rol_retire_relic_use_decision_tooltip:0 "Remove the chosen purpose; retain original benefits. No refund or reward; retain the cooldown."
 rol_retire_relic_use_decision_confirm:0 "Choose an arrangement to end"
 rol_relic_use.0003.t:0 "New Work from an Old Legend"
 rol_relic_use.0003.desc.invalid:0 "The relic has changed hands, its purpose has changed, or the custodian tradition no longer supports this work. I should close the record rather than claim results from a different relic. There is no experience or prestige reward, and the cost is not refunded."
 rol_relic_use.0003.a:0 "Record the skills we learned."
 rol_relic_use.0003.b:0 "Present the results publicly."
 rol_relic_use.0003.c:0 "Leave the results to be reviewed later."
 rol_relic_use.0003.d:0 "Close the interrupted project."
 rol_relic_use_record_tt:0 "Gain 10 experience in the seeker track associated with this purpose, gaining the trait if needed. A matching personality loses 5 stress. Settle once; retain the current purpose."
 rol_relic_use_publish_tt:0 "Gain 100 prestige instead of expertise experience. Settle once; retain the current purpose."
 rol_relic_use_defer_tt:0 "Keep this project and reopen it with Review Relic Work. A new project cannot begin while this one is pending. No immediate reward."
 rol_arrange_relic_use_decision:0 "Arrange a Relic Purpose"
 rol_arrange_relic_use_decision_desc:0 "Choose a purpose for an owned relic or the custodian tradition, or review a matured project. Original relic and fragment benefits remain."
 rol_arrange_relic_use_decision_tooltip:0 "Open the purpose or results choice. New work costs 50 gold, at most once a year, and settles once after six months."
 rol_arrange_relic_use_decision_confirm:0 "Review the arrangement"
 rol_review_relic_use_decision:0 "Review Relic Work"
 rol_review_relic_use_decision_desc:0 "Choose a purpose for an owned relic or the custodian tradition, or review a matured project. Original relic and fragment benefits remain."
 rol_review_relic_use_decision_tooltip:0 "Open the purpose or results choice. New work costs 50 gold, at most once a year, and settles once after six months."
 rol_review_relic_use_decision_confirm:0 "Review the arrangement"
 rol_relic_use.0001.1:0 "Arrange the Blade of Mars."
 rol_relic_use.1001.t:0 "A Purpose for the Blade of Mars"
 rol_relic_use.1001.desc:0 "The blade can be more than proof of an old tale. Knights can drill around it, or sworn promises can be witnessed before it. Both arrangements require people and preparation; one must take precedence."
 rol_relic_use.1001.1:0 "Prepare knightly drills."
 rol_relic_use_1_field_modifier:0 "Blade of Mars: Prepare knightly drills"
 rol_relic_use_1_field_modifier_desc:0 "While equipped: knight effectiveness +5%. Replace the other purpose on this relic; its equipment benefit lasts until a purpose change or ownership transfer and does not apply while unequipped."
 rol_relic_use_mode_1_tt:0 "Pay 50 gold. While equipped: knight effectiveness +5%. Replace the other purpose on this relic; its equipment benefit lasts until a purpose change or ownership transfer and does not apply while unequipped. After six months choose 10 exploration experience (brave: lose 5 stress) or 100 prestige. No new project for one year; original benefits remain."
 rol_relic_use.0003.desc.1:0 "The work to prepare knightly drills with the Blade of Mars has produced records. Over six months, those involved have learned to organize their work and gathered results worth sharing. I can record the experience as exploration expertise or present the results publicly. The current purpose remains."
 rol_relic_use.1001.2:0 "Witness public oaths."
 rol_relic_use_1_oath_modifier:0 "Blade of Mars: Witness public oaths"
 rol_relic_use_1_oath_modifier_desc:0 "While equipped: general opinion +3. Replace the other purpose on this relic; its equipment benefit lasts until a purpose change or ownership transfer and does not apply while unequipped."
 rol_relic_use_mode_2_tt:0 "Pay 50 gold. While equipped: general opinion +3. Replace the other purpose on this relic; its equipment benefit lasts until a purpose change or ownership transfer and does not apply while unequipped. After six months choose 10 negotiation experience (just: lose 5 stress) or 100 prestige. No new project for one year; original benefits remain."
 rol_relic_use.0003.desc.2:0 "The work to witness public oaths with the Blade of Mars has produced records. Over six months, those involved have learned to organize their work and gathered results worth sharing. I can record the experience as negotiation expertise or present the results publicly. The current purpose remains."
 rol_relic_use.0001.2:0 "Arrange the Nibelung Star Sphere."
 rol_relic_use.1002.t:0 "A Purpose for the Nibelung Star Sphere"
 rol_relic_use.1002.desc:0 "The sphere rests between lamplight and written records. Scholars want to compare its markings with the sky, while attendants want visitors to see it. Quiet study and public display promise different results."
 rol_relic_use.1002.1:0 "Arrange sustained observation."
 rol_relic_use_2_study_modifier:0 "Nibelung Star Sphere: Arrange sustained observation"
 rol_relic_use_2_study_modifier_desc:0 "While equipped: learning lifestyle experience +5%. Replace the other purpose on this relic; its equipment benefit lasts until a purpose change or ownership transfer and does not apply while unequipped."
 rol_relic_use_mode_3_tt:0 "Pay 50 gold. While equipped: learning lifestyle experience +5%. Replace the other purpose on this relic; its equipment benefit lasts until a purpose change or ownership transfer and does not apply while unequipped. After six months choose 10 research experience (diligent: lose 5 stress) or 100 prestige. No new project for one year; original benefits remain."
 rol_relic_use.0003.desc.3:0 "The work to arrange sustained observation with the Nibelung Star Sphere has produced records. Over six months, those involved have learned to organize their work and gathered results worth sharing. I can record the experience as research expertise or present the results publicly. The current purpose remains."
 rol_relic_use.1002.2:0 "Receive visitors at a display."
 rol_relic_use_2_display_modifier:0 "Nibelung Star Sphere: Receive visitors at a display"
 rol_relic_use_2_display_modifier_desc:0 "While equipped: monthly prestige gain +5%. Replace the other purpose on this relic; its equipment benefit lasts until a purpose change or ownership transfer and does not apply while unequipped."
 rol_relic_use_mode_4_tt:0 "Pay 50 gold. While equipped: monthly prestige gain +5%. Replace the other purpose on this relic; its equipment benefit lasts until a purpose change or ownership transfer and does not apply while unequipped. After six months choose 10 negotiation experience (gregarious: lose 5 stress) or 100 prestige. No new project for one year; original benefits remain."
 rol_relic_use.0003.desc.4:0 "The work to receive visitors at a display with the Nibelung Star Sphere has produced records. Over six months, those involved have learned to organize their work and gathered results worth sharing. I can record the experience as negotiation expertise or present the results publicly. The current purpose remains."
 rol_relic_use.0001.3:0 "Arrange the Ocean Astrolabe."
 rol_relic_use.1003.t:0 "A Purpose for the Ocean Astrolabe"
 rol_relic_use.1003.desc:0 "The astrolabe belongs beside navigators, but it can also serve as a lesson for young scholars. I must choose whether to turn its scales into safer routes or teach others to read them."
 rol_relic_use.1003.1:0 "Calibrate routes for travel."
 rol_relic_use_3_navigation_modifier:0 "Ocean Astrolabe: Calibrate routes for travel"
 rol_relic_use_3_navigation_modifier_desc:0 "While equipped: travel speed +5% and travel safety +5. Replace the other purpose on this relic; its equipment benefit lasts until a purpose change or ownership transfer and does not apply while unequipped."
 rol_relic_use_mode_5_tt:0 "Pay 50 gold. While equipped: travel speed +5% and travel safety +5. Replace the other purpose on this relic; its equipment benefit lasts until a purpose change or ownership transfer and does not apply while unequipped. After six months choose 10 exploration experience (brave: lose 5 stress) or 100 prestige. No new project for one year; original benefits remain."
 rol_relic_use.0003.desc.5:0 "The work to calibrate routes for travel with the Ocean Astrolabe has produced records. Over six months, those involved have learned to organize their work and gathered results worth sharing. I can record the experience as exploration expertise or present the results publicly. The current purpose remains."
 rol_relic_use.1003.2:0 "Teach the astrolabe."
 rol_relic_use_3_teaching_modifier:0 "Ocean Astrolabe: Teach the astrolabe"
 rol_relic_use_3_teaching_modifier_desc:0 "While equipped: learning +1 and learning lifestyle experience +3%. Replace the other purpose on this relic; its equipment benefit lasts until a purpose change or ownership transfer and does not apply while unequipped."
 rol_relic_use_mode_6_tt:0 "Pay 50 gold. While equipped: learning +1 and learning lifestyle experience +3%. Replace the other purpose on this relic; its equipment benefit lasts until a purpose change or ownership transfer and does not apply while unequipped. After six months choose 10 research experience (diligent: lose 5 stress) or 100 prestige. No new project for one year; original benefits remain."
 rol_relic_use.0003.desc.6:0 "The work to teach the astrolabe with the Ocean Astrolabe has produced records. Over six months, those involved have learned to organize their work and gathered results worth sharing. I can record the experience as research expertise or present the results publicly. The current purpose remains."
 rol_relic_use.0001.4:0 "Arrange the Ash-Forged Mask."
 rol_relic_use.1004.t:0 "A Purpose for the Ash-Forged Mask"
 rol_relic_use.1004.desc:0 "The scars of the mask command fear, but they also speak of damage endured. It can stand as a public warning, or artisans can study how to preserve it and make its scars part of an understood history."
 rol_relic_use.1004.1:0 "Make it a symbol of authority."
 rol_relic_use_4_dread_modifier:0 "Ash-Forged Mask: Make it a symbol of authority"
 rol_relic_use_4_dread_modifier_desc:0 "While equipped: dread gain +5%. Replace the other purpose on this relic; its equipment benefit lasts until a purpose change or ownership transfer and does not apply while unequipped."
 rol_relic_use_mode_7_tt:0 "Pay 50 gold. While equipped: dread gain +5%. Replace the other purpose on this relic; its equipment benefit lasts until a purpose change or ownership transfer and does not apply while unequipped. After six months choose 10 negotiation experience (ambitious: lose 5 stress) or 100 prestige. No new project for one year; original benefits remain."
 rol_relic_use.0003.desc.7:0 "The work to make it a symbol of authority with the Ash-Forged Mask has produced records. Over six months, those involved have learned to organize their work and gathered results worth sharing. I can record the experience as negotiation expertise or present the results publicly. The current purpose remains."
 rol_relic_use.1004.2:0 "Support conservation research."
 rol_relic_use_4_restoration_modifier:0 "Ash-Forged Mask: Support conservation research"
 rol_relic_use_4_restoration_modifier_desc:0 "While equipped: stress loss +5%. Replace the other purpose on this relic; its equipment benefit lasts until a purpose change or ownership transfer and does not apply while unequipped."
 rol_relic_use_mode_8_tt:0 "Pay 50 gold. While equipped: stress loss +5%. Replace the other purpose on this relic; its equipment benefit lasts until a purpose change or ownership transfer and does not apply while unequipped. After six months choose 10 research experience (patient: lose 5 stress) or 100 prestige. No new project for one year; original benefits remain."
 rol_relic_use.0003.desc.8:0 "The work to support conservation research with the Ash-Forged Mask has produced records. Over six months, those involved have learned to organize their work and gathered results worth sharing. I can record the experience as research expertise or present the results publicly. The current purpose remains."
 rol_relic_use.0001.5:0 "Arrange the Naxos Custodian Tradition."
 rol_relic_use.1005.t:0 "A Purpose for the Naxos Custodian Tradition"
 rol_relic_use.1005.desc:0 "Recognition by the custodians lets me direct their tradition toward coordinated knightly drills or lessons drawn from veteran experience. This is a training arrangement; it creates no regiment."
 rol_relic_use.1005.1:0 "Train coordination among knights."
 rol_relic_use_5_field_modifier:0 "Naxos Custodian Tradition: Train coordination among knights"
 rol_relic_use_5_field_modifier_desc:0 "For three years: knight effectiveness +5%. Replace the other training plan; expire after three years. No regiment is created."
 rol_relic_use_mode_9_tt:0 "Pay 50 gold. For three years: knight effectiveness +5%. Replace the other training plan; expire after three years. No regiment is created. After six months choose 10 exploration experience (brave: lose 5 stress) or 100 prestige. No new project for one year; original benefits remain."
 rol_relic_use.0003.desc.9:0 "The work to train coordination among knights with the Naxos Custodian Tradition has produced records. Over six months, those involved have learned to organize their work and gathered results worth sharing. I can record the experience as exploration expertise or present the results publicly. The current purpose remains."
 rol_relic_use.1005.2:0 "Let veterans teach their experience."
 rol_relic_use_5_training_modifier:0 "Naxos Custodian Tradition: Let veterans teach their experience"
 rol_relic_use_5_training_modifier_desc:0 "For three years: martial lifestyle experience +5%. Replace the other training plan; expire after three years. No regiment is created."
 rol_relic_use_mode_10_tt:0 "Pay 50 gold. For three years: martial lifestyle experience +5%. Replace the other training plan; expire after three years. No regiment is created. After six months choose 10 exploration experience (diligent: lose 5 stress) or 100 prestige. No new project for one year; original benefits remain."
 rol_relic_use.0003.desc.10:0 "The work to let veterans teach their experience with the Naxos Custodian Tradition has produced records. Over six months, those involved have learned to organize their work and gathered results worth sharing. I can record the experience as exploration expertise or present the results publicly. The current purpose remains."
