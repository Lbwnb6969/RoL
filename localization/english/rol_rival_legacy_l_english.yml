l_english:
 rol_rival_context_lost_option:0 "Close this old encounter."
 rol_review_rival_pact_decision:0 "Resolve the Rival's Pact"
 rol_review_rival_pact_decision_desc:0 "Return to the agreement with your original rival. Each pact is resolved once; if the other party has died, the record closes without payment or reward."
 rol_review_rival_pact_decision_tooltip:0 "Reopen your unresolved agreement."
 rol_review_rival_pact_decision_confirm:0 "Review the pact"
 rol_rival_context_lost_flavor:0 "The journey or the person has changed; no reward or payment is due here."
 rol_rival.1000.t: "A Rival in the Ruins"
 rol_rival.1000.desc: "[rol_expedition_rival.GetTitledFirstName] catches up with the expedition and produces a competing account of the relic's resting place. Whether rival, partner, or fraud, [rol_expedition_rival.GetSheHe] cannot now be ignored."
 rol_rival.1000.a: "Share the trail, for a price."
 rol_rival.1000.a.flavor: "A divided discovery is better than an empty tomb."
 rol_rival.1000.b: "Settle precedence by force."
 rol_rival.1000.b.flavor: "Only one claimant will lead the next stage."
 rol_rival.1000.b.success: "You force your rival to yield and seize the best clues."
 rol_rival.1000.b.failure: "Your rival leaves you bloodied and your expedition loses ground."
 rol_rival.1000.c: "Examine the evidence."
 rol_rival.1000.c.flavor: "Ink, patina, and provenance betray more than words do."
 rol_rival.1000.c.success: "You expose the deception and retain the useful fragments."
 rol_rival.1000.c.failure: "The evidence convinces you; only later do you recognize the counterfeit."
 artifact_rol_counterfeit_blade_of_mars: "Imitation Blade of Mars"
 artifact_rol_counterfeit_blade_of_mars_desc: "A clever martial forgery whose metal and inscriptions fail close inspection."
 artifact_rol_counterfeit_nibelung_sphere: "False Nibelung Sphere"
 artifact_rol_counterfeit_nibelung_sphere_desc: "A handsome celestial mechanism assembled long after the legends it claims."
 artifact_rol_counterfeit_astrolabe: "Counterfeit Ocean Astrolabe"
 artifact_rol_counterfeit_astrolabe_desc: "Its engraved seas are persuasive, but its measurements are useless."
 artifact_rol_counterfeit_ash_mask: "Gilded Punic Mask"
 artifact_rol_counterfeit_ash_mask_desc: "A funerary mask aged with smoke and sold as Carthage's legendary relic."
 artifact_rol_counterfeit_naxos_token: "Broken Naxian Command Token"
 artifact_rol_counterfeit_naxos_token_desc: "A fabricated badge of command bearing invented legionary marks."
 rol_relic_legacy.0001.t: "The Relic's Demand"
 rol_relic_legacy.0001.desc: "[rol_legacy_artifact.GetName] has become more than a possession. Courtiers now expect its bearer to live according to the legend attached to it."
 rol_relic_legacy.0001.a: "I will embody its legend."
 rol_relic_legacy.0001.a.flavor: "A legendary burden is still a source of authority."
 rol_relic_legacy.0001.b: "Legends must serve their bearer."
 rol_relic_legacy.0001.b.flavor: "Reverence need not become submission."
 rol_relic_legacy.0002.t: "Hands Upon a Legend"
 rol_relic_legacy.0002.desc: "Experts ask permission to study [rol_legacy_artifact.GetName]. Their work may magnify its fame, but every hand upon it feels like a risk."
 rol_relic_legacy.0002.a: "Fund a careful examination."
 rol_relic_legacy.0002.a.flavor: "Knowledge will make the relic's story harder to dispute."
 rol_relic_legacy.0002.b: "Seal it away from curious hands."
 rol_relic_legacy.0002.b.flavor: "Some mysteries lose power when measured."
 rol_relic_legacy.0003.t: "A Legend Chooses Again"
 rol_relic_legacy.0003.desc: "[rol_legacy_artifact.GetName] has passed into your keeping. The old owner's story clings to it, but the court already watches for the mark you will leave."
 rol_relic_legacy.0003.a: "Its next legend begins with me."
 rol_relic_legacy.0003.a.flavor: "Possession is only the first test of mastery."
 rol_relic_legacy.0003.a.legacy: "A long-lived legacy adds 100 dynasty prestige."
 rol_relic_legacy.0101.t: "The Naxian Review"
 rol_relic_legacy.0101.desc: "The oath-guard assembles for inspection. Veterans demand that its discipline remain worthy of the tradition you recovered."
 rol_relic_legacy.0101.a: "Spare no expense on readiness."
 rol_relic_legacy.0101.a.flavor: "Legendary discipline is purchased in sweat and silver."
 rol_relic_legacy.0101.b: "Keep the old forms unchanged."
 rol_relic_legacy.0101.b.flavor: "Continuity itself carries authority."
 rol_relic_legacy.0102.t: "The Veterans' Petition"
 rol_relic_legacy.0102.desc: "Senior oath-guards ask to recruit and equip a new cadre. Expansion promises glory, but risks diluting their hard-won standards."
 rol_relic_legacy.0102.a: "Raise a new cadre."
 rol_relic_legacy.0102.a.flavor: "A living tradition must grow."
 rol_relic_legacy.0102.b: "Remain few, and remain peerless."
 rol_relic_legacy.0102.b.flavor: "Their scarcity is part of their power."
 rol_relic_legacy.0103.t: "The Oath Outlives Its Bearer"
 rol_relic_legacy.0103.desc: "The Naxian veterans survived [rol_naxos_predecessor.GetTitledFirstName]. They will swear anew only to an heir with the means and martial standing to preserve their tradition."
 rol_expedition_cooperation_opinion: "Cooperation on an Expedition"
 rol_relic_legacy.0103.a: "I accept the oath and its burden."
 rol_relic_legacy.0103.a.flavor: "Gold and renown will bind the old guard to a new reign."
 rol_relic_legacy.0103.b: "Let the old oath end with honor."
 rol_relic_legacy.0103.b.flavor: "Not every inheritance should be claimed."

  rol_rival.1001.t: "The Rival's Price"
  rol_rival.1001.desc: "Your rival offers a pact: shared maps, shared credit, and a promise that neither side will sabotage the next chamber. The price will shape how this expedition is remembered."
  rol_rival.1001.a: "Pay for a lasting pact."
  rol_rival.1001.a.flavor: "A small purse can purchase years of safer expeditions."
  rol_rival.1001.b: "Take the credit for yourself."
  rol_rival.1001.b.flavor: "A rival who helped you can still be made into a footnote."
  rol_rival.1001.c: "Leave the pact to rest."
  rol_rival.1001.c.flavor: "Respect is safer than promises neither court can enforce."
  rol_relic_legacy.0003.b: "Keep the relic's transfer quiet."
  rol_relic_legacy.0003.b.flavor: "A hidden inheritance is harder to challenge."
  rol_relic_legacy.0003.c: "Entrust it to scholars."
  rol_relic_legacy.0003.c.flavor: "A measured legacy can outlive a single court."
 rol_relic_legacy.0003.c.legacy: "Repeated transfers give the scholars another century of questions."
 rol_relic_legacy.0003.d:0 "This record is no longer valid; close it."
 rol_relic_legacy.0003.d.flavor:0 "Another holder's relic cannot keep earning my court new credit."

 rol_legacy_unavailable_option:0 "Close this matter"
 rol_legacy_unavailable_flavor:0 "The former owner, qualification, or agreement is no longer available."
 rol_rival.1000.e:0 "Feed them false coordinates and let them spring the traps."
 rol_rival.1000.e.flavor:0 "If they are so eager to lead, let them test the first stone."
 rol_rival.1000.e.success:0 "Your rival takes the bait and unwittingly clears a hazardous passage for your party."
 rol_rival.1000.e.failure:0 "Your rival sees through the ruse and disrupts your baggage train in retaliation."
 rol_rival.1001.d:0 "Induct them as a trusted expedition partner."
 rol_rival.1001.d.flavor:0 "Anyone who can match us in the deep ruins belongs on our side next time (pay 75 gold, make them your Trusted Companion and gain 10 Negotiation XP)."
 rol_harmonize_relics_decision:0 "Harmonize Legendary Relics"
 rol_harmonize_relics_decision_desc:0 "Holding two or more legendary relics (or a relic alongside the Naxian custodian tradition) allows my scholars and veterans to study their shared design and establish a ten-year resonance doctrine."
 rol_harmonize_relics_decision_tooltip:0 "Spend 100 gold to open the Symphony of the Ancients resonance choice based on your held relics (10-year composite modifier and 15 Relic Seeker XP)."
 rol_harmonize_relics_decision_confirm:0 "Begin the harmonization"
 rol_relic_legacy.0010.t:0 "Symphony of the Ancients"
 rol_relic_legacy.0010.desc:0 "Two legends once sundered across distant lands now answer one another beneath the same roof. The hum of ancient metal, the scales of celestial charts, and immortal martial discipline converge into a pattern no single relic could reveal alone."
 rol_relic_legacy.0010.desc.invalid:0 "The required combination of relics is no longer in my keeping; the harmonization must be set aside."
 rol_relic_legacy.0010.a:0 "Bind Iron and Ash: Proclaim Imperial Might."
 rol_relic_legacy.0010.a.flavor:0 "The war-god's blade and ancient martial dread merge into an unstoppable vanguard."
 rol_relic_legacy.0010.a.tt:0 "Requires the Blade of Mars plus either the Ash-Forged Mask or the Naxos Custodian Tradition. Gain the 10-year Imperial Might Resonance modifier, 120 prestige, and 15 Exploration XP."
 rol_relic_legacy.0010.b:0 "Align Firmament and Tides: Chart the Cosmos."
 rol_relic_legacy.0010.b.flavor:0 "The subterranean star-sphere and the oceanic astrolabe are two halves of one grand instrument."
 rol_relic_legacy.0010.b.tt:0 "Requires both the Nibelung Star Sphere and the Ocean Astrolabe. Gain the 10-year Cosmic Chart Resonance modifier, 150 learning lifestyle XP, and 15 Research XP."
 rol_relic_legacy.0010.c:0 "Display the Gathered Relics: Command Sovereign Awe."
 rol_relic_legacy.0010.c.flavor:0 "One relic may be fortune; two legends together are an undeniable mandate."
 rol_relic_legacy.0010.c.tt:0 "Gain the 10-year Sovereign Awe Resonance modifier, 150 prestige, lose 15 stress, and gain 15 Negotiation XP."
 rol_resonance_imperial_might_modifier:0 "Relic Resonance: Imperial Might"
 rol_resonance_imperial_might_modifier_desc:0 "The Blade of Mars resonates with ancient martial regalia, inspiring knights and terrifying foes. Lasts ten years and replaces other relic resonances. Once learned, the doctrine lasts until expiry even if the relics change hands."
 rol_resonance_cosmic_chart_modifier:0 "Relic Resonance: Cosmic Chart"
 rol_resonance_cosmic_chart_modifier_desc:0 "The Nibelung Star Sphere and Ocean Astrolabe align to unite celestial and maritime mastery. Lasts ten years and replaces other relic resonances. Once learned, the doctrine lasts until expiry even if the relics change hands."
 rol_resonance_sovereign_awe_modifier:0 "Relic Resonance: Sovereign Awe"
 rol_resonance_sovereign_awe_modifier_desc:0 "Multiple legendary relics displayed in harmony command reverence throughout the realm. Lasts ten years and replaces other relic resonances. Once learned, the doctrine lasts until expiry even if the relics change hands."
