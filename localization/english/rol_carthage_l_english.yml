 rol_relic_discovery.1600.t:0 "The Ash-Temple Beneath the Salt"
 rol_relic_discovery.1600.desc:0 "A rare sandstorm outside Tunis strips away layers of cursed salt and reveals the upper vaults of a half-buried temple near Qartajana. Survivors speak of star-cold ash, ghostly war-elephants, and a golden face hidden where Carthage made its last vow against oblivion."
 rol_relic_discovery.1600.a:0 "Prepare a black-sand expedition."

 rol_ash_forged_mask:0 "Ash-Forged Mask of Carthage"
 rol_ash_forged_mask_desc:0 "Gold and ruin were fused together beneath a desert sky that watched Carthage die. The metal keeps the scent of ash and the chill of starlit sand."
 artifact_rol_ash_forged_mask:0 "Ash-Forged Mask of Carthage"
 artifact_rol_ash_forged_mask_desc:0 "Cold as midnight desert air, the mask carries the discipline of a doomed city that refused to kneel."

 rol_quest_carthage.0990.t:0 "At the Edge of the Black Sand"
 rol_quest_carthage.0990.desc:0 "By the time your expedition reaches the storm-torn ridge beyond Qartajana, night has already swallowed the horizon. Salt dust turns in the wind like pale smoke, and black sand settles in the seams of armor, cloth, and prayer alike. Beneath the broken lip of the buried sanctuary lies a silence so complete that even veterans begin to whisper, as if the ruins themselves were listening for the first name bold enough to enter."
 rol_quest_carthage.0990.a:0 "We enter before the desert closes over it again."
 rol_quest_carthage.0990.a.flavor:0 "Commit the expedition before wind and fear can close the path."

 rol_quest_carthage.1000.t:0 "Through the Night Sand"
 rol_quest_carthage.1000.desc:0 "No road survives in this desert after dark. The dunes move like slow black water, stars sharpen overhead like cold needles, and each landmark seems to exist only until you dare to look away. If you fail to seize the true bearing before dawn, the storm-stripped temple will sink back into cursed salt and shifting ash, leaving you with nothing but dead men and a story no one will believe."
 rol_quest_carthage.1000.a:0 "Hire Bedouin star-guides to read the dunes."
 rol_quest_carthage.1000.b:0 "Trust scholars of ancient Semitic star-lore."
 rol_quest_carthage.1000.c:0 "Turn back before the desert swallows us."
 rol_quest_carthage.1000.a.base_tt:0 "[diplomacy|E] check."
 rol_quest_carthage.1000.b.base_tt:0 "[learning|E] check."
 rol_quest_carthage.1000.c.tt:0 "You abort the expedition. 2-year cooldown."
 rol_quest_carthage.1000.a.tt.success:0 "#P Success:#! The desert yields a hidden route, and your column reaches the buried threshold before the dunes shift shut."
 rol_quest_carthage.1000.a.tt.failure:0 "#N Failure:#! False bearings and black sand break the column apart before the sanctuary is found.\n#N The expedition ends immediately and enters a 2-year cooldown.#!"
 rol_quest_carthage.1000.b.tt.success:0 "#P Success:#! Ancient sky-lore fixes the temple's true bearing, and the expedition reaches the vault in time."
 rol_quest_carthage.1000.b.tt.failure:0 "#N Failure:#! The heavens are misread, and the desert consumes both time and order.\n#N The expedition ends immediately and enters a 2-year cooldown.#!"
 rol_quest_carthage.1000.a.flavor:0 "Trust living masters of dune, wind, and starlight."
 rol_quest_carthage.1000.b.flavor:0 "Let old calendars and forbidden skies do what courage alone cannot."
 rol_quest_carthage.1000.c.flavor:0 "Break off while the desert still permits it."

 rol_quest_carthage.1010.t:0 "The Way Holds"
 rol_quest_carthage.1010.desc:0 "Against the logic of the waste, the night yields. A chain of half-buried markers, almost erased by ash and salt, leads your column between dunes that part only for a moment. When the temple threshold finally rises out of the black sand, even the hardest among you feel that this was not mere navigation, but admission."
 rol_quest_carthage.1010.a:0 "Press on."
 rol_quest_carthage.1010.a.flavor:0 "Use the opening before the desert erases it."

 rol_quest_carthage.1011.t:0 "Lost in the Black Dunes"
 rol_quest_carthage.1011.desc:0 "The desert does not devour you all at once. It does it by degrees: one false bearing, one lost torch, one order swallowed by wind, one line of people drifting out of place and never fully returning. By the time you recognize how badly the march has frayed, continuing would mean surrendering the expedition to a darkness vast enough to erase even memory."
 rol_quest_carthage.1011.a:0 "End the attempt."
 rol_quest_carthage.1011.a.flavor:0 "Accept the desert's refusal and save who you can."

 rol_quest_carthage.1012.t:0 "The Desert Left Unanswered"
 rol_quest_carthage.1012.desc:0 "You order the retreat before the night can close completely around the expedition. No one argues. By dawn the dunes have already smoothed over your track, and the cursed salt has taken the last proof that living hands ever came this close."
 rol_quest_carthage.1012.a:0 "We return later."
 rol_quest_carthage.1012.a.flavor:0 "Preserve the expedition's strength for another season."

 rol_quest_carthage.1002.t:0 "Ash and Elephant Shadows"
 rol_quest_carthage.1002.desc:0 "The deeper chambers of the temple are not guarded by stone alone. Dead ash hangs in the air, and impossible starlight spills through cracks that should not exist beneath so much earth. Those who breathe too deeply begin to see Carthage's last war unfold around them: vast silent elephants under a black sky, shattered standards, commanders who know they cannot win and yet advance anyway. The ruin does not ask whether you understand their grief. It asks whether your will can survive it."
 rol_quest_carthage.1002.a:0 "Break the vision with iron command."
 rol_quest_carthage.1002.b:0 "Appease the dead through awe and star-lore."
 rol_quest_carthage.1002.c:0 "Retreat before the visions become us."
 rol_quest_carthage.1002.a.base_tt:0 "[martial|E] / [prowess|E] check."
 rol_quest_carthage.1002.b.base_tt:0 "[learning|E] / [piety_level|E] check."
 rol_quest_carthage.1002.c.tt:0 "You abort the expedition. 2-year cooldown."
 rol_quest_carthage.1002.a.tt.success:0 "#P Success:#! Your will cuts through the war-visions, and the temple's deeper chamber opens to you."
 rol_quest_carthage.1002.a.tt.failure:0 "#N Failure:#! The dead war-memory tears discipline apart and drives the expedition into collapse.\n#N The expedition ends immediately and enters a 2-year cooldown.#!"
 rol_quest_carthage.1002.b.tt.success:0 "#P Success:#! Reverence and understanding settle the old anguish, and the sanctuary permits one step more."
 rol_quest_carthage.1002.b.tt.failure:0 "#N Failure:#! The ash remembers only defeat, and the temple answers with panic and ruin.\n#N The expedition ends immediately and enters a 2-year cooldown.#!"
 rol_quest_carthage.1002.a.flavor:0 "Break the war-memory before it spreads through the living."
 rol_quest_carthage.1002.b.flavor:0 "Answer the dead as witness and interpreter, not as prey."
 rol_quest_carthage.1002.c.flavor:0 "Leave before the dead city claims your living minds."

 rol_quest_carthage.1020.t:0 "The Ash Recedes"
 rol_quest_carthage.1020.desc:0 "The charge of phantom elephants thins into a far-off vibration, like thunder heard through a sealed tomb. In the hardening cold, a cleaner beam of starlight finds the inner dais beyond the ash haze. Whatever the sanctuary has guarded since Carthage's fall is no longer hidden from you?only defended by the last measure of its grief."
 rol_quest_carthage.1020.a:0 "Advance."
 rol_quest_carthage.1020.a.flavor:0 "Use the recovered calm to push into the sanctum's heart."

 rol_quest_carthage.1021.t:0 "The Dead Charge Wins"
 rol_quest_carthage.1021.desc:0 "The ash is no longer memory but momentum. It turns panic into command, command into terror, and terror into collapse. Your people begin yielding to a dead army's last impossible charge, and you realize too late that the ruin has nearly taught them how to die instead of how to endure."
 rol_quest_carthage.1021.a:0 "Pull everyone out."
 rol_quest_carthage.1021.a.flavor:0 "Call the expedition off before the ruins finish the work."

 rol_quest_carthage.1022.t:0 "Withdraw from the Sanctuary"
 rol_quest_carthage.1022.desc:0 "You break off the descent while enough discipline still remains to make withdrawal possible. No one mistakes the retreat for safety. The sanctuary lets you leave, but only with the grim understanding that it did not yield?only choose not to kill you here and now."
 rol_quest_carthage.1022.a:0 "Enough."
 rol_quest_carthage.1022.a.flavor:0 "Preserve command by ending the attempt on your own terms."

 rol_quest_carthage.1050.t:0 "A Voice by the Dais"
 rol_quest_carthage.1050.desc:0 "At the edge of the final chamber, the column halts around a dais dusted in black ash and glittering salt. One invited companion urges a measured pause to steady breath, ranks, and nerve before the last approach. Another, staring into the cold shaft of light above the sanctuary, warns that ruins like this feed on hesitation, and that every moment spent gathering courage may be one more moment in which the temple gathers its own."
 rol_quest_carthage.1050.a:0 "We steady ourselves first."
 rol_quest_carthage.1050.b:0 "No delays. We take the moment now."
 rol_quest_carthage.1050.a.flavor:0 "Restore order before asking the sanctuary for its final answer."
 rol_quest_carthage.1050.b.flavor:0 "Deny the ruin time to close its grip again."

 rol_quest_carthage.1001.t:0 "The Ash-Forged Mask"
 rol_quest_carthage.1001.desc:0 "A single spear of star-cold light falls through the cracked vault and fixes upon a weathered stone dais. There, amidst fused gold, dead ash, and the lingering smell of a city burned into legend, rests the face carried into the desert when Carthage chose ruin over surrender. Even before you touch it, the mask feels less like treasure than like a command that survived its makers."
 rol_quest_carthage.1001.desc.tier_4:0 "When your fingers close over the gold, the sanctuary does not resist. The bitter cold within the mask bends instead of breaking you, and the grief of a lost power settles into something harder: discipline, command, and the terrible calm of a city that met extinction standing upright. Hannibal's unfinished defiance does not possess you. It recognizes you."
 rol_quest_carthage.1001.desc.below_tier4:0 "The moment you touch the gold, winter seizes your hand and spreads through the marrow. The sanctuary's last vow refuses to break for you. All that remains is to stagger back from the dais knowing you reached the truth, yet proved unequal to mastering it."
 rol_quest_carthage.1001.a:0 "Let the old Mediterranean remember."
 rol_quest_carthage.1001.a.tt:0 "If the final trial yields, you claim the mask. Otherwise the expedition fails and enters a 2-year cooldown."
 rol_quest_carthage.1001.a.flavor:0 "Take the final answer by hand, or be refused by it."

 rol_quest_carthage.1090.t:0 "Black-Sand Expedition Summary"
 rol_quest_carthage.1090.desc.success_4.standard:0 "You crossed black sand, ghost-memory, and the last oath of a dead empire, then returned carrying the answer hidden beneath Carthage's ashes. No one who sees what you brought back will mistake the expedition for mere plunder; it was conquest.\n\n$EFFECT_LIST_BULLET$Gained relic: #P $artifact_rol_ash_forged_mask$#!\n$EFFECT_LIST_BULLET$Gained #P +320#! [prestige|E]\n$EFFECT_LIST_BULLET$Gained #P +140#! [piety|E]\n$EFFECT_LIST_BULLET$No extra triumph bonus came from expedition preparation"
 rol_quest_carthage.1090.desc.success_4.high:0 "You crossed black sand, ghost-memory, and the last oath of a dead empire, then returned carrying the answer hidden beneath Carthage's ashes. No one who sees what you brought back will mistake the expedition for mere plunder; it was conquest.\n\n$EFFECT_LIST_BULLET$Gained relic: #P $artifact_rol_ash_forged_mask$#!\n$EFFECT_LIST_BULLET$Gained #P +320#! [prestige|E]\n$EFFECT_LIST_BULLET$Gained #P +140#! [piety|E]\n$EFFECT_LIST_BULLET$Gained #P +150#! [prestige|E] and #P +25#! [dynasty_prestige|E] from high preparation"
 rol_quest_carthage.1090.desc.success_4.supreme:0 "You crossed black sand, ghost-memory, and the last oath of a dead empire, then returned carrying the answer hidden beneath Carthage's ashes. No one who sees what you brought back will mistake the expedition for mere plunder; it was conquest.\n\n$EFFECT_LIST_BULLET$Gained relic: #P $artifact_rol_ash_forged_mask$#!\n$EFFECT_LIST_BULLET$Gained #P +320#! [prestige|E]\n$EFFECT_LIST_BULLET$Gained #P +140#! [piety|E]\n$EFFECT_LIST_BULLET$Gained #P +350#! [prestige|E] and #P +50#! [dynasty_prestige|E] from supreme preparation"
 rol_quest_carthage.1090.desc.success_3:0 "You forced the buried sanctuary farther open than most living minds could have endured. Even without absolute mastery, the expedition has already begun to reshape how the tale of Carthage will be told."
 rol_quest_carthage.1090.desc.success_2:0 "You held the column together through salt, ash, and war-visions, and came back with proof that the legend beneath the desert was no invention. The victory is incomplete, but real."
 rol_quest_carthage.1090.desc.success_1:0 "You escaped the black-sand descent with something more than rumor, though only barely. Even now, the expedition feels less like a triumph than a reprieve granted by ruins with long memories."
 rol_quest_carthage.1090.desc.failure:0 "The black-sand expedition broke against the desert and the ash-temple beneath it. The corps will need two full years before anyone can be asked to test that buried vow again."
 rol_quest_carthage.1090.desc.fallback:0 "The Tunis expedition has ended."
 rol_quest_carthage.1090.a:0 "Record the outcome."
 rol_quest_carthage.1090.a.flavor:0 "Commit the expedition's outcome to record."

 activity_rol_seek_ash_forged_mask:0 "Ash-Forged Mask Expedition"
 activity_rol_seek_ash_forged_mask_desc:0 "Cross the black sands outside Tunis, follow storm-bared omens into a buried Carthaginian sanctuary, and force an answer from the last vow carried out into the desert when the city burned."
 activity_rol_seek_ash_forged_mask_host_desc:0 "$BULLET_WITH_TAB$Adjust your outlay through the $rol_option_expedition_preparation$ activity option\n$BULLET_WITH_TAB$Failure ends the expedition and applies a 2-year cooldown"
 activity_rol_seek_ash_forged_mask_guest_desc:0 ""
 activity_rol_seek_ash_forged_mask_conclusion_desc:0 "The dunes cover the outer scar once more, but the buried temple has already answered you."
 activity_rol_seek_ash_forged_mask_conclusion_desc_success_4:0 "You conquered the temple's deepest refusal and claimed its hidden answer."
 activity_rol_seek_ash_forged_mask_conclusion_desc_success_3:0 "You came close to full mastery over the buried vow beneath the ash."
 activity_rol_seek_ash_forged_mask_conclusion_desc_success_2:0 "You held the expedition together and forced a partial answer from the temple."
 activity_rol_seek_ash_forged_mask_conclusion_desc_success_1:0 "You survived the black sand, but only by the narrowest margin."
 activity_rol_seek_ash_forged_mask_conclusion_desc_failure:0 "You were forced to withdraw. Two-year cooldown."
 activity_rol_seek_ash_forged_mask_conclusion_desc_fallback:0 "The expedition has concluded."
 activity_rol_seek_ash_forged_mask_selection_tooltip:0 "Lead an expedition from Tunis into storm-stripped black sands, buried vows, and a temple that answers only to absolute resolve.\n\nFailure ends the expedition and applies a 2-year cooldown."
 activity_rol_seek_ash_forged_mask_predicted_cost:0 "The expedition's cost depends heavily on the personnel and equipment grade you select."
 activity_rol_seek_ash_forged_mask_province_desc:0 "Target location: [ROOT.Province.GetName]"

