l_english:
 rol_alexandria_archive_decision:0 "Seek Alexandria's Lost Records"
 rol_alexandria_archive_decision_desc:0 "Damaged ledgers have surfaced beneath the harbor warehouses. They may reveal forgotten trade routes."
 rol_alexandria_archive_decision_tooltip:0 "Investigate the harbor records; restoring them costs 100 gold."
 rol_alexandria_archive_decision_confirm:0 "Investigate"
 rol_jerusalem_watch_decision:0 "Seek Jerusalem's Old Road Watch"
 rol_jerusalem_watch_decision_desc:0 "Pilgrims speak of an old watch that guarded the mountain roads, whose drills survive in a ruined fort."
 rol_jerusalem_watch_decision_tooltip:0 "Find the watch's training records; restoring its tradition costs 100 gold."
 rol_jerusalem_watch_decision_confirm:0 "Find the fort"
 rol_new_sites.0001.t:0 "Ledgers Beneath the Harbor"
 rol_new_sites.0001.desc:0 "Water has seeped into a warehouse foundation, exposing a chest of old ledgers in a sealed cellar. The goods are difficult to read, but the marks of merchants and docks remain. The harbor master believes restoring the records will help traders find reliable partners again, if I fund scribes and repairs."
 rol_new_sites.0001.a:0 "Fund the work and restore the harbor's trade."
 rol_new_sites.0010.t:0 "The Fort on the Old Road"
 rol_new_sites.0010.desc:0 "The ruined fort holds no legendary gold. Its storeroom contains training boards, shield-wall diagrams and the watch's old rolls. If I hire local veterans to teach their methods, I can restore the watch."
 rol_new_sites.0010.a:0 "Gather the veterans and restore the road watch."
 rol_new_sites.leave:0 "Leave this for another time."
 rol_alexandria_archive_modifier:0 "Restored Harbor Records"
 rol_alexandria_archive_modifier_desc:0 "Restored ledgers help merchants renew their trade connections. Lasts twenty years."
 rol_jerusalem_watch:0 "Holy City Road Watch"
 rol_jerusalem_recruitment_unlock_tt:0 "Unlock personal recruitment of Holy City Road Watch. Recruitment costs gold and uses a men-at-arms slot. Lieges cannot borrow this qualification, and heirs do not automatically receive it."
 rol_jerusalem_watch_flavor:0 "These heavy infantry follow the shield-wall drills of the old fort's defenders, guarding the roads to the holy city."
