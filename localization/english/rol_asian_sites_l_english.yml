l_english:
 rol_hangzhou_site_decision:0 "Hangzhou: Seek the Water Map"
 rol_hangzhou_site_decision_desc:0 "Workers on the lakeshore have uncovered carved fragments showing old waterways."
 rol_hangzhou_site_decision_tooltip:0 "Investigate the water map; restoring the channels costs 100 gold."
 rol_hangzhou_site_decision_confirm:0 "Seek the map"
 rol_asian_sites.0100.t:0 "Stones Beneath the Lake"
 rol_asian_sites.0100.desc:0 "A carved stone emerges from the mud by the lake, its fine lines converging on a broken edge. Some call it a treasure map; an old fisher recognizes a silted channel, once controlled by a gate. The missing half may reveal where that gate stood."
 rol_asian_sites.0100.a:0 "Follow the old channel."
 rol_asian_sites.0101.t:0 "The Gate and the Ledger"
 rol_asian_sites.0101.desc:0 "The joined stones lead us to a gate buried in silt. A damaged roster wedged in the masonry records a shared duty: villages cleared the channel in turn and paid together when its boards broke. There is no gold here, but a way for fields and lake to coexist.\n\nRepairing the gate and channels will support Hangzhou's development and taxes for twenty years. Publishing the plans instead will bring me prestige."
 rol_asian_sites.0102.t:0 "A Channel Between Two Villages"
 rol_asian_sites.0102.desc:0 "The missing stone serves as a bridge foundation. Villagers on both sides claim the old channel: upstream needs water for fields, while downstream fears flooded mulberry groves. Each remembers only part of an old agreement, and neither will move the stone first.\n\nI can pay their elders to survey the ground together, or compare the water levels and slopes myself until both sides see the same old waterline."
 rol_asian_sites.0102.a:0 "Pay the elders to survey together."
 rol_asian_sites.0102.b:0 "Compare the waterlines myself."
 rol_asian_sites.0101.a:0 "Restore the waterways."
 rol_asian_sites.0101.b:0 "Preserve and publish the plans."
 rol_hangzhou_waterways:0 "Restored Hangzhou Waterways"
 rol_hangzhou_waterways_desc:0 "Reopened gates and channels support local development for twenty years."
 rol_yamashiro_site_decision:0 "Yamashiro: Seek the Mountain Archers"
 rol_yamashiro_site_decision_desc:0 "An old training ground by a mountain road may preserve the tradition of a band of archers."
 rol_yamashiro_site_decision_tooltip:0 "Find their training records; restoring the tradition costs 100 gold."
 rol_yamashiro_site_decision_confirm:0 "Visit the mountain road"
 rol_asian_sites.0200.t:0 "Targets in the Woods"
 rol_asian_sites.0200.desc:0 "Arrow marks remain on vine-covered targets. Locals tell of archers who guarded the road and point to their old meeting place."
 rol_asian_sites.0200.a:0 "Seek the watch's records."
 rol_asian_sites.0201.t:0 "The Roadkeepers' Agreement"
 rol_asian_sites.0201.desc:0 "A chest contains training records and an agreement to maintain the road. Veterans will train new archers if I restore their grounds; I can also publish the records."
 rol_asian_sites.0201.a:0 "Restore the grounds and recruit the archers."
 rol_asian_sites.0201.b:0 "Publish the records and honor the watch."
 rol_asian_sites.0202.t:0 "The Bridge Agreement"
 rol_asian_sites.0202.desc:0 "The bridge to the meeting place is missing several boards. Locals will help, but insist their ancestors did more than fight for a lord: they protected travelers and maintained the bridge together. I can pay for repairs or lead my retinue across a ford myself."
 rol_asian_sites.0202.a:0 "Hire workers to repair the bridge."
 rol_asian_sites.0202.b:0 "Find a ford myself."
 rol_angkor_site_decision:0 "Angkor: Seek the Reservoir Keepers"
 rol_angkor_site_decision_desc:0 "An inscription beside an old reservoir records duties for maintaining the channels."
 rol_angkor_site_decision_tooltip:0 "Investigate the inscription; repairs cost 100 gold."
 rol_angkor_site_decision_confirm:0 "Visit the reservoir"
 rol_asian_sites.0300.t:0 "The Inscription by the Water"
 rol_asian_sites.0300.desc:0 "The damaged inscription lists villages responsible for the banks. With the rains approaching, villagers show me an inlet blocked by roots."
 rol_asian_sites.0300.a:0 "Follow the channel."
 rol_asian_sites.0301.t:0 "Before the Rains"
 rol_asian_sites.0301.desc:0 "An abandoned gate stands at the end of the channel. Repairing it takes money and labor, but will support cultivation; I can instead copy the inscription and preserve its knowledge."
 rol_asian_sites.0301.a:0 "Repair the gate."
 rol_asian_sites.0301.b:0 "Copy and publish the inscription."
 rol_asian_sites.0302.t:0 "The Approaching Rains"
 rol_asian_sites.0302.desc:0 "Roots block the inlet and muddy water spills over the bank. Each village has fields to tend, but none can protect the channel alone. Their elders propose clearing it together, provided someone first supplies tools and food. I can fund the work or survey the bank myself."
 rol_asian_sites.0302.a:0 "Fund tools and food."
 rol_asian_sites.0302.b:0 "Survey the bank myself."
 rol_angkor_reservoir:0 "Restored Angkor Channels"
 rol_angkor_reservoir_desc:0 "Cleared channels support fields and local development for twenty years."
 rol_baghdad_site_decision:0 "Baghdad: Trace the Scattered Manuscript"
 rol_baghdad_site_decision_desc:0 "A bookseller has found fragments whose annotations suggest they once belonged to one work."
 rol_baghdad_site_decision_tooltip:0 "Investigate the fragments; editing them costs 100 gold."
 rol_baghdad_site_decision_confirm:0 "Visit the bookseller"
 rol_asian_sites.0400.t:0 "Clues in the Leaves"
 rol_asian_sites.0400.desc:0 "The leaves bear different hands but cite the same observations. The bookseller knows where another fragment is kept and offers to guide me."
 rol_asian_sites.0400.a:0 "Trace the remaining fragments."
 rol_asian_sites.0401.t:0 "Fragments Reunited"
 rol_asian_sites.0401.desc:0 "The copies do not agree: their scribes left corrections of their own. Funding scholars to compare them offers a chance to learn; publishing them will let others read them."
 rol_asian_sites.0401.a:0 "Fund comparison and study."
 rol_asian_sites.0401.b:0 "Publish the fragments."
 rol_asian_sites.0402.t:0 "Two Catalogues"
 rol_asian_sites.0402.desc:0 "The library has two catalogues with different numbers. After a move, one keeper arranged the books by author, another by subject. The missing leaves may be shelved among the wrong volumes. I can hire scribes to compare both catalogues or search the shelves myself."
 rol_asian_sites.0402.a:0 "Hire scribes to compare the catalogues."
 rol_asian_sites.0402.b:0 "Examine the volumes myself."
 rol_asian_sites.leave:0 "Leave for now."
 rol_asian_sites.epilogue_close:0 "Record this journey in the archives."
 rol_asian_sites.0103.t:0 "The Water Map's Legacy"
 rol_asian_sites.0103.restored:0 "The gate rises and clear water follows the old channel to the fields. Both villages record the survey and agree to clear the channel in turn.\n\nHangzhou gains +35% development growth and +20% taxes for twenty years. The investigation is complete; its survey and restoration fees cannot be charged again."
 rol_asian_sites.0103.published:0 "Scribes join the carved fragments into a complete water map and record both villages' testimony. The gate remains unrepaired, but the plans are no longer buried in mud.\n\nPublishing the discovery grants 100 prestige, without the restoration benefits. This investigation is complete."
 rol_baghdad_manuscripts:0 "Comparing Baghdad Manuscripts"
 rol_baghdad_manuscripts_desc:0 "Comparing variant manuscripts supports research for ten years."
 rol_yamashiro_archers:0 "Mountain Road Archers"
 rol_yamashiro_archers_flavor:0 "These archers follow the old tradition of guarding mountain roads."
