 rol_mars_quest_on_cooldown_tt:0 "Your last expedition failed. You must wait 2 years before trying again."
 rol_mars_quest_cooldown_modifier:0 "Mars Expedition Cooldown"
 rol_mars_quest_cooldown_modifier_desc:0 "The previous underground expedition ended in failure. Forces need time to recover."
 rol_quest_rome.1001.desc:0 "With a deep rumble, the altar seal breaks. As you seize the blade, crimson light races along its edge?the Blade of Mars acknowledges your claim."
 rol_quest_rome.1001.desc.tier_1:0 "You reach the core altar battered and drained, yet still standing. Even so, the seal yields and the Blade of Mars answers your hand."
 rol_quest_rome.1001.desc.tier_2:0 "Your party pushes through deadly wards and spectral guardians with hard-won discipline. At last, the altar opens and the Blade of Mars rises in blood-red light."
 rol_quest_rome.1001.desc.tier_3:0 "Step after step, your command is precise and relentless. When the final seal shatters, the Blade of Mars flares like a war-banner in flame."
 rol_quest_rome.1001.desc.tier_4:0 "No hesitation, no retreat?your will crushes every trial in the catacombs. As ancient stone rings split apart, the Blade of Mars descends in a sacred crimson blaze."

 phase_rol_mars_descent_phase:0 "Catacomb Descent"
 phase_rol_mars_descent_phase_desc:0 "Your expedition has entered the Palatine undercroft."
 rol_mars_descent_phase:0 "$phase_rol_mars_descent_phase$"
 rol_mars_descent_phase_desc:0 "$phase_rol_mars_descent_phase_desc$"

 activity_rol_seek_mars_blade_conclusion_desc_success_4:0 "A near-perfect expedition from start to finish."
 activity_rol_seek_mars_blade_conclusion_desc_success_3:0 "A strong success with controlled risk."
 activity_rol_seek_mars_blade_conclusion_desc_success_2:0 "A costly but successful expedition."
 activity_rol_seek_mars_blade_conclusion_desc_success_1:0 "A narrow success won through endurance."
 activity_rol_seek_mars_blade_conclusion_desc_failure:0 "The expedition failed and requires a long recovery period."
 activity_rol_seek_mars_blade_conclusion_desc_fallback:0 "The expedition has concluded."

 rol_quest_rome.1090.t:0 "Expedition Aftermath"
 rol_quest_rome.1090.desc.success_4:0 "Your expedition is already spoken of as a model of command and resolve."
 rol_quest_rome.1090.desc.success_3:0 "You maintained control through danger and delivered a decisive result."
 rol_quest_rome.1090.desc.success_2:0 "You weathered serious setbacks but achieved your objective."
 rol_quest_rome.1090.desc.success_1:0 "You barely prevailed, but prevailed nonetheless."
 rol_quest_rome.1090.desc.failure:0 "The expedition collapsed before completion. A two-year cooldown now applies."
 rol_quest_rome.1090.desc.fallback:0 "Your venture into the ruins has ended."
 rol_quest_rome.1090.a:0 "Record the result."

 rol_quest_rome.1000.t:0 "Into the Palatine Catacombs"
 rol_quest_rome.1000.desc.mars:0 "Torchlight flickers across damp stone. Ahead, spectral praetorians and still-active traps guard the forbidden way."
 rol_quest_rome.1000.desc.weapon:0 "The tunnel reeks of rust and dust. Every ward ahead feels designed to keep a war relic out of mortal hands."
 rol_quest_rome.1000.desc.regalia:0 "Royal inscriptions line the walls. This passage guards not just treasure, but a symbol of sovereignty."
 rol_quest_rome.1000.desc.accessory:0 "Whispers echo through the corridor as if an old rite is repeating itself in the dark."
 rol_quest_rome.1000.desc.generic:0 "The ruin opens before you—deadly, ancient, and full of consequence."

 rol_quest_rome.1001.t:0 "Blessing of Mars"
 rol_quest_rome.1001.desc.generic:0 "With a deep rumble, the altar seal breaks. Ancient force surges through the relic in your grasp."
 rol_quest_rome.1001.desc.weapon:0 "You close your hand around the long-dormant blade, and steel answers with a low warlike hum."
 rol_quest_rome.1001.desc.regalia:0 "As you touch the regalia, runes ignite in layers—authority made visible in sacred form."
 rol_quest_rome.1001.desc.accessory:0 "The ornament glimmers in your palm, subtle yet undeniable, binding old myth to your fate."
 rol_quest_rome.1001.desc.mars.tier_1:0 "Battered and exhausted, you still force the final seal and claim the Blade of Mars."
 rol_quest_rome.1001.desc.mars.tier_2:0 "You break through traps and shades with discipline. The altar opens in crimson light."
 rol_quest_rome.1001.desc.mars.tier_3:0 "Your command is precise and relentless. The final seal shatters before your will."
 rol_quest_rome.1001.desc.mars.tier_4:0 "No hesitation, no retreat—you crush every trial, and Mars answers in sacred red flame."

 rol_quest_rome.1002.t:0 "Falling-Stone Corridor"
 rol_quest_rome.1002.desc.mars:0 "Deep supports crack. A thunderous cascade of stone crashes toward your column."
 rol_quest_rome.1002.desc.weapon:0 "The corridor collapses around you as you race beneath falling stone."
 rol_quest_rome.1002.desc.regalia:0 "Pillars carved with royal motifs topple one after another in deafening ruin."
 rol_quest_rome.1002.desc.accessory:0 "The narrow passage buckles, sealing your path behind you."
 rol_quest_rome.1002.desc.generic:0 "The ruin is collapsing. Delay means death."

 rol_quest_rome.1003.t:0 "Oath Altar"
 rol_quest_rome.1003.desc.mars:0 "A military oath-altar glows in red script, testing the resolve of every intruder."
 rol_quest_rome.1003.desc.weapon:0 "Battle oaths hum from the altar, judging whether you are worthy of what lies ahead."
 rol_quest_rome.1003.desc.regalia:0 "Ceremonial verses spiral across the stone, accepting only rightful authority."
 rol_quest_rome.1003.desc.accessory:0 "Fine symbols shimmer at the altar edge like a ritual filter for weak minds."
 rol_quest_rome.1003.desc.generic:0 "The altar awakens and demands its due."

 rol_quest_rome.1004.t:0 "Praetorian Shades"
 rol_quest_rome.1004.desc.mars:0 "Armored shades form ranks in silence, shields raised as one."
 rol_quest_rome.1004.desc.weapon:0 "Phantom guardians lock formation and bar your final approach."
 rol_quest_rome.1004.desc.regalia:0 "Ceremonial sentinels in spectral armor deny passage to the unworthy."
 rol_quest_rome.1004.desc.accessory:0 "Deadly silhouettes gather at the corridor's end, a final threshold of fear."
 rol_quest_rome.1004.desc.generic:0 "Spectral defenders hold the last gate."

