 rol_quest_rome.1000.c.tt:0 "You withdraw. This quest enters a 2-year cooldown."
 rol_quest_rome.1001.a.tt:0 "If the final resonance answers your expedition, your claim is secured. Otherwise the expedition fails and enters a 2-year cooldown."
 rol_quest_rome.1002.a.tt:0 "[prowess|E] check: force a path through the collapse."
 rol_quest_rome.1002.b.tt:0 "You withdraw. This quest enters a 2-year cooldown."
 rol_quest_rome.1003.a.tt:0 "[learning|E] check: answer the oath-script and break the seal."
 rol_quest_rome.1003.b.tt:0 "A desperate rush to force the altar's answer."
 rol_quest_rome.1004.a.tt:0 "[martial|E]/[prowess|E] check: smash through the guardian formation."
 rol_quest_rome.1004.b.tt:0 "You withdraw. This quest enters a 2-year cooldown."

 activity_rol_seek_mars_blade_special_type_title:0 "Expedition Progress"
 activity_rol_seek_mars_blade_special_type_desc:0 "Your choices determine how deeply the buried war-rite answers your will. Only the strongest alignment draws out its final response."
 ROL_MARS_WINDOW_SPECIAL_PROGRESS_TOOLTIP:0 "Current expedition progress: [ActivityWindow.GetSpecialProgressValue|0^V]"

