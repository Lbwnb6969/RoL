 activity_rol_seek_mars_blade:0 "Mars Catacomb Expedition"
 activity_rol_seek_mars_blade_desc:0 "Organize a forbidden descent beneath Rome, following sealed war-rites, collapsing halls, and the rumor of something still awake in the dark."
 activity_rol_seek_mars_blade_host_desc:0 "$BULLET_WITH_TAB$Adjust your outlay through the $rol_option_expedition_preparation$ activity option\n$BULLET_WITH_TAB$Failure ends the expedition and applies a 2-year cooldown"
 activity_rol_seek_mars_blade_guest_desc:0 ""
 activity_rol_seek_mars_blade_conclusion_desc:0 "Stone doors close behind you, but the echo of the undercroft lingers in every tale told after."
 activity_rol_seek_mars_blade_selection_tooltip:0 "Lead a disciplined descent into Rome's buried war-sanctums, where ancient oaths, broken corridors, and silent guardians still watch the dark.\n\nFailure ends the expedition and applies a 2-year cooldown."
