 rol_blade_of_mars:0 "Blade of Mars"
 rol_blade_of_mars_desc:0 "A blood-red relic said to have once belonged to Mars himself."
 artifact_rol_blade_of_mars:0 "Blade of Mars"
 artifact_rol_blade_of_mars_desc:0 "Its edge glows with crimson hunger, as if the god of war still grips it."

