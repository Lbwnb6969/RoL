 activity_rol_seek_mars_blade_special_type_bar_segment_tt_2:0 "#T Stable#!\nMomentum is building in your favor."
 activity_rol_seek_mars_blade_special_type_bar_segment_tt_3:0 "#T War-God's Gaze#!\nYour leadership drives the expedition forward."
 activity_rol_seek_mars_blade_special_type_bar_segment_tt_4:0 "#T Final Echo#!\nThe chamber is close to a decisive reply."

