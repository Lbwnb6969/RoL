 rol_sword_of_mars_name:0 "Sword of Mars"
 rol_sword_of_mars_description:0 "A legendary blade said to have been consecrated at the altar of Mars, god of war."

 rol_blade_of_mars:0 "Blade of Mars"
 rol_blade_of_mars_desc:0 "A blood-red relic said to have once belonged to Mars himself."
 artifact_rol_blade_of_mars:0 "Blade of Mars"
 artifact_rol_blade_of_mars_desc:0 "Its edge glows with crimson hunger, as if the god of war still grips it."

 rol_quest_rome.1000.a.base_tt:0 "[martial|E]/[prowess|E] check: higher skill improves success odds."
 rol_quest_rome.1000.a.odds_high_tt:0 "Current odds: #P 60% success#!, #N 40% failure#!."
 rol_quest_rome.1000.a.odds_low_tt:0 "Current odds: #P 40% success#!, #N 60% failure#!."
 rol_quest_rome.1000.b.tt:0 "[learning|E] check passed. #P 100% success#! and increased expedition progress."
 rol_quest_rome.1000.c.tt:0 "You withdraw. This quest enters a 2-year cooldown."
 rol_quest_rome.1001.a.tt:0 "You always receive the artifact. Progress #V 75+#!: +250 [prestige|E], +150 [piety|E]; #V 50+#!: +150 [prestige|E]; #V 25+#!: +75 [prestige|E]."
 rol_quest_rome.1002.a.tt:0 "[prowess|E] check: success advances and increases progress; failure causes injury and slight progress loss."
 rol_quest_rome.1002.b.tt:0 "You withdraw. This quest enters a 2-year cooldown."
 rol_quest_rome.1003.a.tt:0 "[learning|E] check: higher Learning improves your odds and progress gain."
 rol_quest_rome.1003.b.tt:0 "You endure the strain and keep moving, with a small progress gain."
 rol_quest_rome.1004.a.tt:0 "[martial|E] check: success greatly boosts progress; failure ends the expedition and triggers cooldown."
 rol_quest_rome.1004.b.tt:0 "You withdraw. This quest enters a 2-year cooldown."

 activity_rol_seek_mars_blade_special_type_title:0 "Expedition Progress"
