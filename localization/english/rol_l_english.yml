l_english:

 rol_blade_of_mars:0 "Blade of Mars"
 rol_blade_of_mars_desc:0 "A blood-red relic said to have once belonged to Mars himself."
 artifact_rol_blade_of_mars:0 "Blade of Mars"
 artifact_rol_blade_of_mars_desc:0 "Its edge glows with crimson hunger, as if the god of war still grips it."

 rol_quest_rome.0990.t:0 "At the Sealed Catacomb Gate"
 rol_quest_rome.0990.desc:0 "Your company reaches the shattered entrance beneath Rome. Cold air exhales from the dark and every torch seems smaller than it should. Even hardened veterans lower their voices as old legionary carvings emerge from the dust."
 rol_quest_rome.0990.a:0 "Form ranks. We enter with steel and silence."

 rol_quest_rome.1000.a.base_tt:0 "[martial|E]/[prowess|E] check: higher skill improves success odds."
 rol_quest_rome.1000.a.odds_elite_tt:0 "This approach has a #P commanding grip#! on the trial."
 rol_quest_rome.1000.a.odds_high_tt:0 "This approach gives you #P favorable odds#!."
 rol_quest_rome.1000.a.odds_low_tt:0 "This approach is a #N dangerous gamble#!."
