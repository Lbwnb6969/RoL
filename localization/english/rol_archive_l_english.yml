l_english:
 rol_star_observations_modifier:0 "Star Sphere Observations"
 rol_star_observations_modifier_desc:0 "Observations connect the sphere's markings with seafarers' accounts of an astrolabe. For ten years, spend 40 gold at the start of a Sevilla expedition for one certain strong advance, consuming these notes. Shares the opening limit with guard and expertise routes; no passive stat bonus. Copies arranged through inheritance last five years."
 rol_ocean_routes_modifier:0 "Calibrated Aegean Routes"
 rol_ocean_routes_modifier_desc:0 "Routes calibrated with the astrolabe point toward Naxos. For ten years, spend 40 gold at the start of a Naxos expedition for one certain strong advance, consuming the chart. Shares the opening limit with guard and expertise routes; no passive stat bonus. Copies arranged through inheritance last five years."
 rol_archive_knowledge_title:0 "An Old Relic, a New Lead"
 rol_archive_star_knowledge_desc:0 "The sphere observations can aid the Sevilla astrolabe expedition. Its independent routes remain available."
 rol_archive_ocean_knowledge_desc:0 "Astrolabe calibration has produced an Aegean route chart that can aid Naxos. Its independent routes remain available."
 rol_archive_sevilla_route_option:0 "Use the sphere observations to secure reliable guidance."
 rol_archive_sevilla_route_tt:0 "Spend 40 gold and consume the observations for a certain strong success at the first challenge. Requires an actual Sevilla activity; shares the opening limit with guard and expertise routes. Later stages and the Tier 4 threshold still apply."
 rol_archive_naxos_route_option:0 "Follow the calibrated route into the antechamber."
 rol_archive_naxos_route_tt:0 "Spend 40 gold and consume the route chart for a certain strong success at the first challenge. Requires an actual Naxos activity; shares the opening limit with guard and expertise routes. Later stages and the Tier 4 threshold still apply."
 rol_archive.0001.t:0 "Continue an Unfinished Journey"
 rol_archive.0001.desc:0 "My predecessor left notes and research charts. Several records can be organized together, but a lead on paper is not the skill of someone who lived through it.\n\nFor 50 prestige, I can arrange copies lasting five years. Existing material is not replaced by a shorter copy. This does not grant my predecessor's expertise, completion records, relic ownership, or unfinished projects."
 rol_archive.0001.a:0 "Organize the records for the next journey."
 rol_archive.0001.b:0 "Keep them to read later."
 rol_archive.0001.c:0 "Set them aside; I will take my own path."
 rol_archive_accept_tt:0 "Spend 50 prestige to receive missing regional notes, sphere observations and calibrated routes, each lasting five years. Existing material is retained without refreshing or shortening it. No inherited expertise, relic or completion flag. Reopening cannot repeat payment or delivery."
 rol_archive_defer_records_tt:0 "Keep the records unread and reopen them with Review Inherited Journey Records. They grant no benefit yet and do not prevent your own expeditions."
 rol_archive_discard_records_tt:0 "Close the pending records without notes or experience. Keep your own existing results. Inherited pacts are handled separately."
 rol_archive.0002.t:0 "A Predecessor's Promise"
 rol_archive.0002.desc:0 "[rol_archive_partner.GetTitledFirstName] undertook a role in my predecessor's expedition. The original promise is now before me. It does not require me to inherit another person's experiences, but it lets me choose whether to take up their commitment.\n\nIf I accept, I can honour the terms, renegotiate, defer or refuse. No settlement grants my predecessor's expertise experience."
 rol_archive.0002.desc.busy:0 "[rol_archive_partner.GetTitledFirstName] has brought a promise left by my predecessor, but I already have a personal pact in progress or awaiting settlement. The new record must not replace its participant. I can retain the inherited promise or decline to take it up."
 rol_archive.0002.desc.absent:0 "The original participant has died or can no longer take part. Close this record without replacing its recipient or gaining experience or reputation. Other records and pacts remain."
 rol_archive.0002.a:0 "I will take up this promise."
 rol_archive.0002.b:0 "This was my predecessor's promise; I will not take it up."
 rol_archive.0002.c:0 "Keep the original promise on record."
 rol_archive.0002.d:0 "Close the invalid promise."
 rol_archive_adopt_tt:0 "Pass the same person and role into the existing settlement: scholar 50 prestige, guard 50 gold, envoy 75 prestige, with its normal compromise and deferral choices. Do not replace a personal pact or inherit experience. Honouring a promise you chose to accept can build your own reputation and trusted relationship."
 rol_archive_decline_pact_tt:0 "Remove only this inherited promise, with no payment or reward and no inherited stigma. Keep your personal pact and other inherited records."
 rol_archive_defer_pact_tt:0 "Keep the original person and terms without replacing your pact. Reopen with Review Inherited Expedition Pacts. Your expeditions remain available; no immediate reward."
 rol_review_inherited_records_decision:0 "Review Inherited Journey Records"
 rol_review_inherited_records_decision_desc:0 "Decide whether to organize your predecessor's notes and research charts. Personal expertise is not inherited."
 rol_review_inherited_records_decision_tooltip:0 "Reopen unread records. Organization costs 50 prestige; copies last five years."
 rol_review_inherited_records_decision_confirm:0 "Open the records"
 rol_review_inherited_pacts_decision:0 "Review Inherited Expedition Pacts"
 rol_review_inherited_pacts_decision_desc:0 "Process original promises individually: accept, retain or decline them."
 rol_review_inherited_pacts_decision_tooltip:0 "Open an original participant record without replacing your pact or awarding rewards."
 rol_review_inherited_pacts_decision_confirm:0 "Read the promise"
