 activity_rol_seek_astrolabe_of_ocean_special_type_bar_segment_tt_2:0 "#T Seaworthy#!\nDiscipline and instinct begin to align."
 activity_rol_seek_astrolabe_of_ocean_special_type_bar_segment_tt_3:0 "#T Commanding#!\nYour fleet is mastering the unknown waters."
 activity_rol_seek_astrolabe_of_ocean_special_type_bar_segment_tt_4:0 "#T Final Horizon#!\nThe waters at the world's edge are close to answering you."
