l_english:

 # Internal: Tier 4 final gate remains required for RoL expedition success.
 rol_astrolabe_of_ocean:0 "Astrolabe of Ocean-Sea"
 rol_astrolabe_of_ocean_desc:0 "A star-etched oceanic accessory whose blue pointer defies every earthly compass. Sailors swear it hears the tide before the wind."
 artifact_rol_astrolabe_of_ocean:0 "Astrolabe of Ocean-Sea"
 artifact_rol_astrolabe_of_ocean_desc:0 "Forged from fallen star-metal and drowned keelwood, it points only toward horizons no map should know."

 rol_quest_sevilla.0990.t:0 "At the Quays of Triana"
 rol_quest_sevilla.0990.desc:0 "Your expedition gathers in Sevilla's restless harbor as lanterns sway above the Guadalquivir. Rumor, contraband charts, and hard-eyed sailors all point toward the same impossible promise: beyond Gibraltar's hidden coves waits the route to a sea that no kingdom has ever ruled."
 rol_quest_sevilla.0990.a:0 "Cast off. We sail before courage cools."

 rol_quest_sevilla.1000.t:0 "Smugglers of the Strait"
 rol_quest_sevilla.1000.desc:0 "In a reeking bay of smugglers and broken hulls, you must secure helmsmen who have survived true ocean fury. Every captain demands coin, respect, or proof that you will not lead them to a meaningless death."
 rol_quest_sevilla.1000.a:0 "Win them with diplomacy and vision."
 rol_quest_sevilla.1000.b:0 "Command the bay through force of will."
 rol_quest_sevilla.1000.c:0 "This is too unstable. Return to port."
 rol_quest_sevilla.1000.a.base_tt:0 "[diplomacy|E] check."
 rol_quest_sevilla.1000.a.odds_elite_tt:0 "This approach has a #P commanding grip#! on the trial."
 rol_quest_sevilla.1000.a.odds_high_tt:0 "This approach gives you #P favorable odds#!."
 rol_quest_sevilla.1000.a.odds_low_tt:0 "This approach is a #N dangerous gamble#!."
 rol_quest_sevilla.1000.b.base_tt:0 "[martial|E]/[prowess|E] check."
 rol_quest_sevilla.1000.b.odds_elite_tt:0 "This approach has a #P commanding grip#! on the trial."
 rol_quest_sevilla.1000.b.odds_high_tt:0 "This approach gives you #P favorable odds#!."
 rol_quest_sevilla.1000.b.odds_low_tt:0 "This approach is a #N dangerous gamble#!."
 rol_quest_sevilla.1000.c.tt:0 "You abort the expedition. 2-year cooldown."

 rol_quest_sevilla.1010.t:0 "The Bay Answers"
 rol_quest_sevilla.1010.desc:0 "Coin changes hands, oaths are sworn, and scarred navigators finally step aboard your fleet. Your expedition is no longer rumor - it has become a living force under sail."
 rol_quest_sevilla.1010.a:0 "Set course for the black horizon."
 rol_quest_sevilla.1011.t:0 "The Bay Turns Hostile"
 rol_quest_sevilla.1011.desc:0 "Threats, greed, and fear erupt at once. The smugglers break formation, crews desert, and your venture collapses before the true sea is even reached."
 rol_quest_sevilla.1011.a:0 "Assess the party and the evidence first."
 rol_quest_sevilla.1012.t:0 "The Anchors Hold"
 rol_quest_sevilla.1012.desc:0 "You order the fleet back into orderly harbor. Better to preserve ships and men than feed them to a legend not yet ready to yield."
 rol_quest_sevilla.1012.a:0 "We will prepare anew."

 rol_quest_sevilla.1002.t:0 "The Magnetic Storm-Wall"
 rol_quest_sevilla.1002.desc:0 "At the world's edge the sky bleeds purple-red and every compass spins madly. Black fog coils across the water while voices cry that stars are falling into the sea. To cross this wall, you must master terror itself."
 rol_quest_sevilla.1002.a:0 "Read the heavens through the chaos."
 rol_quest_sevilla.1002.b:0 "Hold the fleet together with iron logistics."
 rol_quest_sevilla.1002.c:0 "Turn back before the ocean devours us."
 rol_quest_sevilla.1002.a.base_tt:0 "[learning|E] check."
 rol_quest_sevilla.1002.a.odds_elite_tt:0 "This approach has a #P commanding grip#! on the trial."
 rol_quest_sevilla.1002.a.odds_high_tt:0 "This approach gives you #P favorable odds#!."
 rol_quest_sevilla.1002.a.odds_low_tt:0 "This approach is a #N dangerous gamble#!."
 rol_quest_sevilla.1002.b.base_tt:0 "[stewardship|E] check."
 rol_quest_sevilla.1002.b.odds_elite_tt:0 "This approach has a #P commanding grip#! on the trial."
 rol_quest_sevilla.1002.b.odds_high_tt:0 "This approach gives you #P favorable odds#!."
 rol_quest_sevilla.1002.b.odds_low_tt:0 "This approach is a #N dangerous gamble#!."
 rol_quest_sevilla.1002.c.tt:0 "You abort the expedition. 2-year cooldown."

 rol_quest_sevilla.1020.t:0 "Through the Dead Calm"
 rol_quest_sevilla.1020.desc:0 "You break through the storm-wall and emerge into a sea flat as polished glass. Panic loosens its grip, and at the center of the silent waters something ancient begins to glow."
 rol_quest_sevilla.1020.a:0 "Advance to the light."
 rol_quest_sevilla.1021.t:0 "The Sea Claims the Weak"
 rol_quest_sevilla.1021.desc:0 "False stars, maddened helmsmen, and howling pressure tear cohesion apart. The fleet cannot survive another league in this cursed water."
 rol_quest_sevilla.1021.a:0 "Assess the party and the evidence first."
 rol_quest_sevilla.1022.t:0 "Retreat from the Storm-Wall"
 rol_quest_sevilla.1022.desc:0 "You choose survival over obsession. The fleet turns from the abyss, leaving the unknown sea to brood beyond the fog."
 rol_quest_sevilla.1022.a:0 "We live to sail again."

 rol_quest_sevilla.1050.t:0 "Voices Over the Waves"
 rol_quest_sevilla.1050.desc:0 "Your invited companions whisper of sea-songs in the mist. One urges a brief pause to steady the crew, while another insists that hesitation itself will feed the superstition spreading across the decks."
 rol_quest_sevilla.1050.a:0 "Steady the sailors before the next push."
 rol_quest_sevilla.1050.b:0 "Silence fear and force the pace."

 rol_quest_sevilla.1001.t:0 "The Mirror-Sea Astrolabe"
 rol_quest_sevilla.1001.desc:0 "At the center of the dead-calm waters, the Astrolabe floats above the surface like a second moon. Its brass teeth awaken at your touch, and the sea itself seems to lean closer to hear the verdict."
 rol_quest_sevilla.1001.desc.tier_4:0 "Light pours through the gears as if dawn itself has been trapped inside the relic. The fleet witnesses an omen for a new age of navigation, and the Astrolabe of Ocean-Sea becomes yours."
 rol_quest_sevilla.1001.desc.below_tier4:0 "The final harmony slips away. The glow sinks beneath the mirror-sea, and the waters refuse your claim."
 rol_quest_sevilla.1001.desc.partial:0 "The final harmony slips away, but your navigators preserve a workable fragment of the route. The Astrolabe remains beyond reach for now."
 rol_quest_sevilla.1001.a:0 "Let all horizons yield before me."
 rol_quest_sevilla.1001.a.tt:0 "Only a full final alignment lets you bring the omen home. Otherwise the expedition fails and enters a 2-year cooldown."

 rol_quest_sevilla.1090.t:0 "Ocean Expedition Summary"
 rol_quest_sevilla.1090.desc.success_4.standard:0 "A legendary voyage. You broke the storm-wall, mastered the mirror-sea, and returned with a relic fit to reorder the age of sail.\n\n$EFFECT_LIST_BULLET$Gained relic: #P $artifact_rol_astrolabe_of_ocean$#!\n$EFFECT_LIST_BULLET$Gained #P +350#! [prestige|E]\n$EFFECT_LIST_BULLET$Gained #P +150#! [gold|E]\n$EFFECT_LIST_BULLET$No extra triumph bonus came from expedition preparation"
 rol_quest_sevilla.1090.desc.success_4.high:0 "A legendary voyage. You broke the storm-wall, mastered the mirror-sea, and returned with a relic fit to reorder the age of sail.\n\n$EFFECT_LIST_BULLET$Gained relic: #P $artifact_rol_astrolabe_of_ocean$#!\n$EFFECT_LIST_BULLET$Gained #P +350#! [prestige|E]\n$EFFECT_LIST_BULLET$Gained #P +150#! [gold|E]\n$EFFECT_LIST_BULLET$Gained #P +150#! [prestige|E] and #P +25#! [dynasty_prestige|E] from high preparation"
 rol_quest_sevilla.1090.desc.success_4.supreme:0 "A legendary voyage. You broke the storm-wall, mastered the mirror-sea, and returned with a relic fit to reorder the age of sail.\n\n$EFFECT_LIST_BULLET$Gained relic: #P $artifact_rol_astrolabe_of_ocean$#!\n$EFFECT_LIST_BULLET$Gained #P +350#! [prestige|E]\n$EFFECT_LIST_BULLET$Gained #P +150#! [gold|E]\n$EFFECT_LIST_BULLET$Gained #P +350#! [prestige|E] and #P +50#! [dynasty_prestige|E] from supreme preparation"
 rol_quest_sevilla.1090.desc.success_3:0 "A brilliant expedition whose discipline and nerve turned impossible waters into a navigable triumph."
 rol_quest_sevilla.1090.desc.success_2:0 "A costly but valuable success that proved your fleet could endure the world's edge."
 rol_quest_sevilla.1090.desc.success_1:0 "You survived by narrow margins, but your banner still returned with glory."
 rol_quest_sevilla.1090.desc.failure:0 "The fleet broke before the unknown sea. A two-year recovery is now required."
 rol_quest_sevilla.1090.desc.fallback:0 "The ocean has fallen silent, but the legend remains."
 rol_quest_sevilla.1090.a:0 "Record the voyage."

 activity_rol_seek_astrolabe_of_ocean:0 "Astrolabe Ocean Expedition"
 activity_rol_seek_astrolabe_of_ocean_desc:0 "From Sevilla, launch a forbidden voyage toward the storm-wall and the luminous anomaly whispered of beyond the world's edge."
 activity_rol_seek_astrolabe_of_ocean_host_desc:0 "$BULLET_WITH_TAB$Adjust your outlay through the $rol_option_expedition_preparation$ activity option\n$BULLET_WITH_TAB$A qualified party can remedy one crisis; otherwise failure ends the expedition with a 2-year cooldown"
 activity_rol_seek_astrolabe_of_ocean_guest_desc:0 ""
 activity_rol_seek_astrolabe_of_ocean_conclusion_desc:0 "Your fleet returns changed by fog, stars, and impossible water."
 activity_rol_seek_astrolabe_of_ocean_conclusion_desc_success_4:0 "You returned as master of the world's edge sea."
 activity_rol_seek_astrolabe_of_ocean_conclusion_desc_success_3:0 "The expedition carved a disciplined path through the storm-wall."
 activity_rol_seek_astrolabe_of_ocean_conclusion_desc_success_2:0 "You endured brutal losses but preserved the voyage."
 activity_rol_seek_astrolabe_of_ocean_conclusion_desc_success_1:0 "A narrow success won by stubborn resolve."
 activity_rol_seek_astrolabe_of_ocean_conclusion_desc_failure:0 "The expedition failed and now enters a 2-year cooldown."
 activity_rol_seek_astrolabe_of_ocean_conclusion_desc_fallback:0 "The expedition has concluded."
 activity_rol_seek_astrolabe_of_ocean_selection_tooltip:0 "Sail from Sevilla through smugglers' coves, magnetic tempests, and the silent waters whispered of beyond the storm-wall.\n\nA qualified party can remedy one crisis; otherwise failure ends the expedition with a 2-year cooldown."
 activity_rol_seek_astrolabe_of_ocean_predicted_cost:0 "The voyage's cost depends heavily on the personnel and equipment grade you select."
 activity_rol_seek_astrolabe_of_ocean_province_desc:0 "Target location: [ROOT.Province.GetName]"

 activity_rol_seek_astrolabe_of_ocean_special_type_title:0 "Ocean Mastery"
 activity_rol_seek_astrolabe_of_ocean_special_type_desc:0 "Your choices determine how completely the fleet masters the forbidden route. Only the deepest command earns the sea's final response."
