l_english:
 rol_catalogue_family_knowledge_decision:0 "Compile a House Master Copy"
 rol_catalogue_family_knowledge_decision_desc:0 "Compile a surviving expedition journal or research chart into a master copy owned by my current house. Later members may pay to print an edition. The archive grants no attributes, artifacts, or personal experience."
 rol_catalogue_family_knowledge_decision_confirm:0 "Examine my surviving records"
 rol_catalogue_family_knowledge_decision_tooltip:0 "Choose one unexpired record to catalogue for my current house."
 rol_print_family_knowledge_decision:0 "Print a House Record"
 rol_print_family_knowledge_decision_desc:0 "Print one missing record from my current house's master copies for 40 gold. Editions last five years; all share a personal three-year printing interval. An existing record cannot be refreshed."
 rol_print_family_knowledge_decision_confirm:0 "Consult the house archive"
 rol_print_family_knowledge_decision_tooltip:0 "Pay 40 gold for one missing record that lasts five years."
 rol_family_archive_print_cooldown_tt:0 "Have not printed any house record in the past three years"
 rol_family_archive.0001.t:0 "A Master Copy for Our Heirs"
 rol_family_archive.0001.desc:0 "These pages are still legible, but a travelling copy will eventually be lost. I can have one record edited and bound for my current house. Each kind needs cataloguing only once. Compilation costs 100 gold, reduced to 50 at 100 Research expertise. My original record keeps its existing duration."
 rol_family_archive.0002.t:0 "Opening the Archive"
 rol_family_archive.0002.desc:0 "My predecessors left master copies to print, rather than a journey already completed. For 40 gold I may take one record I do not already hold, valid for five years. Printing any record prevents another printing for three years. Journals and charts are consumed by their existing expedition uses."
 rol_family_archive.invalid.desc:0 "This catalogue belongs to the house whose archive I opened. My membership or access has changed. I can close it and consult my current house through its decision."
 rol_family_archive.0001.mars_notes:0 "Compile the Roman Crypt Journal"
 rol_family_archive.0001.nibelung_notes:0 "Compile the Munich Ice-Cave Journal"
 rol_family_archive.0001.naxos_notes:0 "Compile the Naxos Journal"
 rol_family_archive.0001.astrolabe_notes:0 "Compile the Sevilla Journal"
 rol_family_archive.0001.carthage_notes:0 "Compile the Carthage Journal"
 rol_family_archive.0001.star_observations:0 "Compile the Stellar Observations"
 rol_family_archive.0001.ocean_routes:0 "Compile the Aegean Route Chart"
 rol_family_archive.0002.mars_notes:0 "Print the Roman Crypt Journal"
 rol_family_archive.0002.nibelung_notes:0 "Print the Munich Ice-Cave Journal"
 rol_family_archive.0002.naxos_notes:0 "Print the Naxos Journal"
 rol_family_archive.0002.astrolabe_notes:0 "Print the Sevilla Journal"
 rol_family_archive.0002.carthage_notes:0 "Print the Carthage Journal"
 rol_family_archive.0002.star_observations:0 "Print the Stellar Observations"
 rol_family_archive.0002.ocean_routes:0 "Print the Aegean Route Chart"
 rol_family_archive.catalogue.flavor:0 "Leave a book our descendants can find."
 rol_family_archive.print.flavor:0 "Take a copy fit for the road."
 rol_family_archive_catalogue_tt:0 "Pay 100 gold to catalogue this unexpired record for my current house, or 50 at 100 Research expertise. Each kind is catalogued once per house. Keep my original record; gain no expertise, attributes, or completion flags."
 rol_family_archive_print_tt:0 "Pay 40 gold for this five-year record and reveal its expedition. Existing records cannot be refreshed. All records share a personal three-year printing interval; the master copy remains with my current house. Gain no predecessor's expertise, artifact, or completion flags."
 rol_family_archive.close:0 "Close the catalogue."
 rol_family_archive.close.flavor:0 "First choose the road ahead."
