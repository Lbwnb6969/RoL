l_english:
 rol_catalogue_family_knowledge_decision:0 "Compile a House Master Copy"
 rol_catalogue_family_knowledge_decision_desc:0 "Compile an unexpired journal or chart into a house master copy that later members may pay to print.\n\n$rol_family_archive_inventory$"
 rol_catalogue_family_knowledge_decision_confirm:0 "Examine my surviving records"
 rol_catalogue_family_knowledge_decision_tooltip:0 "Choose one unexpired record to catalogue for my current house."
 rol_print_family_knowledge_decision:0 "Print a House Record"
 rol_print_family_knowledge_decision_desc:0 "Print one missing record from my current house's master copies for 40 gold. Editions last five years; all share a personal three-year printing interval. An existing record cannot be refreshed.\n\n$rol_family_archive_inventory$"
 rol_print_family_knowledge_decision_confirm:0 "Consult the house archive"
 rol_print_family_knowledge_decision_tooltip:0 "Pay 40 gold for one missing record that lasts five years."
 rol_family_archive_print_cooldown_tt:0 "Have not printed any house record in the past three years"
 rol_family_archive.0001.t:0 "A Master Copy for Our Heirs"
 rol_family_archive.0001.desc:0 "Preserve one unexpired source for later house editions. Each kind costs 100 gold to catalogue, or 50 at 100 Research experience. My original copy remains.\n\n$rol_family_archive_inventory$"
 rol_family_archive.0002.t:0 "Opening the Archive"
 rol_family_archive.0002.desc:0 "Print one missing record for 40 gold, valid for five years. All editions share a three-year interval. Journals and charts are still consumed on their respective expeditions.\n\n$rol_family_archive_inventory$"
 rol_family_archive.invalid.desc:0 "This catalogue belongs to the house whose archive I opened. My membership or access has changed. I can close it and consult my current house through its decision."
