l_english:
 trait_rol_relic_seeker:0 "Relic Seeker"
 trait_rol_relic_seeker_desc:0 "Expeditions leave more than trophies. This seeker learns to read ancient evidence, lead a party through danger, and negotiate with those who guard the past. Expertise grows through expedition reflections; inheriting a relic alone grants no experience."
 trait_track_rol_research:0 "Research"
 trait_track_rol_research_desc:0 "Compare inscriptions, separate evidence from conjecture, and turn discoveries into knowledge. Benefits improve at 20, 60, and 100 experience."
 trait_track_rol_exploration:0 "Exploration"
 trait_track_rol_exploration_desc:0 "Learn safe routes and how to bring a party home. Benefits improve at 20, 60, and 100 experience."
 trait_track_rol_negotiation:0 "Negotiation"
 trait_track_rol_negotiation_desc:0 "Earn trust, settle competing claims, and preserve the relationships that make another journey possible. Benefits improve at 20, 60, and 100 experience."
 rol_expedition_growth.0001.t:0 "What the Journey Taught Me"
 rol_expedition_growth.0001.desc:0 "I spread my notes across the table: observations, routes, and promises. Whatever we brought home, these experiences need not be wasted.\n\nI have #V [ROOT.Char.MakeScope.ScriptValue('rol_expedition_growth_pending_xp_value')|0]#! experience to invest in one direction. The chosen focus also gives a three-year benefit, replacing my previous expedition focus."
 rol_expedition_growth.0001.a:0 "Compare the evidence and write a careful account."
 rol_expedition_growth.0001.a.flavor:0 "An honest record can outlast the relic itself. Diligent seekers also lose 5 stress."
 rol_expedition_growth.0001.b:0 "Record the dangers and teach the safer routes."
 rol_expedition_growth.0001.b.flavor:0 "Next time, we shall be better prepared. Brave seekers also lose 5 stress."
 rol_expedition_growth.0001.c:0 "Remember who helped us, and how we won their trust."
 rol_expedition_growth.0001.c.flavor:0 "A closed gate may open to a familiar voice. Gregarious seekers also lose 5 stress."
 rol_expedition_research_focus_modifier:0 "Ordering the Evidence"
 rol_expedition_research_focus_modifier_desc:0 "Recent expedition findings sharpen this character's studies. This focus lasts three years and is replaced by the next chosen expedition focus."
 rol_expedition_exploration_focus_modifier:0 "Lessons of the Road"
 rol_expedition_exploration_focus_modifier_desc:0 "Recent expedition experience helps this character plan journeys. This focus lasts three years and is replaced by the next chosen expedition focus."
 rol_expedition_negotiation_focus_modifier:0 "A Seeker's Reputation"
 rol_expedition_negotiation_focus_modifier_desc:0 "A considered account of recent dealings improves this character's standing. This focus lasts three years and is replaced by the next chosen expedition focus."
 rol_expedition_mars_notes_modifier:0 "Rome: Expedition Notes"
 rol_expedition_nibelung_notes_modifier:0 "Munich: Expedition Notes"
 rol_expedition_naxos_notes_modifier:0 "Naxos: Expedition Notes"
 rol_expedition_astrolabe_notes_modifier:0 "Sevilla: Expedition Notes"
 rol_expedition_carthage_notes_modifier:0 "Carthage: Expedition Notes"
 rol_expedition_notes_description:0 "Evidence recovered during a partial success. Consumed when the next expedition to the same region starts; its binary challenges gain #V +5 percentage points#! success chance for that expedition, still capped at 95%. Notes expire after ten years and do not stack within a region. Other regions do not consume them."
 rol_expedition_mars_notes_modifier_desc:0 "$rol_expedition_notes_description$"
 rol_expedition_nibelung_notes_modifier_desc:0 "$rol_expedition_notes_description$"
 rol_expedition_naxos_notes_modifier_desc:0 "$rol_expedition_notes_description$"
 rol_expedition_astrolabe_notes_modifier_desc:0 "$rol_expedition_notes_description$"
 rol_expedition_carthage_notes_modifier_desc:0 "$rol_expedition_notes_description$"
 rol_expedition_journal_used_title:0 "Following Our Earlier Findings"
 rol_expedition_journal_used_desc:0 "Regional notes have been consumed for this expedition: +5 percentage points to binary success checks, up to 95%. The displayed chances include this benefit."
 rol_review_expedition_journal_decision:0 "Reflect on an Expedition"
 rol_review_expedition_journal_decision_desc:0 "An unrecorded expedition still has lessons to offer. Decide which expertise to develop from the experience already earned."
 rol_review_expedition_journal_decision_tooltip:0 "Open the pending expedition reflection; this does not generate new experience."
 rol_review_expedition_journal_decision_confirm:0 "Lay out my notes"
