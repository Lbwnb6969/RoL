l_simp_chinese:
 rol_artifact_rarity_slot_legendary_mask:0 "@rol_legendary_icon! #color:{0.9,0.9,0} 传奇级面具#!"

 rol_relic_debug_carthage_stage_progress:0 "[ROL 调试] 迦太基阶段已推进"
 rol_relic_debug_carthage_success_finalize:0 "[ROL 调试] 迦太基成功结算完成"
 rol_relic_debug_carthage_failure_finalize:0 "[ROL 调试] 迦太基失败结算完成"
 rol_relic_debug_carthage_fail_now:0 "[ROL 调试] 已调用迦太基立即失败"
 rol_relic_debug_carthage_terminal_tier4_reward:0 "[ROL 调试] 迦太基终局进入 Tier4 发奖分支"
 rol_relic_debug_carthage_terminal_below_tier4_fail:0 "[ROL 调试] 迦太基终局进入低于 Tier4 的失败分支"
 rol_relic_debug_carthage_partial_finalize:0 "[ROL 调试] 迦太基部分成功终局已结算"

 rol_relic_discovery.1600.t:0 "盐地之下的灰烬神庙"
 rol_relic_discovery.1600.desc:0 "突尼斯外海吹来的罕见沙暴刮去了大片受诅盐碱土，令卡塔贾纳附近一座半埋神庙的上层穹顶重见天日。幸存者只提到几件事：星光般冰冷的灰烬、在黑暗里行进的战象幽影，以及一张藏在地下誓约尽头的黄金面具。"
 rol_relic_discovery.1600.a:0 "准备一场黑沙远征。"

 rol_ash_forged_mask:0 "迦太基的浴火金面"
 rol_ash_forged_mask_desc:0 "这张面具诞生于城破之夜的余烬、熔金与绝望之中，始终带着焦土气味与沙漠深夜的寒意。"
 artifact_rol_ash_forged_mask:0 "迦太基的浴火金面"
 artifact_rol_ash_forged_mask_desc:0 "它冰冷得像沙漠午夜，内部却仍留着一座誓死不屈之城的统帅意志。"

 rol_quest_carthage.0990.t:0 "黑沙边缘"
 rol_quest_carthage.0990.desc:0 "当你的远征队抵达卡塔贾纳外那道被风暴撕开的沙脊时，地平线早已被夜色吞没。盐尘像苍白烟雾般在风中盘旋，黑沙则钻进甲片、布料与祷词的缝隙里。掩埋圣所那道破碎边缘之下，潜伏着一种完整到近乎刻意的死寂，连最老练的士兵也会不自觉压低声音，仿佛遗迹本身正在等待第一个敢于报上姓名并迈步进入的人。"
 rol_quest_carthage.0990.a:0 "趁黄沙尚未回合，把入口吃下来。"
 rol_quest_carthage.0990.a.flavor:0 "在风沙与恐惧重新合拢前，正式押上这场远征。"

 rol_quest_carthage.1000.t:0 "穿越夜砂"
 rol_quest_carthage.1000.desc:0 "黑夜降临后，这片荒漠便再无道路可言。沙丘像缓慢流动的黑潮，星光则像极冷的针锋悬在头顶，每一个地标都仿佛只在你移开视线前短暂存在。若你不能在黎明前死死咬住真正方位，那座被风暴揭开的神庙就会再次沉入受诅盐地与流动灰沙，只给你留下死者与一段无人愿信的故事。"
 rol_quest_carthage.1000.a:0 "重金雇佣贝都因星引者。"
 rol_quest_carthage.1000.b:0 "依靠古闪米特星象学者领路。"
 rol_quest_carthage.1000.c:0 "现在回头，还能保全队伍。"
 rol_quest_carthage.1000.a.base_tt:0 "[diplomacy|E]检定。"
 rol_quest_carthage.1000.b.base_tt:0 "[learning|E]检定。"
 rol_quest_carthage.1000.c.tt:0 "你终止本次远征：进入2年冷却。"
 rol_quest_carthage.1000.a.tt.success:0 "#P 成功：#!沙丘之间真的出现了一条隐蔽路线，你的队伍赶在地貌再次变动前抵达了掩埋圣所。\n#weak 成功率：[SCOPE.ScriptValue('rol_expedition_display_success_chance_value')|0]% / 失败率：[SCOPE.ScriptValue('rol_expedition_display_failure_chance_value')|0]%#!"
 rol_quest_carthage.1000.a.tt.failure:0 "#N 失败：#!错误引导与黑沙夜路彻底撕裂了队形。\n#N 远征立刻终止并进入2年冷却。#!\n#weak 成功率：[SCOPE.ScriptValue('rol_expedition_display_success_chance_value')|0]% / 失败率：[SCOPE.ScriptValue('rol_expedition_display_failure_chance_value')|0]%#!"
 rol_quest_carthage.1000.b.tt.success:0 "#P 成功：#!古老星图终于锁定了神庙真正方位，远征队及时抵达了入口。\n#weak 成功率：[SCOPE.ScriptValue('rol_expedition_display_success_chance_value')|0]% / 失败率：[SCOPE.ScriptValue('rol_expedition_display_failure_chance_value')|0]%#!"
 rol_quest_carthage.1000.b.tt.failure:0 "#N 失败：#!天象被误判，荒漠夺走了时间，也夺走了秩序。\n#N 远征立刻终止并进入2年冷却。#!\n#weak 成功率：[SCOPE.ScriptValue('rol_expedition_display_success_chance_value')|0]% / 失败率：[SCOPE.ScriptValue('rol_expedition_display_failure_chance_value')|0]%#!"
 rol_quest_carthage.1000.a.flavor:0 "把命运交给真正懂沙丘、风向与星光的人。"
 rol_quest_carthage.1000.b.flavor:0 "让古老历法与禁忌天象去完成单靠勇气做不到的事。"
 rol_quest_carthage.1000.c.flavor:0 "趁荒漠还允许你抽身时主动折返。"

 rol_quest_carthage.1010.t:0 "路径显现"
 rol_quest_carthage.1010.desc:0 "违背这片荒漠常理的一幕发生了。几道几乎被盐尘与灰烬抹尽的半埋标记，把你的队列引入一条只短暂开启的沙间通道。当神庙门槛最终从黑沙中升起时，就连最强硬的人也能意识到，这已不只是找到了路，而是被允许继续靠近。"
 rol_quest_carthage.1010.a:0 "继续推进。"
 rol_quest_carthage.1010.a.flavor:0 "趁入口尚未被风沙抹去前继续前进。"

 rol_quest_carthage.1011.t:0 "迷失于黑沙"
 rol_quest_carthage.1011.desc:0 "荒漠并不会一下子吞掉所有人。它是循序渐进地下手：一次错位的判断、一支失落的火把、一条被风吞没的命令、一列再也没能完全归队的人影。等你真正意识到整场行军已被磨损到何种程度时，继续前进就等于把远征队交给一片足以抹去记忆本身的黑暗。"
 rol_quest_carthage.1011.a:0 "结束这次尝试。"
 rol_quest_carthage.1011.a.flavor:0 "接受荒漠的拒绝，先把人带回去。"

 rol_quest_carthage.1012.t:0 "把荒漠留给以后"
 rol_quest_carthage.1012.desc:0 "你在黑夜彻底合拢之前下令撤退。没有人提出异议。等到天明，沙丘早已抚平了你们的行迹，受诅盐尘也带走了活人曾如此逼近真相的最后证据。"
 rol_quest_carthage.1012.a:0 "以后再来。"
 rol_quest_carthage.1012.a.flavor:0 "保住队伍，为下次远征留下余力。"

 rol_quest_carthage.1002.t:0 "灰烬与战象幽影"
 rol_quest_carthage.1002.desc:0 "神庙更深处的守卫并不只是石墙与机关。死灰悬在空气里，本不该出现在地下的异常星光则沿裂缝洒落。凡是吸入过多灰烬的人，都会看见迦太基最后的战争在眼前重演：黑天之下沉默推进的巨象、折断的军旗、明知无法取胜却仍旧前压的统帅与军阵。这片废墟并不在乎你是否理解他们的悲苦，它真正审问的是：你的意志，能不能在这种悲苦里继续站住。"
 rol_quest_carthage.1002.a:0 "以铁血统御压碎幻象。"
 rol_quest_carthage.1002.b:0 "以敬畏与星学安抚英灵。"
 rol_quest_carthage.1002.c:0 "趁幻象尚未吞掉所有人，撤。"
 rol_quest_carthage.1002.a.base_tt:0 "[martial|E] / [prowess|E]检定。"
 rol_quest_carthage.1002.b.base_tt:0 "[learning|E] / [piety_level|E]检定。"
 rol_quest_carthage.1002.c.tt:0 "你终止本次远征：进入2年冷却。"
 rol_quest_carthage.1002.a.tt.success:0 "#P 成功：#!你的意志压过了古战回响，神庙更深层的大门终于对你开启。\n#weak 成功率：[SCOPE.ScriptValue('rol_expedition_display_success_chance_value')|0]% / 失败率：[SCOPE.ScriptValue('rol_expedition_display_failure_chance_value')|0]%#!"
 rol_quest_carthage.1002.a.tt.failure:0 "#N 失败：#!死去的战争记忆击穿了整支队伍的纪律。\n#N 远征立刻终止并进入2年冷却。#!\n#weak 成功率：[SCOPE.ScriptValue('rol_expedition_display_success_chance_value')|0]% / 失败率：[SCOPE.ScriptValue('rol_expedition_display_failure_chance_value')|0]%#!"
 rol_quest_carthage.1002.b.tt.success:0 "#P 成功：#!你让这片古老悲愿暂时平静下来，圣所允许你再向前一步。\n#weak 成功率：[SCOPE.ScriptValue('rol_expedition_display_success_chance_value')|0]% / 失败率：[SCOPE.ScriptValue('rol_expedition_display_failure_chance_value')|0]%#!"
 rol_quest_carthage.1002.b.tt.failure:0 "#N 失败：#!死灰记住的只有毁灭，神庙因此以恐慌与崩溃回应你。\n#N 远征立刻终止并进入2年冷却。#!\n#weak 成功率：[SCOPE.ScriptValue('rol_expedition_display_success_chance_value')|0]% / 失败率：[SCOPE.ScriptValue('rol_expedition_display_failure_chance_value')|0]%#!"
 rol_quest_carthage.1002.a.flavor:0 "在古战回响感染活人之前先压碎它。"
 rol_quest_carthage.1002.b.flavor:0 "以见证者与解释者的姿态回应亡者，而不是沦为猎物。"
 rol_quest_carthage.1002.c.flavor:0 "在亡城夺走活人心智之前离开。"

 rol_quest_carthage.1020.t:0 "灰烬退去"
 rol_quest_carthage.1020.desc:0 "幻象中战象的冲锋逐渐淡成封墓雷鸣般的遥远震动。随着寒意进一步凝实，一束更清澈的星光穿过灰幕，照向内殿石台。自迦太基覆灭以来被圣所死死守住的东西，如今已不再对你隐藏，只剩下那最后一层悲愿仍在顽固防守。"
 rol_quest_carthage.1020.a:0 "继续前压。"
 rol_quest_carthage.1020.a.flavor:0 "抓住重新稳定的局面，逼近圣所核心。"

 rol_quest_carthage.1021.t:0 "亡军压垮了活人"
 rol_quest_carthage.1021.desc:0 "灰烬已不再只是记忆，而成了一种推动人群崩裂的动势。它把恐慌变成命令，把命令变成惊惧，再把惊惧变成整支队伍的塌陷。直到这一刻你才意识到，这片废墟几乎已经教会你的部下如何赴死，而不是如何继续撑下去。"
 rol_quest_carthage.1021.a:0 "全员撤出。"
 rol_quest_carthage.1021.a.flavor:0 "在遗迹替你完成毁灭前立刻脱离。"

 rol_quest_carthage.1022.t:0 "离开内殿"
 rol_quest_carthage.1022.desc:0 "你在纪律尚未完全崩散前主动切断深入。没人会把这次撤离错认成安全。圣所只是允许你离开，却并未真正屈服；它不过是暂时决定不在此刻此地把你们全部埋进灰里。"
 rol_quest_carthage.1022.a:0 "到此为止。"
 rol_quest_carthage.1022.a.flavor:0 "用主动撤离保住最后的控制。"

 rol_quest_carthage.1050.t:0 "石台旁的争论"
 rol_quest_carthage.1050.desc:0 "在最终内殿前，整支队列围着一座覆满黑灰与盐晶的石台短暂停住。一位受邀宾客主张先稳住呼吸、队形与心神，再去面对最后的逼近；另一人则盯着圣所上方那道冰冷光柱，低声警告这种遗迹最擅长吞食迟疑——你每花一刻收拢勇气，也许就等于让神庙多花一刻重新收紧自己的意志。"
 rol_quest_carthage.1050.a:0 "先稳住全队。"
 rol_quest_carthage.1050.b:0 "不拖延，现在就压过去。"
 rol_quest_carthage.1050.a.flavor:0 "在向圣所索要最终回答前，先把秩序重新握紧。"
 rol_quest_carthage.1050.b.flavor:0 "不给遗迹重新合拢意志的时间。"

 rol_quest_carthage.1001.t:0 "浴火金面"
 rol_quest_carthage.1001.desc:0 "一道星寒般的光矛从破裂穹顶直落下来，钉在风化石台之上。熔金、死灰与一座城市被焚成传说后的残味之间，静静躺着那张曾在迦太基选择毁灭而非屈服之夜被带入沙海的面具。哪怕还未触碰，它给人的感觉也不像一件财富，而更像一条在制造者死去后依旧存活下来的命令。"
 rol_quest_carthage.1001.desc.tier_4:0 "当你的手指真正扣住那层黄金时，整座圣所并没有反抗。面具中的刺骨寒意没有折断你，反而被你压弯；一个失落强权的悲愿，也在这一刻凝成更坚硬的东西——纪律、统御，以及一座城市站着迎向灭亡时才会有的可怖平静。汉尼拔未竟的抗争并没有附体，它只是承认了你。"
 rol_quest_carthage.1001.desc.below_tier4:0 "当你触到黄金的瞬间，极寒便沿着骨髓蔓延开来。圣所最后的誓约拒绝为你断裂。你所能做的，只是从石台前踉跄退开，明白自己确实抵达了真相，却依旧不足以将其真正驯服。"
 rol_quest_carthage.1001.desc.partial:0 "圣所拒绝交出面具，但你仍带回了足以证明传说真实存在的灰烬刻痕。完整圣物还需要下一次深入。"
 rol_quest_carthage.1001.a:0 "让旧日地中海再次记住我。"
 rol_quest_carthage.1001.a.tt:0 "若最终门槛被你突破，你将夺得面具；否则本次远征失败并进入2年冷却。"
 rol_quest_carthage.1001.a.flavor:0 "亲手夺取那最后的回答，或被它当场拒绝。"

 rol_quest_carthage.1090.t:0 "黑沙远征结算"
 rol_quest_carthage.1090.desc.success_4.standard:0 "你穿过黑沙、亡军回响与一座死去帝国最后的誓约，把埋在迦太基灰烬下的答案带回了现世。任何见到这份战利的人都不会再把这场远征视为单纯掠夺——那是征服。\n\n$EFFECT_LIST_BULLET$获得圣物：#P $artifact_rol_ash_forged_mask$#!\n$EFFECT_LIST_BULLET$获得 #P +320#! [prestige|E]\n$EFFECT_LIST_BULLET$获得 #P +140#! [piety|E]\n$EFFECT_LIST_BULLET$本次整备档位未提供额外凯旋奖励"
 rol_quest_carthage.1090.desc.success_4.high:0 "你穿过黑沙、亡军回响与一座死去帝国最后的誓约，把埋在迦太基灰烬下的答案带回了现世。任何见到这份战利的人都不会再把这场远征视为单纯掠夺——那是征服。\n\n$EFFECT_LIST_BULLET$获得圣物：#P $artifact_rol_ash_forged_mask$#!\n$EFFECT_LIST_BULLET$获得 #P +320#! [prestige|E]\n$EFFECT_LIST_BULLET$获得 #P +140#! [piety|E]\n$EFFECT_LIST_BULLET$因高等整备额外获得 #P +150#! [prestige|E] 与 #P +25#! [dynasty_prestige|E]"
 rol_quest_carthage.1090.desc.success_4.supreme:0 "你穿过黑沙、亡军回响与一座死去帝国最后的誓约，把埋在迦太基灰烬下的答案带回了现世。任何见到这份战利的人都不会再把这场远征视为单纯掠夺——那是征服。\n\n$EFFECT_LIST_BULLET$获得圣物：#P $artifact_rol_ash_forged_mask$#!\n$EFFECT_LIST_BULLET$获得 #P +320#! [prestige|E]\n$EFFECT_LIST_BULLET$获得 #P +140#! [piety|E]\n$EFFECT_LIST_BULLET$因极致整备额外获得 #P +350#! [prestige|E] 与 #P +50#! [dynasty_prestige|E]"
 rol_quest_carthage.1090.desc.success_3:0 "你把这座埋藏圣所逼开到了绝大多数活人都难以承受的程度。哪怕尚未做到绝对掌控，这场远征也已开始改写后世讲述迦太基的方式。"
 rol_quest_carthage.1090.desc.success_2:0 "你在盐尘、死灰与战争幻象中稳住了整支队列，并带回了足以证明地下传说并非杜撰的证据。这不是完整胜利，却也是不容否认的胜利。"
 rol_quest_carthage.1090.desc.success_1:0 "你几乎是被遗迹放生般逃出了这场黑沙下探，却也带回了远超流言的东西。直到此刻，这场远征都更像一次被准许的幸存，而非真正轻松的凯旋。"
 rol_quest_carthage.1090.desc.failure:0 "黑沙远征被荒漠与其下方的灰烬神庙一起击碎。至少两年之内，都很难再说服任何人去重新试探那道埋藏誓约。"
 rol_quest_carthage.1090.desc.fallback:0 "这场突尼斯远征已经结束。"
 rol_quest_carthage.1090.a:0 "记下结果。"
 rol_quest_carthage.1090.a.flavor:0 "把这场远征的结局写进记录。"

 activity_rol_seek_ash_forged_mask:0 "浴火金面远征"
 activity_rol_seek_ash_forged_mask_desc:0 "你将穿越突尼斯外的黑沙地带，顺着被风暴剥开的凶兆与遗迹深入一座埋藏的迦太基圣所，逼迫那道在城市焚灭之夜被带入沙海的最后誓约作出回答。"
 activity_rol_seek_ash_forged_mask_host_desc:0 "$BULLET_WITH_TAB$可通过$rol_option_expedition_preparation$活动选项调整整备档位\n$BULLET_WITH_TAB$失败会立刻终止远征并进入2年冷却"
 activity_rol_seek_ash_forged_mask_guest_desc:0 ""
 activity_rol_seek_ash_forged_mask_conclusion_desc:0 "外层沙痕很快会再次被风掩埋，但那座地下神庙已经对你作出了回答。"
 activity_rol_seek_ash_forged_mask_conclusion_desc_success_4:0 "你彻底征服了圣所最后的拒绝，并夺得了它守护的答案。"
 activity_rol_seek_ash_forged_mask_conclusion_desc_success_3:0 "你几乎完整压过了灰烬神庙的回应。"
