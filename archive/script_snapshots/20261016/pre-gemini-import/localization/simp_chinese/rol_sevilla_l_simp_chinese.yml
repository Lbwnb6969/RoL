 activity_rol_seek_astrolabe_of_ocean_special_type_bar_segment_2_tt:0 "$activity_rol_seek_astrolabe_of_ocean_special_type_bar_segment_tt_2$"
 activity_rol_seek_astrolabe_of_ocean_special_type_bar_segment_3_tt:0 "$activity_rol_seek_astrolabe_of_ocean_special_type_bar_segment_tt_3$"
 activity_rol_seek_astrolabe_of_ocean_special_type_bar_segment_4_tt:0 "$activity_rol_seek_astrolabe_of_ocean_special_type_bar_segment_tt_4$"

 phase_rol_astrolabe_voyage_phase:0 "塞维利亚远洋航程"
 phase_rol_astrolabe_voyage_phase_desc:0 "你的舰队正驶向塞维利亚之外那条通往隐藏海域的航线。"
 rol_astrolabe_voyage_phase:0 "$phase_rol_astrolabe_voyage_phase$"
 rol_astrolabe_voyage_phase_desc:0 "$phase_rol_astrolabe_voyage_phase_desc$"

 rol_seek_astrolabe_of_ocean_cost_desc:0 "航海筹备、走私海图与深海补给"
 rol_astrolabe_quest_on_cooldown_tt:0 "你最近一次大洋远征失败了，必须等待 2 年后再试。"
 rol_astrolabe_quest_cooldown_modifier:0 "星盘远征冷却"
 rol_astrolabe_quest_cooldown_modifier_desc:0 "上一次驶入未知之海的远征以失败告终，船只与船员都需要时间恢复。"
 TRAVEL_NAME_FOR_activity_rol_seek_astrolabe_of_ocean:0 "[Character.GetFirstNameNoTooltip]的大洋远征"

 rol_astrolabe_activity_success_toast_title:0 "大洋远征成功"
 rol_astrolabe_activity_failure_toast_title:0 "大洋远征失败"
 rol_astrolabe_activity_success_toast_desc:0 "镜海向你屈服，你的舰队带着新时代航海的征兆归来。"
 rol_astrolabe_activity_failure_toast_desc:0 "大洋远征已经崩解。你的舰队必须整备后才能再次出航。"
