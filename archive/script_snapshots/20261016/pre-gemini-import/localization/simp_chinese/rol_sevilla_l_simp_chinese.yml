l_simp_chinese:
 rol_astrolabe_of_ocean:0 "大洋统御星盘"
 rol_astrolabe_of_ocean_desc:0 "一件刻满星轨的远洋配饰，幽蓝指针无视一切凡间罗盘。水手们发誓，它总能在风起之前先听见潮汐。"
 artifact_rol_astrolabe_of_ocean:0 "大洋统御星盘"
 artifact_rol_astrolabe_of_ocean_desc:0 "以陨星金属与沉船龙骨锻成，它只会指向任何海图都不该知晓的地平线。"

 rol_quest_sevilla.0990.t:0 "特里亚纳码头"
 rol_quest_sevilla.0990.desc:0 "你的远征队在塞维利亚躁动不安的港湾集结，瓜达尔基维尔河上的灯火随波摇曳。流言、走私海图和目光凶悍的老水手都指向同一个不可能的承诺：穿过直布罗陀的隐秘海湾之后，有一条通向从未被任何国度统治过之海的航线。"
 rol_quest_sevilla.0990.a:0 "起锚。趁胆气未冷，立即出航。"

 rol_quest_sevilla.1000.t:0 "海峡走私者"
 rol_quest_sevilla.1000.desc:0 "在一处充满走私者与破船残骸的恶臭海湾里，你必须招募那些真正从海上狂怒中活下来的舵手。每一位船长都要金币、敬意，或一份你不会把他们带去白白送死的证明。"
 rol_quest_sevilla.1000.a:0 "用远见与交涉说服他们。"
 rol_quest_sevilla.1000.b:0 "以意志与威压掌控海湾。"
 rol_quest_sevilla.1000.c:0 "局势太不稳定了，回港。"
 rol_quest_sevilla.1000.a.base_tt:0 "[diplomacy|E]检定。"
 rol_quest_sevilla.1000.a.odds_elite_tt:0 "此举对当前试炼可谓 #P把握极高#!。"
 rol_quest_sevilla.1000.a.odds_high_tt:0 "此举目前 #P胜算较高#!。"
 rol_quest_sevilla.1000.a.odds_low_tt:0 "此举仍是 #N高风险豪赌#!。"
 rol_quest_sevilla.1000.b.base_tt:0 "[martial|E]/[prowess|E]检定。"
 rol_quest_sevilla.1000.b.odds_elite_tt:0 "此举对当前试炼可谓 #P把握极高#!。"
 rol_quest_sevilla.1000.b.odds_high_tt:0 "此举目前 #P胜算较高#!。"
 rol_quest_sevilla.1000.b.odds_low_tt:0 "此举仍是 #N高风险豪赌#!。"
 rol_quest_sevilla.1000.c.tt:0 "你中止本次远征，并进入 2 年冷却。"

 rol_quest_sevilla.1010.t:0 "海湾回应了你"
 rol_quest_sevilla.1010.desc:0 "金币易手，誓言落定，满身伤疤的领航员终于登上你的舰队。你的远征不再只是流言——它已经成为一支真正扬帆的力量。"
 rol_quest_sevilla.1010.a:0 "朝黑色地平线前进。"
 rol_quest_sevilla.1011.t:0 "海湾反噬"
 rol_quest_sevilla.1011.desc:0 "威胁、贪婪与恐惧同时爆发。走私者四散，船员逃离，你的事业甚至还没抵达真正的大海便已崩解。"
 rol_quest_sevilla.1011.a:0 "这场航行结束了。"
 rol_quest_sevilla.1012.t:0 "锚链仍在"
 rol_quest_sevilla.1012.desc:0 "你下令让舰队有序回到港内。与其把船只和人命葬送给一个尚未准备向你屈服的传说，不如保存力量。"
 rol_quest_sevilla.1012.a:0 "我们会重新准备。"

 rol_quest_sevilla.1002.t:0 "磁暴风墙"
 rol_quest_sevilla.1002.desc:0 "在世界尽头，天空流淌着紫红色的血光，所有罗盘都疯狂打转。黑雾在海面上盘绕，耳边不断有人惊呼星辰正在坠海。若想穿过这堵风墙，你必须先统御恐惧本身。"
 rol_quest_sevilla.1002.a:0 "在混乱中解读天穹。"
 rol_quest_sevilla.1002.b:0 "以铁腕后勤稳住舰队。"
 rol_quest_sevilla.1002.c:0 "在海洋吞噬我们前返航。"
 rol_quest_sevilla.1002.a.base_tt:0 "[learning|E]检定。"
 rol_quest_sevilla.1002.a.odds_elite_tt:0 "此举对当前试炼可谓 #P把握极高#!。"
 rol_quest_sevilla.1002.a.odds_high_tt:0 "此举目前 #P胜算较高#!。"
 rol_quest_sevilla.1002.a.odds_low_tt:0 "此举仍是 #N高风险豪赌#!。"
 rol_quest_sevilla.1002.b.base_tt:0 "[stewardship|E]检定。"
 rol_quest_sevilla.1002.b.odds_elite_tt:0 "此举对当前试炼可谓 #P把握极高#!。"
 rol_quest_sevilla.1002.b.odds_high_tt:0 "此举目前 #P胜算较高#!。"
 rol_quest_sevilla.1002.b.odds_low_tt:0 "此举仍是 #N高风险豪赌#!。"
 rol_quest_sevilla.1002.c.tt:0 "你中止本次远征，并进入 2 年冷却。"

 rol_quest_sevilla.1020.t:0 "穿过死寂之海"
 rol_quest_sevilla.1020.desc:0 "你冲破风墙，驶入一片平滑如镜的海域。恐慌逐渐松动，在寂静水面的中央，有某种古老之物开始发光。"
 rol_quest_sevilla.1020.a:0 "向那道光前进。"
 rol_quest_sevilla.1021.t:0 "大海吞没弱者"
 rol_quest_sevilla.1021.desc:0 "伪星、疯狂的舵手与高压呼啸撕裂了舰队的协同。这支船队再也撑不过这片诅咒海域中的下一段航程。"
 rol_quest_sevilla.1021.a:0 "发出全面撤退信号。"
 rol_quest_sevilla.1022.t:0 "从风墙撤退"
 rol_quest_sevilla.1022.desc:0 "你选择生存而非执念。舰队调头离开深渊，让那片未知之海继续在浓雾之后沉思。"
 rol_quest_sevilla.1022.a:0 "我们还能再次扬帆。"

 rol_quest_sevilla.1050.t:0 "浪间低语"
 rol_quest_sevilla.1050.desc:0 "受邀同行者在雾中听见海歌。一人主张稍作停顿以稳住船员，另一人则坚持认为迟疑只会助长甲板上的迷信。"
 rol_quest_sevilla.1050.a:0 "先稳住水手，再继续推进。"
 rol_quest_sevilla.1050.b:0 "压下恐惧，强行提速。"

 rol_quest_sevilla.1001.t:0 "镜海中的星盘"
 rol_quest_sevilla.1001.desc:0 "在死寂如镜的海中央，星盘像第二轮月亮般悬浮于水面之上。你伸手触碰时，黄铜齿轮苏醒，整片海域都仿佛在等待裁决。"
 rol_quest_sevilla.1001.desc.tier_4:0 "光辉自齿轮之间迸发，仿佛黎明本身被囚于圣物内部。整支舰队都见证了新时代航海的征兆，而大洋统御星盘终归属于你。"
 rol_quest_sevilla.1001.desc.below_tier4:0 "最终和鸣从你指间滑落。光辉沉入镜海，海水拒绝了你的宣告。"
 rol_quest_sevilla.1001.desc.partial:0 "最终和鸣从你指间滑落，但航海者保住了一段可用的航线残迹。大洋统御星盘暂时仍未归你所有。"
 rol_quest_sevilla.1001.a:0 "让一切地平线都向我屈服。"
 rol_quest_sevilla.1001.a.tt:0 "唯有最终回响完整归于你手，你才能把这道异象带回人间；否则本次远征失败并进入2年冷却。"

 rol_quest_sevilla.1090.t:0 "大洋远征结算"
 rol_quest_sevilla.1090.desc.success_4.standard:0 "这是一场传奇航行。你突破风墙，驾驭镜海，并带回了一件足以改写航海时代的圣物。\n\n$EFFECT_LIST_BULLET$获得圣物：#P $artifact_rol_astrolabe_of_ocean$#!\n$EFFECT_LIST_BULLET$获得 #P +350#! [prestige|E]\n$EFFECT_LIST_BULLET$获得 #P +150#! [gold|E]\n$EFFECT_LIST_BULLET$本次整备档位未提供额外凯旋奖励"
 rol_quest_sevilla.1090.desc.success_4.high:0 "这是一场传奇航行。你突破风墙，驾驭镜海，并带回了一件足以改写航海时代的圣物。\n\n$EFFECT_LIST_BULLET$获得圣物：#P $artifact_rol_astrolabe_of_ocean$#!\n$EFFECT_LIST_BULLET$获得 #P +350#! [prestige|E]\n$EFFECT_LIST_BULLET$获得 #P +150#! [gold|E]\n$EFFECT_LIST_BULLET$因高等整备额外获得 #P +150#! [prestige|E] 与 #P +25#! [dynasty_prestige|E]"
 rol_quest_sevilla.1090.desc.success_4.supreme:0 "这是一场传奇航行。你突破风墙，驾驭镜海，并带回了一件足以改写航海时代的圣物。\n\n$EFFECT_LIST_BULLET$获得圣物：#P $artifact_rol_astrolabe_of_ocean$#!\n$EFFECT_LIST_BULLET$获得 #P +350#! [prestige|E]\n$EFFECT_LIST_BULLET$获得 #P +150#! [gold|E]\n$EFFECT_LIST_BULLET$因极致整备额外获得 #P +350#! [prestige|E] 与 #P +50#! [dynasty_prestige|E]"
 rol_quest_sevilla.1090.desc.success_3:0 "这是一场极为出色的远征，你以纪律与胆识把不可能的海域化为可通行之路。"
 rol_quest_sevilla.1090.desc.success_2:0 "你以高昂代价赢得了胜利，至少证明你的舰队足以抵达世界尽头。"
 rol_quest_sevilla.1090.desc.success_1:0 "你以微弱优势幸存下来，但旗帜依旧带着荣耀返回。"
 rol_quest_sevilla.1090.desc.failure:0 "舰队在未知之海前崩解。你现在需要 2 年时间恢复整备。"
 rol_quest_sevilla.1090.desc.fallback:0 "海洋重新归于沉寂，但传说仍未熄灭。"
 rol_quest_sevilla.1090.a:0 "把这次航行写入档案。"

 activity_rol_seek_astrolabe_of_ocean:0 "大洋统御星盘远征"
 activity_rol_seek_astrolabe_of_ocean_desc:0 "从塞维利亚启航，驶向风墙之后那些只在耳语中出现的异海光兆。"
 activity_rol_seek_astrolabe_of_ocean_host_desc:0 "$BULLET_WITH_TAB$可通过$rol_option_expedition_preparation$活动选项调整整备档位\n$BULLET_WITH_TAB$失败会立刻终止远征并进入2年冷却"
 activity_rol_seek_astrolabe_of_ocean_guest_desc:0 ""
 activity_rol_seek_astrolabe_of_ocean_conclusion_desc:0 "你的舰队在迷雾、群星与不可能之海中归来。"
 activity_rol_seek_astrolabe_of_ocean_conclusion_desc_success_4:0 "你以世界尽头之海的统御者身份归来。"
 activity_rol_seek_astrolabe_of_ocean_conclusion_desc_success_3:0 "你的舰队以严整纪律劈开了风墙。"
 activity_rol_seek_astrolabe_of_ocean_conclusion_desc_success_2:0 "你承受了惨重损失，但远征仍被保全。"
 activity_rol_seek_astrolabe_of_ocean_conclusion_desc_success_1:0 "这是一场靠顽强意志赢下的险胜。"
 activity_rol_seek_astrolabe_of_ocean_conclusion_desc_failure:0 "远征失败，并进入2年冷却。"
 activity_rol_seek_astrolabe_of_ocean_conclusion_desc_fallback:0 "远征已经结束。"
 activity_rol_seek_astrolabe_of_ocean_selection_tooltip:0 "从塞维利亚出航，穿过走私者海湾、磁暴风墙与风墙之后被人低声提起的寂静海域。\n\n失败会立刻终止远征并进入2年冷却。"
 activity_rol_seek_astrolabe_of_ocean_predicted_cost:0 "本次航行的总花费，将高度取决于你选择的人手与装备档位。"
 activity_rol_seek_astrolabe_of_ocean_province_desc:0 "目标地点：[ROOT.Province.GetName]"

 activity_rol_seek_astrolabe_of_ocean_special_type_title:0 "驭海掌控度"
 activity_rol_seek_astrolabe_of_ocean_special_type_desc:0 "你的抉择会决定舰队对禁忌航路的掌控到何种程度。唯有最深的驾驭，才会换来海洋最后的回应。"
 ROL_ASTROLABE_WINDOW_SPECIAL_PROGRESS_TOOLTIP:0 "当前驭海掌控度：[ActivityWindow.GetSpecialProgressValue|0^V]"
 activity_rol_seek_astrolabe_of_ocean_special_type_bar_segment_tt_0:0 "#T 破碎#!\n海洋拒绝你的统御。"
 activity_rol_seek_astrolabe_of_ocean_special_type_bar_segment_tt_1:0 "#T 动摇#!\n舰队仍勉强维持完整。"
 activity_rol_seek_astrolabe_of_ocean_special_type_bar_segment_tt_2:0 "#T 适航#!\n纪律与直觉开始合拍。"
 activity_rol_seek_astrolabe_of_ocean_special_type_bar_segment_tt_3:0 "#T 掌舵#!\n你的舰队正在征服未知海域。"
 activity_rol_seek_astrolabe_of_ocean_special_type_bar_segment_tt_4:0 "#T 终幕天涯#!\n世界尽头的海水几乎就要回应你。"
